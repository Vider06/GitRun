# cargo-audit scans the complete Cargo.lock, including optional dependency
# entries that Cargo resolves for feature-unification. jsonwebtoken 10.x keeps
# rsa in that lockfile even when the workspace selects the aws-lc-rs backend.
# GitRun does not enable jsonwebtoken's rust_crypto feature, so RUSTSEC-2023-0071
# is not part of the compiled dependency graph. cargo-deny performs the graph-aware
# advisory check separately in CI and must continue to pass without this exception.

[advisories]
ignore = [
    "RUSTSEC-2023-0071",
]
