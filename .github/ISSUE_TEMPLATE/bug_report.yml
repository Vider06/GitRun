name: Bug report
description: Report a reproducible problem in GitRun.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include tokens, credentials, private keys, runtime environment files, or other secrets.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
      placeholder: Tell us what you expected and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GitRun version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized logs. Remove tokens, credentials, emails, and private infrastructure details.
      render: shell

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable reproduction.
    validations:
      required: true
