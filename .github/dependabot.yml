version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # vstd is coupled to the pinned Verus binary and its Rust toolchain.
    # Update it only through a coordinated Verus + vstd change, never via Dependabot alone.
    ignore:
      - dependency-name: vstd
    # Keep the workspace dependency graph in one version-update PR.
    groups:
      workspace-crates:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /crates/gitrun-dashboard-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker/manager-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker/runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
