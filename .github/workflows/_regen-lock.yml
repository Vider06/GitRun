name: Temporary lock regeneration

on:
  push:
    branches: [BigRework]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-lock-regeneration-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-common-v8-

      - name: Regenerate Cargo.lock
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: ${{ github.workspace }}/.gitrun-ci/cargo
          RUSTUP_HOME: ${{ github.workspace }}/.gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUST_VERSION: "1.98.1"
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
              https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --no-modify-path
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo generate-lockfile
          test -s Cargo.lock
          sha256sum Cargo.lock

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: regenerate Cargo.lock after dashboard removal"
          git push origin HEAD:BigRework

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
