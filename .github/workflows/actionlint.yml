name: Premade Actionlint

on:
  push:
    branches: [feat/gitrun-premade]
    paths:
      - .github/workflows/**
  pull_request:
    branches: [feat/gitrun-premade]
    paths:
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
