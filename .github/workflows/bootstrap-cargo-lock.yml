name: Bootstrap Cargo lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate and commit Cargo.lock
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          rm .github/workflows/bootstrap-cargo-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/bootstrap-cargo-lock.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "build: pin Rust dependencies"
          git push origin HEAD:main
