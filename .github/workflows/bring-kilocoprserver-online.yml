name: Bring KiloCoprServer online

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitrun/kilocoprserver-online.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bring-online:
    runs-on: [self-hosted, Linux, X64, gitrun-ci]
    timeout-minutes: 5
    steps:
      - name: Create manual runner through GitRun manager
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import socket
          import time

          API = "http://localhost"
          SOCK = "/var/run/docker.sock"
          REPO = "Vider06/GitRun"
          NAME = "KiloCoprServer"
          LABELS = "self-hosted,Linux,X64,gitrun-temporary,main,gitrun-admin"

          def request(method, path, body=None):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.connect(SOCK)
              payload = b"" if body is None else json.dumps(body).encode()
              req = (
                  f"{method} {path} HTTP/1.1\r\n"
                  "Host: localhost\r\n"
                  "Connection: close\r\n"
                  "Content-Type: application/json\r\n"
                  f"Content-Length: {len(payload)}\r\n\r\n"
              ).encode() + payload
              s.sendall(req)
              data = b""
              while True:
                  chunk = s.recv(65536)
                  if not chunk:
                      break
                  data += chunk
              s.close()
              head, _, raw = data.partition(b"\r\n\r\n")
              status = int(head.splitlines()[0].split()[1])
              return status, raw

          def docker_exec(command):
              status, raw = request("POST", "/containers/gitrun-manager/exec", {
                  "AttachStdout": True,
                  "AttachStderr": True,
                  "Tty": False,
                  "Cmd": command,
              })
              if status >= 300:
                  raise RuntimeError(f"docker exec create failed: HTTP {status}: {raw[:500]!r}")
              info = json.loads(raw)
              exec_id = info["Id"]
              status, raw = request("POST", f"/exec/{exec_id}/start", {
                  "Detach": False,
                  "Tty": False,
              })
              if status >= 300:
                  raise RuntimeError(f"docker exec start failed: HTTP {status}: {raw[:500]!r}")
              return raw

          script = r'''
          import os, subprocess, time
          import sys
          sys.path.insert(0, "/opt/gitrun")
          from gitrun_manager import registration_token, split_repo, list_runners

          repo = os.environ.get("GITRUN_REPOSITORIES", "").split(",")[0].strip() or "Vider06/GitRun"
          name = "KiloCoprServer"
          labels = "self-hosted,Linux,X64,gitrun-temporary,main,gitrun-admin"
          image = os.environ.get("GITRUN_RUNNER_IMAGE", "gitrun-runner:latest")
          token = registration_token(repo)
          gid = str(os.stat("/var/run/docker.sock").st_gid)

          probe = subprocess.run(
              ["docker", "inspect", name],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              check=False,
          )
          if probe.returncode == 0:
              state = subprocess.run(
                  ["docker", "inspect", "-f", "{{.State.Running}}", name],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False,
              )
              if state.stdout.strip().lower() == "true":
                  print("KiloCoprServer container already running")
              else:
                  subprocess.run(["docker", "rm", "-f", name], check=False)

          probe = subprocess.run(
              ["docker", "volume", "inspect", f"{name}-data"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False,
          )
          if probe.returncode != 0:
              subprocess.run(["docker", "volume", "create", f"{name}-data"], check=True, stdout=subprocess.DEVNULL)

          cmd = [
              "docker", "run", "-d",
              "--name", name,
              "--restart", "unless-stopped",
              "--cpus", os.environ.get("GITRUN_CONTAINER_CPUS", "1"),
              "--memory", os.environ.get("GITRUN_CONTAINER_MEMORY", "1g"),
              "--pids-limit", os.environ.get("GITRUN_CONTAINER_PIDS", "1024"),
              "--read-only",
              "--tmpfs", "/tmp:rw,nosuid,nodev,size=256m",
              "--mount", f"type=volume,source={name}-data,target=/home/runner/actions-runner",
              "--mount", "type=volume,source=gitrun-runner-shared,target=/var/lib/gitrun/shared",
              "--volume", "/var/run/docker.sock:/var/run/docker.sock",
              "--group-add", gid,
              "-e", f"RUNNER_URL=https://github.com/{repo}",
              "-e", f"RUNNER_TOKEN={token}",
              "-e", f"RUNNER_NAME={name}",
              "-e", f"RUNNER_LABELS={labels}",
              "-e", "RUNNER_EPHEMERAL=false",
              "-e", "RUNNER_DISABLE_UPDATE=false",
              "-e", "GITRUN_SHARED_CACHE_DIR=/var/lib/gitrun/shared",
              "-e", "CARGO_HOME=/var/lib/gitrun/shared/cargo",
              "-e", "CARGO_TARGET_DIR=/var/lib/gitrun/shared/cargo-target/KiloCoprServer",
              "-e", "PIP_CACHE_DIR=/var/lib/gitrun/shared/pip",
              "-e", "NPM_CONFIG_CACHE=/var/lib/gitrun/shared/npm",
              "-e", "DOCKER_CONFIG=/tmp/docker-config",
              image,
          ]
          subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL)

          deadline = time.time() + 60
          while time.time() < deadline:
              runners = list_runners(repo)
              runner = next((r for r in runners if r.get("name") == name), None)
              if runner:
                  print(f"KiloCoprServer: status={runner.get('status')} busy={runner.get('busy')}")
                  if runner.get("status") == "online":
                      raise SystemExit(0)
              time.sleep(3)

          print("KiloCoprServer did not report online within 60s", file=sys.stderr)
          raise SystemExit(1)
          '''

          encoded = __import__("base64").b64encode(script.encode()).decode()
          output = docker_exec(["python3", "-c", "import base64; exec(base64.b64decode(" + repr(encoded) + "))"])
          clean = output.replace(b"\x00", b"")
          print(clean.decode("utf-8", errors="replace"))
          PY

      - name: Record runner online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .gitrun
          printf 'KiloCoprServer online\ncommit=%s\nrecorded_at=%s\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .gitrun/kilocoprserver-online.txt
          content="$(base64 -w0 .gitrun/kilocoprserver-online.txt)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/.gitrun/kilocoprserver-online.txt" --jq ".sha" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.gitrun/kilocoprserver-online.txt" \
              -f message="ops: record KiloCoprServer online" \
              -f content="$content" \
              -f sha="$existing" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.gitrun/kilocoprserver-online.txt" \
              -f message="ops: record KiloCoprServer online" \
              -f content="$content" \
              -f branch=main >/dev/null
          fi
          echo "Recorded KiloCoprServer online."
