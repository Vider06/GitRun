name: Cargo Lock Maintenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "crates/gitrun-setup/src/runner-bootstrap.lock"

permissions:
  contents: write
  pull-requests: write

jobs:
  repair-locks:
    name: Verify and repair all Cargo lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Verify and repair Cargo lockfiles
        id: repair
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          workdir="$RUNNER_TEMP/cargo-lock-maintenance"
          rm -rf "$workdir"
          mkdir -p "$workdir"

          mapfile -t locks < <(
            git ls-files -z |
              tr '\0' '\n' |
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                if [ "${path##*/}" = "Cargo.lock" ] || head -n 1 "$path" 2>/dev/null | grep -q '^# This file is automatically @generated by Cargo\.'; then
                  printf '%s\n' "$path"
                fi
              done
          )

          echo "Discovered Cargo lockfiles (${#locks[@]}):"
          printf '  - %s\n' "${locks[@]}"

          if [ "${#locks[@]}" -eq 0 ]; then
            echo "No Cargo lockfiles found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          failures=()

          repair_lock() {
            local lock="$1"
            local manifest="$2"
            local root="$3"
            local generated="$workdir/generated.lock"

            rm -f "$generated"
            cargo generate-lockfile --manifest-path "$manifest" --locked=false

            if [ ! -f "$root/Cargo.lock" ]; then
              echo "::error::Cargo did not generate a lockfile for $lock"
              return 1
            fi

            cp "$root/Cargo.lock" "$generated"

            if ! cmp -s "$generated" "$lock"; then
              cp "$generated" "$lock"
              changed=true
              echo "🔧 repaired: $lock"
            else
              echo "✅ valid: $lock"
            fi
          }

          for lock in "${locks[@]}"; do
            case "$lock" in
              Cargo.lock)
                if ! cargo generate-lockfile --manifest-path Cargo.toml; then
                  failures+=( "$lock" )
                  echo "::error::failed to regenerate $lock"
                elif git diff --quiet -- "$lock"; then
                  echo "✅ valid: $lock"
                else
                  changed=true
                  echo "🔧 repaired: $lock"
                fi
                ;;
              crates/gitrun-setup/src/runner-bootstrap.lock)
                bootstrap="$workdir/bootstrap"
                rm -rf "$bootstrap"
                mkdir -p "$bootstrap/crates"
                cat > "$bootstrap/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "crates/gitrun-core",
            "crates/gitrun-exe",
            "crates/gitrun-gsr",
          ]
          EOF

                cp -a crates/gitrun-core "$bootstrap/crates/"
                cp -a crates/gitrun-exe "$bootstrap/crates/"
                cp -a crates/gitrun-gsr "$bootstrap/crates/"
                cp "$lock" "$bootstrap/Cargo.lock"

                if ! cargo generate-lockfile --manifest-path "$bootstrap/Cargo.toml"; then
                  failures+=( "$lock" )
                  echo "::error::failed to regenerate $lock"
                elif ! cmp -s "$bootstrap/Cargo.lock" "$lock"; then
                  cp "$bootstrap/Cargo.lock" "$lock"
                  changed=true
                  echo "🔧 repaired: $lock"
                else
                  echo "✅ valid: $lock"
                fi
                ;;
              *)
                failures+=( "$lock" )
                echo "::error::No validation context is defined for $lock"
                ;;
            esac
          done

          if [ "${#failures[@]}" -ne 0 ]; then
            printf '%s\n' "Unrepairable lockfiles:" "${failures[@]}"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Validate repaired lockfiles
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cargo tree --manifest-path Cargo.toml --workspace --locked --depth 0

          bootstrap="$RUNNER_TEMP/cargo-lock-maintenance/validate-bootstrap"
          rm -rf "$bootstrap"
          mkdir -p "$bootstrap/crates"
          cat > "$bootstrap/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "crates/gitrun-core",
            "crates/gitrun-exe",
            "crates/gitrun-gsr",
          ]
          EOF

          cp -a crates/gitrun-core "$bootstrap/crates/"
          cp -a crates/gitrun-exe "$bootstrap/crates/"
          cp -a crates/gitrun-gsr "$bootstrap/crates/"
          cp crates/gitrun-setup/src/runner-bootstrap.lock "$bootstrap/Cargo.lock"

          cargo tree --manifest-path "$bootstrap/Cargo.toml" --workspace --locked --depth 0

      - name: Commit repaired lockfiles
        if: steps.repair.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- Cargo.lock crates/gitrun-setup/src/runner-bootstrap.lock
          git commit -m "chore: repair Cargo lockfiles"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::warning::Skipping automatic push for a pull request from a fork; Cargo lock repairs must be applied by the contributor."
              git reset --soft HEAD~1
              git restore --staged --worktree -- .
              echo "mode=fork" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            branch="automation/cargo-lock-repair-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git push --set-upstream origin "$branch"
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.repair.outputs.changed == 'true' && steps.commit.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated Cargo lock maintenance.

          This PR was generated by the Cargo lock maintenance workflow because it was run on main. It regenerates every supported Cargo lockfile and validates the resulting locks with cargo tree --locked.

          On pull requests from this repository, repaired lockfiles are committed directly to the PR branch. Fork pull requests are validated but are not pushed to automatically.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: repair Cargo lockfiles" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Report direct branch repair
        if: steps.repair.outputs.changed == 'true' && steps.commit.outputs.mode == 'direct'
        run: echo "Cargo lockfiles repaired directly on branch ${GITHUB_REF_NAME}."

      - name: No changes
        if: steps.repair.outputs.changed != 'true'
        run: echo "All Cargo lockfiles are already valid; no changes were committed."
