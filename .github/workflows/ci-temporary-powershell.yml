name: GitRun Temporary PowerShell CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: Temporary PowerShell validation
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install portable PowerShell
        shell: bash
        run: |
          set -euo pipefail
          version="7.5.3"
          archive="powershell-${version}-linux-x64.tar.gz"
          url="https://github.com/PowerShell/PowerShell/releases/download/v${version}/${archive}"
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          "$RUNNER_TEMP/pwsh/pwsh" --version
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Validate PowerShell syntax
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            Get-ChildItem -Recurse -Filter *.ps1 -File |
              Where-Object { $_.FullName -notmatch "[/\\]\.git[/\\]" } |
              ForEach-Object {
                $tokens = $null
                $errors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$errors
                ) | Out-Null
                if ($errors.Count -gt 0) {
                  throw "PowerShell parse errors in $($_.FullName): $($errors -join "; ")"
                }
              }
            Write-Host "PowerShell syntax validation passed."
          '
