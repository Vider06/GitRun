name: GitRun CI

on:
  push:
    branches: [main, BigRework]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  RUST_VERSION: "1.98.1"

concurrency:
  group: gitrun-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Runner environment verification
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Verify runner identity and platform
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS / $RUNNER_ARCH"
          echo "Workspace: $GITHUB_WORKSPACE"
          uname -a
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64 || test "$RUNNER_ARCH" = ARM64

      - name: Verify filesystem and writable runner directories
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE" && test -w "$GITHUB_WORKSPACE"
          test -d "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          test -d "$RUNNER_TOOL_CACHE" && test -w "$RUNNER_TOOL_CACHE"
          probe="$RUNNER_TEMP/gitrun-ci-write-test"
          printf 'ok\n' > "$probe"
          test "$(cat "$probe")" = ok
          rm -f "$probe"

      - name: Verify required commands
        shell: bash
        run: |
          set -euo pipefail
          for command in bash git curl python3 tar gzip xz sha256sum; do
            command -v "$command" >/dev/null || { echo "Missing command: $command"; exit 1; }
          done
          git --version
          curl --version | head -n 1
          python3 --version

      - name: Verify network and DNS access
        shell: bash
        run: |
          set -euo pipefail
          getent hosts github.com >/dev/null
          getent hosts api.github.com >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://api.github.com/zen >/dev/null

      - name: Verify GitHub repository access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" >/dev/null

      - name: Verify Docker access
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then echo "::warning::Docker CLI is not installed on this runner."; exit 0; fi
          docker --version
          if [ ! -S /var/run/docker.sock ]; then echo "::warning::Docker socket unavailable on this runner."; exit 0; fi
          if ! docker info; then
            echo "::warning::Docker daemon is unavailable to this runner user."
            echo "::warning::Docker diagnostics above are the actual Docker error."
            exit 0
          fi
          echo "Docker access is available."

      - name: Verify GitHub Actions environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY" && test -n "$GITHUB_SHA"
          test -n "$GITHUB_WORKSPACE" && test -n "$RUNNER_NAME"
          test -n "$RUNNER_TEMP"
          echo "GitHub Actions environment is usable."
  detect:
    name: Detect project components
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      docker: ${{ steps.detect.outputs.docker }}
      powershell: ${{ steps.detect.outputs.powershell }}
      node: ${{ steps.detect.outputs.node }}
      tauri: ${{ steps.detect.outputs.tauri }}
      dependency: ${{ steps.detect.outputs.dependency }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Detect
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          rust=false
          python=false
          docker=false
          powershell=false
          node=false
          tauri=false

          [ -f Cargo.toml ] && rust=true
          find . -name '*.py' -not -path './.git/*' -print -quit | grep -q . && python=true
          if [ -f docker-compose.yml ] || find docker -name 'Dockerfile*' -print -quit 2>/dev/null | grep -q .; then
            docker=true
          fi
          find . -name '*.ps1' -not -path './.git/*' -print -quit | grep -q . && powershell=true
          find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' -print -quit | grep -q . && node=true
          if [ -f crates/gitrun-dashboard-tauri/src-tauri/Cargo.toml ] && [ -f crates/gitrun-dashboard-tauri/package.json ]; then
            tauri=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "powershell=$powershell" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "tauri=$tauri" >> "$GITHUB_OUTPUT"

          if [ "$rust" = true ] || [ "$node" = true ]; then
            echo "dependency=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependency=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python validation
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Python runtime
        run: python3 --version
      - name: Compile Python sources
        run: python3 -m compileall -q .
      - name: Run project static checks
        run: python3 scripts/test-gitrun.py

  rust:
    name: Rust check, lint, build and tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare Rust cache directories
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR"
          test -w "$TMPDIR"
          test -w "$CARGO_HOME"
          test -w "$RUSTUP_HOME"
          test -w "$CARGO_TARGET_DIR"

      - name: Restore Rust common cache
        id: rust-common-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-common-v9-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-common-v8-

      - name: Restore Rust build target cache
        id: rust-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-target-v10-${{ hashFiles('Cargo.lock') }}
          # Deliberately no restore fallback: v10 must be a clean target cache.

      - name: Setup Rust
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
              https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup component add rustfmt clippy --toolchain "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Persist Rust toolchain paths
        shell: bash
        env:
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Report Rust cache status
        shell: bash
        env:
          COMMON_CACHE_HIT: ${{ steps.rust-common-cache.outputs.cache-hit }}
          TARGET_CACHE_HIT: ${{ steps.rust-target-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "Rust common cache hit: ${COMMON_CACHE_HIT:-false}"
          echo "Rust target cache hit: ${TARGET_CACHE_HIT:-false}"
          du -sh .gitrun-ci/cargo/registry .gitrun-ci/cargo/git .gitrun-ci/rustup target 2>/dev/null || true


      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust workspace check
        run: cargo check --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --all-targets --all-features --locked

      - name: Rust workspace clippy
        run: cargo clippy --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --all-targets --all-features --locked -- -D warnings

      - name: Rust release build
        run: cargo build --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --all-features --release --locked

      - name: Rust tests
        run: cargo test --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --all-features --locked --no-fail-fast

      - name: Rust documentation
        run: cargo doc --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --all-features --no-deps --locked

      - name: Save Rust common cache
        if: success() && steps.rust-common-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: ${{ steps.rust-common-cache.outputs.cache-primary-key }}

      - name: Save Rust build target cache
        if: success() && steps.rust-target-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ steps.rust-target-cache.outputs.cache-primary-key }}

  dependency:
    name: Dependency and supply-chain audit
    needs: detect
    if: needs.detect.outputs.dependency == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Prepare Cargo for dependency tooling
        if: needs.detect.outputs.rust == 'true'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
          CARGO_TARGET_DIR: .gitrun-ci/cargo-target
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Restore Rust common cache for dependency tooling
        id: dependency-rust-common-cache
        if: needs.detect.outputs.rust == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-common-v9-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-common-v8-

      - name: Restore Rust dependency auditor cache
        id: auditor-cache
        if: needs.detect.outputs.rust == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo-tools
            .gitrun-ci/cargo-target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-auditors-v10-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-auditors-v9-

      - name: Setup Rust for dependency tooling
        if: needs.detect.outputs.rust == 'true'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
              https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Install Rust dependency auditors
        if: needs.detect.outputs.rust == 'true'
        shell: bash
        env:
          CARGO_HOME: .gitrun-ci/cargo
          AUDITOR_ROOT: .gitrun-ci/cargo-tools
        run: |
          set -euo pipefail
          mkdir -p "$AUDITOR_ROOT/bin" "$CARGO_HOME/registry" "$CARGO_HOME/git" "$CARGO_HOME/advisory-dbs"
          export PATH="$AUDITOR_ROOT/bin:$CARGO_HOME/bin:$PATH"
          install_auditor() {
            local binary="$1"
            local package="$2"
            local version="$3"
            if [ ! -x "$AUDITOR_ROOT/bin/$binary" ]; then
              cargo install --locked --version "$version" --root "$AUDITOR_ROOT" "$package"
            fi
          }
          install_auditor cargo-audit cargo-audit 0.22.2
          install_auditor cargo-deny cargo-deny 0.20.2

          audit_version="$("$AUDITOR_ROOT/bin/cargo-audit" --version)"
          deny_version="$("$AUDITOR_ROOT/bin/cargo-deny" --version)"
          if ! grep -q 'cargo-audit 0.22.2' <<<"$audit_version"; then
            echo "::warning::Cached cargo-audit is not 0.22.2; reinstalling."
            rm -f "$AUDITOR_ROOT/bin/cargo-audit"
            cargo install --locked --version 0.22.2 --root "$AUDITOR_ROOT" cargo-audit
          fi
          if ! grep -q 'cargo-deny 0.20.2' <<<"$deny_version"; then
            echo "::warning::Cached cargo-deny is not 0.20.2; reinstalling."
            rm -f "$AUDITOR_ROOT/bin/cargo-deny"
            cargo install --locked --version 0.20.2 --root "$AUDITOR_ROOT" cargo-deny
          fi
          "$AUDITOR_ROOT/bin/cargo-audit" --version
          "$AUDITOR_ROOT/bin/cargo-deny" --version
          echo "$AUDITOR_ROOT/bin" >> "$GITHUB_PATH"

      - name: Cargo audit
        if: needs.detect.outputs.rust == 'true'
        run: cargo audit

      - name: Cargo deny advisories and bans
        if: needs.detect.outputs.rust == 'true'
        run: cargo deny check advisories bans


      - name: Save Rust dependency auditor cache
        if: needs.detect.outputs.rust == 'true' && success() && steps.auditor-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo-tools
            .gitrun-ci/cargo-target
          key: ${{ steps.auditor-cache.outputs.cache-primary-key }}

      - name: Restore npm cache for dependency audit
        id: dependency-npm-cache
        if: needs.detect.outputs.node == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-v9-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-v9-
            ${{ runner.os }}-${{ runner.arch }}-npm-v8-

      - name: Prepare npm dependencies for audit
        if: needs.detect.outputs.node == 'true'
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-ci/npm-cache
        run: |
          set -euo pipefail
          mkdir -p "$NPM_CONFIG_CACHE"
          while IFS= read -r -d '' package_json; do
            dir="$(dirname "$package_json")"
            (
              cd "$dir"
              if [ -f package-lock.json ]; then
                npm ci --ignore-scripts --no-audit --no-fund
              else
                npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              fi
            )
          done < <(find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' -print0)

      - name: Save npm dependency cache
        if: success() && needs.detect.outputs.node == 'true' && steps.dependency-npm-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/npm-cache
          key: ${{ steps.dependency-npm-cache.outputs.cache-primary-key }}

      - name: Node dependency audit
        if: needs.detect.outputs.node == 'true'
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-ci/npm-cache
        run: |
          set -euo pipefail
          mkdir -p "$NPM_CONFIG_CACHE"
          while IFS= read -r -d '' package_json; do
            dir="$(dirname "$package_json")"
            (
              cd "$dir"
              npm audit --audit-level=high
            )
          done < <(find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' -print0)

  frontend:
    name: JavaScript, TypeScript and CSS validation
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Restore npm cache
        id: frontend-npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-v9-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-v9-
            ${{ runner.os }}-${{ runner.arch }}-npm-v8-
      - name: Validate frontend packages
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-ci/npm-cache
        run: |
          set -euo pipefail
          mkdir -p "$NPM_CONFIG_CACHE"

          while IFS= read -r -d '' package_json; do
            dir="$(dirname "$package_json")"
            echo "::group::Frontend package $dir"
            (
              cd "$dir"

              if [ -f package-lock.json ]; then
                npm ci --ignore-scripts --no-audit --no-fund
              else
                npm install --ignore-scripts --no-audit --no-fund
              fi

              if node -e 'const p=require("./package.json"); process.exit(p.scripts?.lint ? 0 : 1)'; then
                npm run lint
              fi

              if node -e 'const p=require("./package.json"); process.exit(p.scripts?.typecheck ? 0 : 1)'; then
                npm run typecheck
              fi

              if [ -f tsconfig.json ] && [ -x node_modules/.bin/tsc ]; then
                node_modules/.bin/tsc --noEmit --pretty false
              fi

              if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f .eslintrc ] || [ -f .eslintrc.json ]; then
                if [ -x node_modules/.bin/eslint ]; then
                  node_modules/.bin/eslint . --max-warnings=0
                fi
              fi

              if [ -f stylelint.config.js ] || [ -f stylelint.config.mjs ] || [ -f .stylelintrc ] || [ -f .stylelintrc.json ]; then
                if [ -x node_modules/.bin/stylelint ]; then
                  node_modules/.bin/stylelint '**/*.css'
                fi
              fi

              while IFS= read -r -d '' js; do
                node --check "$js"
              done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

              if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)'; then
                npm test
              fi

              if node -e 'const p=require("./package.json"); process.exit(p.scripts?.build ? 0 : 1)'; then
                npm run build
              fi
            )
            echo "::endgroup::"
          done < <(find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' -print0)

  tauri:
    name: Tauri GUI build and package
    needs: [detect, rust, frontend]
    if: needs.detect.outputs.tauri == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify prerequisite jobs
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          if [ "$RUST_RESULT" != success ] || [ "$FRONTEND_RESULT" != success ]; then
            echo "Tauri build prerequisites failed: Rust=$RUST_RESULT Frontend=$FRONTEND_RESULT"
            exit 1
          fi

      - name: Verify Tauri Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils; do
            dpkg-query -W -f='\${Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || {
              echo "::error::Required system dependency is missing: $package"
              exit 1
            }
          done

      - name: Prepare Tauri Rust cache directories
        shell: bash
        env:
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR"

      - name: Restore Rust common cache for Tauri
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-common-v9-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-common-v8-

      - name: Restore Tauri target cache
        id: tauri-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-${{ env.RUST_VERSION }}-target-v5-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tauri-${{ env.RUST_VERSION }}-target-v5-
            ${{ runner.os }}-${{ runner.arch }}-tauri-${{ runner.name }}-${{ env.RUST_VERSION }}-target-v4-

      - name: Setup Rust
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
              https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Persist Tauri Rust toolchain paths
        shell: bash
        env:
          CARGO_HOME: .gitrun-ci/cargo
          RUSTUP_HOME: .gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-v9-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-v9-
            ${{ runner.os }}-${{ runner.arch }}-npm-v8-
      - name: Install Tauri frontend dependencies
        working-directory: crates/gitrun-dashboard-tauri
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-ci/npm-cache
        run: |
          mkdir -p "$NPM_CONFIG_CACHE"
          npm install --ignore-scripts --no-audit --no-fund

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; then
            echo "ImageMagick is already available."
          else
            echo "Installing ImageMagick..."
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends imagemagick
          fi
          if command -v magick >/dev/null 2>&1; then
            magick -version | head -n 1
          elif command -v convert >/dev/null 2>&1; then
            convert -version | head -n 1
          else
            echo "::error::ImageMagick installation did not provide magick or convert."
            exit 1
          fi

      - name: Normalize Tauri icons to RGBA
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IM=(magick)
          elif command -v convert >/dev/null 2>&1; then
            IM=(convert)
          else
            echo "::error::ImageMagick (magick/convert) is required to normalize Tauri icons."
            exit 1
          fi

          shopt -s nullglob
          icons=(crates/gitrun-dashboard-tauri/src-tauri/icons/*.png)
          if [ "${#icons[@]}" -eq 0 ]; then
            echo "::error::No Tauri PNG icons found."
            exit 1
          fi

          for icon in "${icons[@]}"; do
            tmp="$(mktemp --suffix=.png)"
            "${IM[@]}" "$icon" -alpha on "PNG32:$tmp"
            mv "$tmp" "$icon"
          done
          echo "Normalized ${#icons[@]} Tauri PNG icons to RGBA."

      - name: Generate Tauri icon set
        working-directory: crates/gitrun-dashboard-tauri
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri icon ../../assets/gitrun-icon.svg -- --output src-tauri/icons

      - name: Build Tauri application
        working-directory: crates/gitrun-dashboard-tauri
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/tauri-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/tauri-cache
          CARGO_HOME: ${{ github.workspace }}/.gitrun-ci/cargo
          RUSTUP_HOME: ${{ github.workspace }}/.gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v cargo
          cargo --version
          npm run tauri build -- --ci --no-bundle

      - name: Save Tauri target cache
        if: success() && steps.tauri-target-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-${{ env.RUST_VERSION }}-target-v5-${{ hashFiles('Cargo.lock') }}

      - name: Prepare Recovery icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/gitrun-recovery/icons
          if command -v magick >/dev/null 2>&1; then
            magick assets/gitrun-icon.svg -background none -alpha on PNG32:crates/gitrun-recovery/icons/icon.png
          elif command -v convert >/dev/null 2>&1; then
            convert assets/gitrun-icon.svg -background none -alpha on PNG32:crates/gitrun-recovery/icons/icon.png
          else
            echo "::error::ImageMagick (magick/convert) is required to prepare the Recovery icon."
            exit 1
          fi
          file crates/gitrun-recovery/icons/icon.png

      - name: Test GitRun Recovery
        shell: bash
        env:
          CARGO_HOME: ${{ github.workspace }}/.gitrun-ci/cargo
          RUSTUP_HOME: ${{ github.workspace }}/.gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo clippy -p gitrun-recovery --all-targets --locked -- -D warnings
          cargo test -p gitrun-recovery --locked --all-targets
          cargo build --locked --release -p gitrun-recovery

      - name: Bundle Tauri application
        working-directory: crates/gitrun-dashboard-tauri
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/tauri-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/tauri-cache
          CARGO_HOME: ${{ github.workspace }}/.gitrun-ci/cargo
          RUSTUP_HOME: ${{ github.workspace }}/.gitrun-ci/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v cargo
          cargo --version
          npm run tauri bundle -- --bundles deb,appimage --no-binary-patching

      - name: Upload Tauri bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitrun-tauri-bundles
          path: target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7

  shell:
    name: Shell validation
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore ShellCheck cache
        id: shellcheck-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/shellcheck
          key: ${{ runner.os }}-${{ runner.arch }}-shellcheck-v0.11.0-v1

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          version="v0.11.0"
          cache_dir="$GITHUB_WORKSPACE/.gitrun-ci/tools/shellcheck"
          cached="$cache_dir/shellcheck"
          mkdir -p "$cache_dir"
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
          elif [ -x "$cached" ]; then
            "$cached" --version
            echo "$cache_dir" >> "$GITHUB_PATH"
          else
            archive="$RUNNER_TEMP/shellcheck-${version}.linux.x86_64.tar.xz"
            curl -fsSL -o "$archive" \
              "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz"
          python3 - "$archive" "$cached" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive, destination = sys.argv[1:]
          destination = pathlib.Path(destination)
          destination.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:xz") as tf:
              member = next(m for m in tf.getmembers() if m.name.endswith("/shellcheck"))
              source = tf.extractfile(member)
              if source is None:
                  raise SystemExit("shellcheck binary missing from archive")
              destination.write_bytes(source.read())
              destination.chmod(0o755)
          PY
            chmod 0755 "$cached"
            "$cached" --version
            echo "$cache_dir" >> "$GITHUB_PATH"
          fi

      - name: Save ShellCheck cache
        if: success() && steps.shellcheck-cache.outputs.cache-hit != 'true' && hashFiles('.gitrun-ci/tools/shellcheck/shellcheck') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/shellcheck
          key: ${{ runner.os }}-${{ runner.arch }}-shellcheck-v0.11.0-v1

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if [ "${#files[@]}" -gt 0 ]; then
            if command -v shellcheck >/dev/null 2>&1; then
              shellcheck "${files[@]}"
            elif [ -x ".gitrun-ci/tools/shellcheck/shellcheck" ]; then
              ".gitrun-ci/tools/shellcheck/shellcheck" "${files[@]}"
            else
              echo "ShellCheck binary is unavailable."
              exit 1
            fi
          fi
  workflow-security:
    name: GitHub Actions security audit
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!docs/ROADMAP_PHASES.md' ':!SECURITY.md'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi
      - name: Restore zizmor cache
        id: zizmor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/zizmor
          key: ${{ runner.os }}-${{ runner.arch }}-zizmor-v1.30.1-v1

      - name: Install zizmor
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$GITHUB_WORKSPACE/.gitrun-ci/tools/zizmor"
          mkdir -p "$install_dir"
          if [ -x "$install_dir/bin/zizmor" ] && "$install_dir/bin/zizmor" --version | grep -q "zizmor 1.30.1"; then
            :
          else
            rm -rf "$install_dir"
            mkdir -p "$install_dir"
            python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir \
              --target "$install_dir" "zizmor==1.30.1"
          fi
          "$install_dir/bin/zizmor" --version

      - name: Audit GitHub Actions workflows
        run: |
          "$GITHUB_WORKSPACE/.gitrun-ci/tools/zizmor/bin/zizmor" --min-severity=high --strict-collection --collect=workflows .github/workflows

      - name: Save zizmor cache
        if: success() && steps.zizmor-cache.outputs.cache-hit != 'true' && hashFiles('.gitrun-ci/tools/zizmor/bin/zizmor') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/zizmor
          key: ${{ runner.os }}-${{ runner.arch }}-zizmor-v1.30.1-v1

  powershell:
    name: PowerShell validation
    needs: detect
    if: needs.detect.outputs.powershell == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore PowerShell cache
        id: powershell-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/powershell
          key: ${{ runner.os }}-${{ runner.arch }}-powershell-7.6.6-v1

      - name: Ensure PowerShell runtime
        shell: bash
        env:
          HOME: ${{ runner.temp }}/powershell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/powershell-home/.cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/powershell-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/powershell-home/.local/share
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          if command -v pwsh >/dev/null 2>&1; then
            pwsh --version
            exit 0
          fi
          version="7.6.6"
          install_dir="$GITHUB_WORKSPACE/.gitrun-ci/tools/powershell"
          cached_pwsh="$install_dir/pwsh"
          if [ -x "$cached_pwsh" ] && "$cached_pwsh" --version | grep -q "PowerShell 7.6.6"; then
            echo "$install_dir" >> "$GITHUB_PATH"
            "$cached_pwsh" --version
            exit 0
          fi
          archive="${{ runner.temp }}/powershell-${version}-linux-x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-x64.tar.gz"
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc $archive" | sha256sum -c -
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          chmod 0755 "$install_dir/pwsh"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/pwsh" --version

      - name: Save PowerShell cache
        if: success() && steps.powershell-cache.outputs.cache-hit != 'true' && hashFiles('.gitrun-ci/tools/powershell/pwsh') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/powershell
          key: ${{ runner.os }}-${{ runner.arch }}-powershell-7.6.6-v1

      - name: Validate PowerShell syntax
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}/powershell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/powershell-home/.cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/powershell-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/powershell-home/.local/share
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                throw "PowerShell parse errors in $($_.FullName): $($errors -join '; ')"
              }
            }

  docker:
    name: Docker and Compose validation
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONFIG: ${{ github.workspace }}/.gitrun-ci/tools/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare CI environment
        run: |
          cp config/config.example.env /tmp/gitrun.env
          sed -i 's|^GITHUB_TOKEN=.*|GITHUB_TOKEN=ci-placeholder|' /tmp/gitrun.env
          sed -i 's|^GITRUN_REPOSITORIES=.*|GITRUN_REPOSITORIES=Vider06/GitRun|' /tmp/gitrun.env
          mkdir -p /tmp/gitrun-state /tmp/gitrun-logs

      - name: Restore Docker tool cache
        id: docker-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/docker
          key: ${{ runner.os }}-${{ runner.arch }}-docker-cli-29.8.1-compose-5.5.1-buildx-0.37.1-v2

      - name: Ensure Docker CLI, Compose and Buildx
        shell: bash
        run: |
          set -euo pipefail
          docker_version="29.8.1"
          compose_version="5.5.1"
          buildx_version="0.37.1"
          tools_dir="$GITHUB_WORKSPACE/.gitrun-ci/tools/docker"
          plugin_dir="$tools_dir/cli-plugins"
          docker_bin="$tools_dir/docker"
          compose_bin="$tools_dir/docker-compose"
          buildx_bin="$plugin_dir/docker-buildx"
          mkdir -p "$tools_dir" "$plugin_dir"
          if [ ! -x "$docker_bin" ]; then
            curl -fsSL -o "$RUNNER_TEMP/docker.tgz" \
              "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_version}.tgz"
            tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP"
            install -m 0755 "$RUNNER_TEMP/docker/docker" "$docker_bin"
            rm -rf "$RUNNER_TEMP/docker" "$RUNNER_TEMP/docker.tgz"
          fi
          if [ ! -x "$compose_bin" ]; then
            curl -fsSL -o "$compose_bin" \
              "https://github.com/docker/compose/releases/download/v${compose_version}/docker-compose-linux-x86_64"
            echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 *$compose_bin" | sha256sum -c -
            chmod 0755 "$compose_bin"
          fi
          if [ ! -x "$buildx_bin" ]; then
            curl -fsSL -o "$RUNNER_TEMP/docker-buildx" \
              "https://github.com/docker/buildx/releases/download/v${buildx_version}/buildx-v${buildx_version}.linux-amd64"
            echo "9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b *$RUNNER_TEMP/docker-buildx" | sha256sum -c -
            install -m 0755 "$RUNNER_TEMP/docker-buildx" "$buildx_bin"
            rm -f "$RUNNER_TEMP/docker-buildx"
          fi
          "$docker_bin" --version
          "$compose_bin" version
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          test -x "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          "$docker_bin" buildx version
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Save Docker tool cache
        if: success() && steps.docker-tools-cache.outputs.cache-hit != 'true' && hashFiles('.gitrun-ci/tools/docker/docker', '.gitrun-ci/tools/docker/docker-compose', '.gitrun-ci/tools/docker/cli-plugins/docker-buildx') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/tools/docker
          key: ${{ runner.os }}-${{ runner.arch }}-docker-cli-29.8.1-compose-5.5.1-buildx-0.37.1-v2

      - name: Validate Compose
        env:
          GITRUN_CONFIG_FILE: /tmp/gitrun.env
          GITRUN_DOCKER_SOCKET: /var/run/docker.sock
          GITRUN_STATE_DIR: /tmp/gitrun-state
          GITRUN_LOG_DIR: /tmp/gitrun-logs
        run: |
          set -euo pipefail
          compose_bin="$GITHUB_WORKSPACE/.gitrun-ci/tools/docker/docker-compose"
          test -x "$compose_bin"
          "$compose_bin" config -q

      - name: Build manager image
        shell: bash
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          docker info >/dev/null
          docker buildx build --load --network=host \
            --build-arg "GITRUN_SOURCE_REV=${GITHUB_SHA}" \
            --build-arg "GITRUN_CACHE_SCHEMA=v10" \
            -f docker/manager-rs/Dockerfile -t gitrun-manager-rs:ci .

      - name: Build runner image
        shell: bash
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          docker info >/dev/null
          docker buildx build --load --network=host -f docker/runner/Dockerfile -t gitrun-runner:ci .

  repository:
    name: Repository hygiene
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check tracked secrets and generated files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.pem|.*\.key)$' | grep -vE '(^|/)config/config\.example\.env$'; then
            echo "Potential secret/config file tracked by Git."
            exit 1
          fi
      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' >/dev/null 2>&1; then
            exit 0
          fi
          parser_dir="$RUNNER_TEMP/pyyaml"
          mkdir -p "$parser_dir"
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target "$parser_dir" "pyyaml==6.0.2"
          echo "PYTHONPATH=$parser_dir${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - name: YAML parse
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              raise SystemExit("PyYAML unavailable")
          for path in pathlib.Path('.').rglob('*.y*ml'):
              if '.git' in path.parts:
                  continue
              yaml.safe_load(path.read_text())
          print("YAML validation passed")
          PY
      - name: Git diff sanity
        run: git diff --check

  summary:
    name: Verification summary
    if: always()
    needs:
      - environment
      - detect
      - python
      - rust
      - dependency
      - frontend
      - tauri
      - shell
      - workflow-security
      - powershell
      - docker
      - repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - name: Enforce required gates
        shell: bash
        env:
          ENVIRONMENT_RESULT: ${{ needs.environment.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TAURI_RESULT: ${{ needs.tauri.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          SECURITY_RESULT: ${{ needs.workflow-security.result }}
          POWERSHELL_RESULT: ${{ needs.powershell.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          PYTHON_ENABLED: ${{ needs.detect.outputs.python }}
          RUST_ENABLED: ${{ needs.detect.outputs.rust }}
          DEPENDENCY_ENABLED: ${{ needs.detect.outputs.dependency }}
          FRONTEND_ENABLED: ${{ needs.detect.outputs.node }}
          TAURI_ENABLED: ${{ needs.detect.outputs.tauri }}
          POWERSHELL_ENABLED: ${{ needs.detect.outputs.powershell }}
          DOCKER_ENABLED: ${{ needs.detect.outputs.docker }}
        run: |
          set -euo pipefail

          check_gate() {
            local name="$1"
            local result="$2"
            local enabled="$3"

            if [ "$enabled" = true ]; then
              if [ "$result" != success ]; then
                echo "Verification gate failed: $name=$result"
                return 1
              fi
            else
              case "$result" in
                success|skipped) ;;
                *)
                  echo "Unexpected disabled gate result: $name=$result"
                  return 1
                  ;;
              esac
            fi
          }

          check_gate environment "$ENVIRONMENT_RESULT" true
          check_gate detect "$DETECT_RESULT" true
          check_gate python "$PYTHON_RESULT" "$PYTHON_ENABLED"
          check_gate rust "$RUST_RESULT" "$RUST_ENABLED"
          check_gate dependency "$DEPENDENCY_RESULT" "$DEPENDENCY_ENABLED"
          check_gate frontend "$FRONTEND_RESULT" "$FRONTEND_ENABLED"
          check_gate tauri "$TAURI_RESULT" "$TAURI_ENABLED"
          check_gate shell "$SHELL_RESULT" true
          check_gate workflow-security "$SECURITY_RESULT" true
          check_gate powershell "$POWERSHELL_RESULT" "$POWERSHELL_ENABLED"
          check_gate docker "$DOCKER_RESULT" "$DOCKER_ENABLED"
          check_gate repository "$REPOSITORY_RESULT" true

          echo "All applicable GitRun verification gates passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

