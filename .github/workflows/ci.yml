name: GitRun CI

# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline map (needs):
#    variables-verification ─┬─► environment
#                            └─► detect ─► cargo-lock ─┬─ static checks · audits · Docker · systemd
#                                                       └─ rust-lint
#    rust-lint ─► rust-test ─► rust-build ─► platform-target-check ─► Server packages
#        ├─ Rust source inventory ─┬─ Kani proofs ─┐
#        │                         └─ Verus proofs ─┴─► formal-verification (dual-verifier audit)
#        ├─ Miri (parallel; needs cargo-lock + rust-lint)
#        ├─ release-inputs ─► all package matrices ─► exact Release asset assembly
#        ├─ security-hardening · gsr-watchdog · runtime-contracts · platform-compatibility
#        └─ + frontend ─► Tauri GNU/musl builds ─► Desktop package matrices
#    everything ─► summary (PR comment + Mermaid map) ─► cache-gc (push only)
#
#  Cache namespace:  gitrun-<epoch>-<os>-<arch>-<kind>-<details>-<hash>
#  Docker BuildKit cache scopes follow the same namespace shape and live in
#  GitHub Actions Cache instead of the ephemeral runner filesystem.
#  Bump CACHE_EPOCH to invalidate every cache at once.
#  Fork PRs run on GitHub-hosted runners; write permissions are never granted to them.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Feature branches are validated once, when their pull request is opened or updated.
  # Main receives the full pipeline on push; PR runs intentionally omit cache-gc.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.0"
  NODE_VERSION: "22"
  # Bump the epoch to invalidate every cache; the next main cache-GC run purges the old namespace.
  # Persistent CI configuration comes from Repository Variables.
  CACHE_EPOCH: ${{ vars.GITRUN_CI_FRESH_CACHE == 'true' && format('e2x{0}', github.run_id) || 'e2' }}
  CACHE_BASE_EPOCH: e2
  # Cache writes are allowed on pushes; same-repository PR writes are opt-in; fork PRs are read-only.
  CI_CACHE_WRITE_ALLOWED: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && vars.GITRUN_CI_CACHE_SAVE_PR == 'true')) && 'true' || 'false' }}
  # Same-repository PR cache writes are opt-in; fork PRs are always read-only.
  TARGET_CACHE_MAX_MB: "4096"
  NPM_CACHE_MAX_MB: "600"
  CI_VERBOSE: ${{ vars.GITRUN_CI_VERBOSE == 'true' && '1' || '0' }}
  CI_UPLOAD_ARTIFACTS: ${{ vars.GITRUN_CI_UPLOAD_ARTIFACTS == 'true' && 'true' || 'false' }}
  CI_UPLOAD_LOG_ARTIFACTS: ${{ vars.GITRUN_UPLOAD_LOG_ARTIFACTS == 'true' && 'true' || 'false' }}
  CI_RUNNER_MODE: ${{ vars.GITRUN_RUNNER_MODE || 'github-hosted' }}
  CI_FULL_RUN: ${{ vars.GITRUN_CI_FULL_RUN == 'true' && 'true' || 'false' }}
  CI_FRESH_CACHE: ${{ vars.GITRUN_CI_FRESH_CACHE == 'true' && 'true' || 'false' }}
  CI_GC_DRY_RUN: ${{ vars.GITRUN_CI_GC_DRY_RUN == 'true' && 'true' || 'false' }}
  CI_MAX_ANNOT: "40"
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # CI does not need local debug symbols; disabling them keeps Cargo target
  # caches below the per-cache budget instead of repeatedly restoring oversized
  # cross-job partial caches that cannot be saved again.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: ${{ vars.GITRUN_CI_VERBOSE == 'true' && 'full' || '1' }}
  FORCE_COLOR: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_PROGRESS: "false"

defaults:
  run:
    shell: bash

concurrency:
  group: gitrun-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────── variables verification ──
  variables-verification:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    name: Repository CI variables
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (vars.GITRUN_RUNNER_MODE || 'github-hosted') == 'github-hosted') && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","miniserver-manager"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      secs: ${{ steps.report.outputs.secs }}
      cache: ${{ steps.report.outputs.cache }}
      errors: ${{ steps.report.outputs.errors }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start report clock
        run: |
          echo "GITRUN_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "GITRUN_JOB_STARTED_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Verify repository variables
        id: verify
        env:
          GITRUN_CI_CACHE_SAVE_PR: ${{ vars.GITRUN_CI_CACHE_SAVE_PR }}
          GITRUN_CI_FRESH_CACHE: ${{ vars.GITRUN_CI_FRESH_CACHE }}
          GITRUN_CI_VERBOSE: ${{ vars.GITRUN_CI_VERBOSE }}
          GITRUN_CI_UPLOAD_ARTIFACTS: ${{ vars.GITRUN_CI_UPLOAD_ARTIFACTS }}
          GITRUN_UPLOAD_LOG_ARTIFACTS: ${{ vars.GITRUN_UPLOAD_LOG_ARTIFACTS }}
          GITRUN_RUNNER_MODE: ${{ vars.GITRUN_RUNNER_MODE }}
          GITRUN_CI_FULL_RUN: ${{ vars.GITRUN_CI_FULL_RUN }}
          GITRUN_CI_GC_DRY_RUN: ${{ vars.GITRUN_CI_GC_DRY_RUN }}
        run: |
          set -euo pipefail
          echo "### Repository CI variables"
          echo
          echo "| Variable | Current repository value |"
          echo "|---|---|"
          for name in \
            GITRUN_CI_CACHE_SAVE_PR \
            GITRUN_CI_FRESH_CACHE \
            GITRUN_CI_VERBOSE \
            GITRUN_CI_UPLOAD_ARTIFACTS \
            GITRUN_UPLOAD_LOG_ARTIFACTS \
            GITRUN_RUNNER_MODE \
            GITRUN_CI_FULL_RUN \
            GITRUN_CI_GC_DRY_RUN
          do
            value="${!name:-<unset>}"
            printf '| `%s` | `%s` |\n' "$name" "$value"
          done

          {
            echo "| Variable | Current repository value |"
            echo "|---|---|"
            for name in \
              GITRUN_CI_CACHE_SAVE_PR \
              GITRUN_CI_FRESH_CACHE \
              GITRUN_CI_VERBOSE \
              GITRUN_CI_UPLOAD_ARTIFACTS \
              GITRUN_UPLOAD_LOG_ARTIFACTS \
              GITRUN_RUNNER_MODE \
              GITRUN_CI_FULL_RUN \
              GITRUN_CI_GC_DRY_RUN
            do
              value="${!name:-<unset>}"
              printf '| `%s` | `%s` |\n' "$name" "$value"
            done
          } > "$RUNNER_TEMP/gitrun-variables-details.md"
          echo "GITRUN_VERIFY_SECS=$(( $(date +%s) - GITRUN_JOB_STARTED ))" >> "$GITHUB_ENV"

      - name: Report job status
        id: report
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          GITRUN_JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/ci/ci-job-report.py write
          started="${GITRUN_JOB_STARTED:-$(date +%s)}"
          started_utc="${GITRUN_JOB_STARTED_UTC:-unavailable}"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          secs=$(( $(date +%s) - started ))
          verify_secs="${GITRUN_VERIFY_SECS:-unavailable}"
          status="${GITRUN_JOB_STATUS:-unknown}"
          {
            echo "# GitRun CI job report"
            echo
            echo "| Field | Runtime value |"
            echo "|---|---|"
            echo "| Job | Repository CI variables |"
            echo "| Result | **${status}** |"
            echo "| Execution duration | ${secs}s |"
            echo "| Measurement started (UTC) | ${started_utc} |"
            echo "| Report generated (UTC) | ${generated_at} |"
            echo "| Runner | ${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}) |"
            echo "| Commit | ${GITHUB_SHA:0:12} |"
            echo "| Run | ${GITHUB_RUN_ID:-unknown} |"
            echo
            echo "_Skipped jobs do not execute a job-local report; their status is shown in the workflow-level verification summary._"
            echo
            echo "## Step results and timings"
            echo
            echo "| Step | Result | Time |"
            echo "|---|---|---:|"
            echo "| Verify repository variables | ${VERIFY_OUTCOME:-unavailable} | ${verify_secs}s |"
            echo
            echo "## Cache activity"
            echo
            echo "_No cache restore operation was recorded for this job._"
            echo
            echo "## Job-specific details"
            echo
            if [ -f "$RUNNER_TEMP/gitrun-variables-details.md" ]; then cat "$RUNNER_TEMP/gitrun-variables-details.md"; else echo "_No details were captured._"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "secs=$secs"
            echo "cache=not-used"
            echo "errors<<GITRUN_EOF"
            if [ "$VERIFY_OUTCOME" != success ]; then
              echo "Repository CI variable verification ended with: $VERIFY_OUTCOME"
            fi
            echo "GITRUN_EOF"
          } >> "$GITHUB_OUTPUT"
      - &job_result
        name: Upload canonical job result
        if: always() && env.CI_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitrun-job-result-${{ github.job }}
          path: ${{ runner.temp }}/gitrun-job-result.json
          if-no-files-found: warn
          retention-days: 7
  # ───────────────────────────────────────────────────────── environment ──
  environment:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    name: Runner environment
    needs: variables-verification
    runs-on: &runner ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (vars.GITRUN_RUNNER_MODE || 'github-hosted') == 'github-hosted') && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","miniserver-manager"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: &job_outputs
      secs: ${{ steps.report.outputs.secs }}
      cache: ${{ steps.report.outputs.cache }}
      errors: ${{ steps.report.outputs.errors }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - &boot
        name: Bootstrap (helpers, diagnostics, jq)
        run: |
          install -m 0644 "$GITHUB_WORKSPACE/scripts/ci/ci-lib.sh" "$RUNNER_TEMP/ci-lib.sh"
          source "$RUNNER_TEMP/ci-lib.sh"
          date +%s > "$CI_DIR/t0"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$CI_DIR/started_at"
          echo "CI_ANNOT=$CI_ANNOT" >> "$GITHUB_ENV"
          ci_diag
          ci_ensure_jq

      - name: Verify runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-runner.sh
      - &report
        name: Job report
        id: report
        if: always()
        env:
          GITRUN_JOB_STATUS: ${{ job.status }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_report
      - *job_result

      - &logs
        name: Upload CI logs
        if: failure() && env.CI_UPLOAD_LOG_ARTIFACTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-logs-${{ github.job }}
          path: ${{ runner.temp }}/gitrun-ci/logs
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  # ───────────────────────────────────────────────────────────── detect ──
  detect:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    name: Detect project components
    needs: variables-verification
    runs-on: *runner
    timeout-minutes: 60
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}

      docker: ${{ steps.detect.outputs.docker }}
      dockerfiles: ${{ steps.detect.outputs.dockerfiles }}
      powershell: ${{ steps.detect.outputs.powershell }}
      node: ${{ steps.detect.outputs.node }}
      tauri: ${{ steps.detect.outputs.tauri }}
      shell: ${{ steps.detect.outputs.shell }}
      workflows: ${{ steps.detect.outputs.workflows }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      secs: ${{ steps.report.outputs.secs }}
      cache: ${{ steps.report.outputs.cache }}
      errors: ${{ steps.report.outputs.errors }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - *boot
      - name: Detect
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          FULL_RUN: ${{ env.CI_FULL_RUN }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          files="$(git ls-files)"
          has() { grep -Eq -- "$1" <<<"$files"; }
          flag() { if has "$1"; then echo true; else echo false; fi; }

          rust="$(flag '^Cargo\.toml$')"
          python="$(flag '\.py$')"

          powershell="$(flag '\.ps1$')"
          node="$(flag '(^|/)package\.json$')"
          shell="$(flag '\.sh$')"
          workflows="$(flag '^\.github/workflows/[^/]+\.ya?ml$')"
          dockerfiles="$(flag '(^|/)Dockerfile[^/]*$')"
          docker_cfg="$(flag '^docker-compose\.ya?ml$|^docker/([^/]+/)*Dockerfile[^/]*$')"
          tauri=false
          if has '^crates/gitrun-dashboard-tauri/src-tauri/Cargo\.toml$' && has '^crates/gitrun-dashboard-tauri/package\.json$'; then tauri=true; fi

          # Docker jobs only make sense on runners that can talk to a Docker daemon.
          docker=false
          if [ "$docker_cfg" = true ]; then
            if command -v docker >/dev/null 2>&1 && [ -S /var/run/docker.sock ] && docker info >/dev/null 2>&1; then
              docker=true
            else
              ci_warn "Docker files are present but this runner has no usable Docker daemon: the docker job is SKIPPED on $RUNNER_NAME."
            fi
          fi

          # Pull requests that only touch documentation skip the heavy jobs.
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$FULL_RUN" != true ]; then
            if changed="$(git diff --name-only HEAD^1 HEAD 2>/dev/null)" && [ -n "$changed" ]; then
              if ! grep -Evq '^(docs/|LICENSE|CODEOWNERS|\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/)|\.(md|mdx|txt|rst)$' <<<"$changed"; then
                docs_only=true
                rust=false; python=false; node=false; tauri=false; docker=false
                ci_note "docs-only pull request: Rust, Python, Node, Tauri and Docker jobs are skipped (use full_run to force)"
              fi
            fi
          fi

          {
            echo "rust=$rust"; echo "python=$python"; echo "powershell=$powershell"; echo "node=$node"
            echo "shell=$shell"; echo "workflows=$workflows"; echo "dockerfiles=$dockerfiles"
            echo "docker=$docker"; echo "tauri=$tauri"; echo "docs_only=$docs_only"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 🔎 Detected components"; echo
            echo "| Component | Active |"; echo "|---|---|"
            for k in rust python powershell node shell workflows dockerfiles docker tauri docs_only; do
              v="${!k}"; if [ "$v" = true ]; then echo "| $k | ✅ |"; else echo "| $k | – |"; fi
            done
            echo
          } | ci_sum
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────── cargo-lock ──
  cargo-lock:
    name: Validate Cargo.lock
    needs: [detect, environment]
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.detect.result == 'success') }}
    runs-on: *runner
    timeout-minutes: 60
    outputs:
      rust: ${{ needs.detect.outputs.rust }}
      python: ${{ needs.detect.outputs.python }}

      docker: ${{ needs.detect.outputs.docker }}
      dockerfiles: ${{ needs.detect.outputs.dockerfiles }}
      powershell: ${{ needs.detect.outputs.powershell }}
      node: ${{ needs.detect.outputs.node }}
      tauri: ${{ needs.detect.outputs.tauri }}
      shell: ${{ needs.detect.outputs.shell }}
      workflows: ${{ needs.detect.outputs.workflows }}
      docs_only: ${{ needs.detect.outputs.docs_only }}
      secs: ${{ steps.report.outputs.secs }}
      cache: ${{ steps.report.outputs.cache }}
      errors: ${{ steps.report.outputs.errors }}
    steps:
      - *checkout
      - *boot
      - name: Configure Rust environment
        if: needs.detect.outputs.rust == 'true'
        run: |
          root="$GITHUB_WORKSPACE/.gitrun-ci"
          mkdir -p "$root/cargo" "$root/rustup" "$RUNNER_TEMP/tmp"
          {
            echo "CARGO_HOME=$root/cargo"
            echo "RUSTUP_HOME=$root/rustup"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "RUSTUP_TOOLCHAIN=$RUST_VERSION"
          } >> "$GITHUB_ENV"
          echo "$root/cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        if: needs.detect.outputs.rust == 'true'
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            ci_run "download rustup-init" ci_download https://sh.rustup.rs "$RUNNER_TEMP/rustup-init.sh"
            export RUSTUP_INIT_SKIP_PATH_CHECK=yes
            ci_run "install rustup" sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          args=(--profile minimal --no-self-update)
          IFS=',' read -ra comps <<<"${RUST_COMPONENTS:-}"
          for c in "${comps[@]}"; do if [ -n "$c" ]; then args+=(-c "$c"); fi; done
          ci_run "rustup toolchain install $RUST_VERSION" rustup toolchain install "$RUST_VERSION" "${args[@]}"
          rustup default "$RUST_VERSION" > /dev/null
          if ls rust-toolchain rust-toolchain.toml >/dev/null 2>&1; then ci_note "rust-toolchain file found: RUSTUP_TOOLCHAIN=$RUST_VERSION overrides it in CI"; fi
          rustc -vV
          cargo --version
      - name: Validate all Cargo lockfiles
        if: needs.detect.outputs.rust == 'true'
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ws="$GITHUB_WORKSPACE"
          locks=()

          # Discover every tracked Cargo-generated lockfile, including non-standard
          # names such as gitrun-setup's embedded runner-bootstrap.lock.
          while IFS= read -r -d '' f; do
            if [[ "$f" == "Cargo.lock" ]] || head -n 1 "$f" 2>/dev/null | grep -qF '# This file is automatically @generated by Cargo.'; then
              locks+=("$f")
            fi
          done < <(git ls-files -z)

          if [ "${#locks[@]}" -eq 0 ]; then
            ci_err "No Cargo lockfile was discovered in the repository"
            exit 1
          fi

          printf 'Discovered Cargo lockfiles (%s):\n' "${#locks[@]}"
          printf '  - %s\n' "${locks[@]}"

          fail=0
          for lock in "${locks[@]}"; do
            case "$lock" in
              Cargo.lock)
                ci_run "Cargo.lock: cargo tree --workspace --locked"                   cargo tree --manifest-path "$ws/Cargo.toml" --workspace --locked --depth 0 || fail=1
                ;;
              crates/gitrun-setup/src/runner-bootstrap.lock)
                tmp="$RUNNER_TEMP/gitrun-bootstrap-lock-check"
                rm -rf "$tmp"
                mkdir -p "$tmp/crates"
                cat > "$tmp/Cargo.toml" <<'BOOTSTRAP_MANIFEST'
          [workspace]
          resolver = "2"
          members = ["crates/gitrun-core", "crates/gitrun-exe", "crates/gitrun-gsr", "crates/gitrun-platform"]
          BOOTSTRAP_MANIFEST
                cp "$ws/$lock" "$tmp/Cargo.lock"
                cp -a "$ws/crates/gitrun-core" "$tmp/crates/"
                cp -a "$ws/crates/gitrun-exe" "$tmp/crates/"
                cp -a "$ws/crates/gitrun-gsr" "$tmp/crates/"
                cp -a "$ws/crates/gitrun-platform" "$tmp/crates/"
                ci_run "runner-bootstrap.lock: cargo tree --workspace --locked"                   cargo tree --manifest-path "$tmp/Cargo.toml" --workspace --locked --depth 0 || fail=1
                rm -rf "$tmp"
                ;;
              *)
                ci_err "Unvalidated Cargo lockfile discovered: $lock — add its validation context to this CI check"
                fail=1
                ;;
            esac
          done

          [ "$fail" -eq 0 ] || exit 1
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────── ci-selftest ──
  ci-selftest:
    name: CI helper self-test
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.workflows == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - name: Test tracked-file cache fingerprints
        run: python3 scripts/ci/selftest-hash-tracked-files.py
      - name: Test log parsers and helpers
        run: bash scripts/ci/selftest.sh
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────── repository ──
  repository:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    name: Repository hygiene and syntax
    needs: cargo-lock
    runs-on: *runner
    timeout-minutes: 60
    outputs: *job_outputs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - *boot
      - name: Verify Markdown version marker structure
        # Current-source values are synchronized by the release workflow. PR CI
        # validates marker integrity/coverage without forcing the release sync
        # before the release workflow has had a chance to run.
        run: python3 scripts/sync-markdown-version.py --check-structure
      - name: Validate Cargo crate version consistency
        run: python3 scripts/check-version-consistency.py --cargo-only
      - name: Install YAML parser
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          if python3 -c 'import yaml' >/dev/null 2>&1; then echo "PyYAML already available"; exit 0; fi
          dir="$RUNNER_TOOL_CACHE/gitrun-tools/pyyaml/6.0.2"
          if [ ! -d "$dir/yaml" ]; then
            ci_retry 3 3 python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target "$dir" "pyyaml==6.0.2"
          fi
          echo "PYTHONPATH=$dir${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - name: Hygiene and syntax checks
        env:
          EVENT: ${{ github.event_name }}
          MAX_FILE_MB: "5"
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_run "Repository hygiene and syntax" python3 scripts/ci/check-repository-hygiene.py
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────────── workflows ──
  workflows:
    name: Workflow lint and security audit
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.workflows == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - name: Secret pattern scan
        id: secret_scan
        run: >-
          python3 scripts/ci/check-secret-patterns.py
          --sarif-file "$GITHUB_WORKSPACE/gitrun-secret-patterns.sarif"
          --defer-failure

      - name: Publish secret pattern findings to Code Scanning
        if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: gitrun-secret-patterns.sarif
          category: gitrun-secret-patterns

      - name: Enforce secret pattern findings
        if: ${{ always() && !cancelled() }}
        run: >-
          python3 scripts/ci/check-secret-patterns.py
          --sarif-file "$GITHUB_WORKSPACE/gitrun-secret-patterns.sarif"
          --fail-on-findings

      - name: actionlint (syntax, expressions, shell in run blocks)
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_ensure_actionlint
          ci_ensure_shellcheck
          # Helper functions are passed by name to ci_run, quotes in node/awk/jq snippets are intentional.
          export SHELLCHECK_OPTS="-e SC2317 -e SC2329 -e SC2016"
          NL=$'\n'
          fmt='{{range $e := .}}{{$e.Filepath}}:{{$e.Line}}:{{$e.Column}}: {{$e.Message}} [{{$e.Kind}}]'"$NL"'::error file={{$e.Filepath}},line={{$e.Line}},col={{$e.Column}},title=actionlint ({{$e.Kind}})::{{$e.Message}}'"$NL"'{{end}}'
          run_actionlint() { actionlint -format "$fmt" 2>&1 | ci_tap; }
          actionlint -version | head -n 1
          ci_run "actionlint" run_actionlint

      - name: zizmor (security audit)
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          version=1.30.1
          dir="$RUNNER_TOOL_CACHE/gitrun-tools/zizmor/$version-$(ci_arch)"
          if [ ! -x "$dir/bin/zizmor" ] || ! "$dir/bin/zizmor" --version | grep -q "zizmor $version"; then
            rm -rf "$dir"; mkdir -p "$dir"
            ci_retry 3 3 python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target "$dir" "zizmor==$version"
          fi
          "$dir/bin/zizmor" --version
          ci_run "zizmor audit" "$dir/bin/zizmor" --min-severity=high --strict-collection --collect=workflows .github/workflows
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────────────── shell ──
  shell:
    name: Shell validation
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.shell == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - name: Syntax check and ShellCheck
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_ensure_shellcheck
          shellcheck --version | sed -n '2p'
          mapfile -d '' files < <(git ls-files -z '*.sh')
          echo "${#files[@]} tracked shell scripts"
          syntax() { local f rc=0; for f in "${files[@]}"; do bash -n "$f" || rc=1; done; return "$rc"; }
          syntax_run() { syntax 2>&1 | ci_awk_bashn; }
          lint_run() { shellcheck -f gcc "${files[@]}" 2>&1 | ci_awk_gcc; }
          rc=0
          ci_run "bash -n (${#files[@]} files)" syntax_run || rc=1
          ci_run "shellcheck (${#files[@]} files)" lint_run || rc=1
          exit "$rc"
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────────── powershell ──
  powershell:
    name: PowerShell validation
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.powershell == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - name: Restore PowerShell cache
        id: c_pwsh
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.tool_cache }}/gitrun-tools/pwsh
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-tool-pwsh-7.6.6
      - name: Ensure PowerShell runtime
        env:
          PRIMARY: ${{ steps.c_pwsh.outputs.cache-primary-key }}
          MATCHED: ${{ steps.c_pwsh.outputs.cache-matched-key }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ph="$RUNNER_TEMP/powershell-home"
          mkdir -p "$ph/.cache" "$ph/.config" "$ph/.local/share"
          {
            echo "HOME=$ph"; echo "XDG_CACHE_HOME=$ph/.cache"
            echo "XDG_CONFIG_HOME=$ph/.config"; echo "XDG_DATA_HOME=$ph/.local/share"
          } >> "$GITHUB_ENV"
          export HOME="$ph" XDG_CACHE_HOME="$ph/.cache" XDG_CONFIG_HOME="$ph/.config" XDG_DATA_HOME="$ph/.local/share"
          ci_cache_note pwsh "$PRIMARY" "$MATCHED" "$RUNNER_TOOL_CACHE/gitrun-tools/pwsh"
          ci_ensure_pwsh
          pwsh --version
      - name: Save PowerShell cache
        if: success() && steps.c_pwsh.outputs.cache-matched-key != steps.c_pwsh.outputs.cache-primary-key && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.tool_cache }}/gitrun-tools/pwsh
          key: ${{ steps.c_pwsh.outputs.cache-primary-key }}
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          $files = @(git ls-files '*.ps1' '*.psm1' '*.psd1')
          foreach ($f in $files) {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $f).Path, [ref]$tokens, [ref]$errs) | Out-Null
            foreach ($e in $errs) {
              $bad++
              $msg = ($e.Message -replace '%', '%25') -replace "`r?`n", '%0A'
              Write-Host ("::error file={0},line={1},col={2},title=PowerShell parse error::{3}" -f $f, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $msg)
              Add-Content -Path $env:CI_ANNOT -Value ("• {0}:{1} [PowerShell parse error] {2}" -f $f, $e.Extent.StartLineNumber, $e.Message)
            }
          }
          Write-Host "$($files.Count) PowerShell files checked, $bad parse errors"
          if ($bad -gt 0) { exit 1 }
      - *report
      - *job_result
      - *logs

  # ────────────────────────────────────────────────────────────── frontend ──
  frontend:
    name: JavaScript, TypeScript and CSS validation
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.node == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-ci/npm-cache
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - &setup_node
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - &npm_hash
        name: Compute npm cache fingerprint
        id: npm_hash
        shell: bash
        run: |
          set -euo pipefail
          hash="$(bash scripts/ci/hash-tracked-files.sh '**/package-lock.json' '!**/node_modules/**')"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - &c_npm
        name: Restore npm cache
        id: c_npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/npm-cache
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-npm-${{ steps.npm_hash.outputs.hash }}
          restore-keys: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Validate frontend packages
        env:
          PRIMARY: ${{ steps.c_npm.outputs.cache-primary-key }}
          MATCHED: ${{ steps.c_npm.outputs.cache-matched-key }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          mkdir -p "$NPM_CONFIG_CACHE"
          ci_cache_note npm "$PRIMARY" "$MATCHED" "$NPM_CONFIG_CACHE"
          echo "node $(node --version), npm $(npm --version)"

          has_script() { node -e 'const p = require("./package.json"); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)' "$1"; }
          in_dir() { (cd "$dir" && "$@"); }
          pkg_has_script() { (cd "$dir" && has_script "$1"); }

          mapfile -t pkgs < <(git ls-files | grep -E '(^|/)package\.json$')
          echo "${#pkgs[@]} package.json files found"
          rc=0
          for pj in "${pkgs[@]}"; do
            dir="$(dirname "$pj")"; lbl="[$dir]"; bad=0
            step() { local l="$1"; shift; ci_run "$lbl $l" in_dir "$@" || bad=1; }

            if [ -f "$dir/package-lock.json" ]; then
              step "npm ci" npm ci --ignore-scripts --no-audit --no-fund
            else
              ci_warn "$dir: no package-lock.json, installing without a lockfile is not reproducible"
              step "npm install" npm install --ignore-scripts --no-audit --no-fund
            fi
            if [ "$bad" -ne 0 ]; then rc=1; continue; fi

            if pkg_has_script lint; then step "npm run lint" npm run lint; fi
            if pkg_has_script typecheck; then step "npm run typecheck" npm run typecheck
            elif [ -f "$dir/tsconfig.json" ] && [ -x "$dir/node_modules/.bin/tsc" ]; then
              step "tsc --noEmit" node_modules/.bin/tsc --noEmit --pretty false
            fi
            if ! pkg_has_script lint; then
              if { [ -f "$dir/eslint.config.js" ] || [ -f "$dir/eslint.config.mjs" ] || [ -f "$dir/.eslintrc" ] || [ -f "$dir/.eslintrc.json" ]; } && [ -x "$dir/node_modules/.bin/eslint" ]; then
                step "eslint" node_modules/.bin/eslint . --max-warnings=0
              fi
            fi
            if { [ -f "$dir/stylelint.config.js" ] || [ -f "$dir/stylelint.config.mjs" ] || [ -f "$dir/.stylelintrc" ] || [ -f "$dir/.stylelintrc.json" ]; } && [ -x "$dir/node_modules/.bin/stylelint" ]; then
              step "stylelint" node_modules/.bin/stylelint '**/*.css'
            fi

            if [ "$dir" = . ]; then base=""; else base="$dir/"; fi
            ci_run "$lbl node --check (tracked JS)" python3 scripts/ci/check-tracked-javascript.py "$base" "$lbl" || bad=1

            if pkg_has_script test; then step "npm test" npm test; fi
            if pkg_has_script build; then step "npm run build" npm run build; fi
            if [ "$bad" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
      - &npm_prune
        name: Prune npm cache
        id: npm_prune
        if: success()
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          mb="$(du -sm "$NPM_CONFIG_CACHE" 2>/dev/null | cut -f1)"; mb="${mb:-0}"
          if [ "$mb" -gt "$NPM_CACHE_MAX_MB" ]; then
            ci_warn "npm cache is ${mb} MB (limit ${NPM_CACHE_MAX_MB} MB): not saving it, the next run starts clean"
            rm -rf "$NPM_CONFIG_CACHE"; echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm cache ${mb} MB (limit ${NPM_CACHE_MAX_MB} MB)"; echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - &s_npm
        id: save_npm
        name: Save npm cache
        if: success() && steps.npm_prune.outputs.save == 'true' && steps.c_npm.outputs.cache-matched-key != steps.c_npm.outputs.cache-primary-key && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gitrun-ci/npm-cache
          key: ${{ steps.c_npm.outputs.cache-primary-key }}
      - &npm_cache_save_report
        name: Report npm cache save activity
        if: always()
        env:
          CACHE_WRITE_ALLOWED: ${{ env.CI_CACHE_WRITE_ALLOWED }}
          NPM_OUTCOME: ${{ steps.save_npm.outcome || 'skipped' }}
          NPM_MATCH: ${{ steps.c_npm.outputs.cache-matched-key }}
          NPM_PRIMARY: ${{ steps.c_npm.outputs.cache-primary-key }}
          NPM_PRUNE_SAVE: ${{ steps.npm_prune.outputs.save || 'unknown' }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          case "$NPM_OUTCOME" in
            success) result="saved" ;;
            failure) result="save failed (continue-on-error)" ;;
            *)
              if [ "$CACHE_WRITE_ALLOWED" != true ]; then
                result="not saved (fork pull-request cache-write policy)"
              elif [ -n "$NPM_MATCH" ] && [ "$NPM_MATCH" = "$NPM_PRIMARY" ]; then
                result="not saved (exact cache already restored)"
              elif [ "$NPM_PRUNE_SAVE" != true ]; then
                result="not saved (npm cache exceeded size limit)"
              else
                result="skipped (job did not reach cache save)"
              fi
              ;;
          esac
          {
            echo "### Cache save activity"
            echo
            echo "| Cache | Save result |"
            echo "|---|---|"
            printf '| npm | %s |\n' "$result"
            echo
          } | ci_sum
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────────── audit-node ──
  audit-node:
    name: npm dependency audit
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.node == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-ci/npm-cache
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - *setup_node
      - *npm_hash
      - *c_npm
      - name: npm audit (no install needed, only the lockfile)
        env:
          PRIMARY: ${{ steps.c_npm.outputs.cache-primary-key }}
          MATCHED: ${{ steps.c_npm.outputs.cache-matched-key }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          mkdir -p "$NPM_CONFIG_CACHE"
          ci_cache_note npm "$PRIMARY" "$MATCHED" "$NPM_CONFIG_CACHE"
          mapfile -t pkgs < <(git ls-files | grep -E '(^|/)package\.json$')
          rc=0
          for pj in "${pkgs[@]}"; do
            dir="$(dirname "$pj")"
            if [ ! -f "$dir/package-lock.json" ]; then
              ci_warn "$dir: no package-lock.json, generating one only to run the audit (add and commit a lockfile)"
              (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund >/dev/null)
            fi
            audit() { (cd "$dir" && npm audit --audit-level=high 2>&1) | ci_awk_npm "$pj"; }
            ci_run "npm audit [$dir]" audit || rc=1
          done
          exit "$rc"
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────────────────────── rust-lint ──
  rust-lint:
    name: Rust lint (fmt, clippy, docs)
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.rust == 'true' || needs.cargo-lock.outputs.workflows == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    env:
      RUST_COMPONENTS: rustfmt,clippy
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - &rust_keys
        name: Rust paths and cache keys
        id: keys
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          lock_hash="$(bash scripts/ci/hash-tracked-files.sh Cargo.lock)"
          cfg_hash="$(bash scripts/ci/hash-tracked-files.sh rust-toolchain rust-toolchain.toml .cargo/config .cargo/config.toml)"
          manifest_hash="$(bash scripts/ci/hash-tracked-files.sh Cargo.lock Cargo.toml '**/Cargo.toml')"
          if [ "$GITHUB_JOB" != audit-rust ]; then
            bash scripts/ci/prepare-rust-system-deps.sh
          fi
          ci_need_report
          if [ "$GITHUB_JOB" != audit-rust ] && ! command -v pkg-config >/dev/null 2>&1; then
            ci_warn "pkg-config not found: crates linking system libraries (openssl-sys, glib, ...) will fail to build"
          fi
          root="$GITHUB_WORKSPACE/.gitrun-ci"
          mkdir -p "$root/cargo" "$root/rustup" "$RUNNER_TEMP/tmp" "$GITHUB_WORKSPACE/target"
          {
            echo "CARGO_HOME=$root/cargo"
            echo "RUSTUP_HOME=$root/rustup"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "RUSTUP_TOOLCHAIN=$RUST_VERSION"
          } >> "$GITHUB_ENV"
          echo "$root/cargo/bin" >> "$GITHUB_PATH"
          ns="gitrun-${CACHE_EPOCH}-${RUNNER_OS}-${RUNNER_ARCH}"
          comps="$(printf '%s' "${RUST_COMPONENTS:-none}" | tr ',' '+')"
          fp="$(ci_image_fp)"
          lock="${lock_hash:-nolock}"
          profile="$(printf 'dev=%s;test=%s' "${CARGO_PROFILE_DEV_DEBUG:-default}" "${CARGO_PROFILE_TEST_DEBUG:-default}" | sha256sum | cut -c1-8)"
          target_prefix="$ns-target-img${fp}-rustc${RUST_VERSION}-cfg${cfg_hash:0:8}-man${manifest_hash:0:8}-${lock}-prof${profile}-${GITHUB_JOB}-"
          target="${target_prefix}shared"
          # Target artifacts are isolated by job, toolchain, configuration, manifest
          # and lockfile. A stable per-input key reuses the same target cache;
          # concurrent writers may race, and the later save safely tolerates 409.
          {
            echo "toolchain=$ns-rustup-${RUST_VERSION}-${comps}"
            echo "toolchain_prefix=$ns-rustup-${RUST_VERSION}-"
            echo "registry=$ns-cargo-registry-${lock}"
            echo "registry_prefix=$ns-cargo-registry-"
            echo "target=$target"
            echo "target_prefix=$target_prefix"
          } >> "$GITHUB_OUTPUT"
          echo "image fingerprint $fp: target caches are isolated by job and restored only for identical inputs"
      - &c_tc
        name: Restore toolchain cache
        id: c_tc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/rustup
            .gitrun-ci/cargo/bin
          key: ${{ steps.keys.outputs.toolchain }}
          restore-keys: ${{ steps.keys.outputs.toolchain_prefix }}
      - &c_reg
        name: Restore cargo registry cache
        id: c_reg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo/registry/index
            .gitrun-ci/cargo/registry/cache
            .gitrun-ci/cargo/git/db
          key: ${{ steps.keys.outputs.registry }}
          restore-keys: ${{ steps.keys.outputs.registry_prefix }}
      - &c_tgt
        name: Restore target cache
        id: c_tgt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ steps.keys.outputs.target }}
          restore-keys: ${{ steps.keys.outputs.target_prefix }}
      - &rust_install
        name: Install Rust toolchain
        env:
          TC_MATCH: ${{ steps.c_tc.outputs.cache-matched-key }}
          REG_MATCH: ${{ steps.c_reg.outputs.cache-matched-key }}
          TC_KEY: ${{ steps.keys.outputs.toolchain }}
          REG_KEY: ${{ steps.keys.outputs.registry }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_cache_note toolchain "$TC_KEY" "$TC_MATCH" .gitrun-ci/rustup
          ci_cache_note cargo-registry "$REG_KEY" "$REG_MATCH" .gitrun-ci/cargo/registry
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            ci_run "download rustup-init" ci_download https://sh.rustup.rs "$RUNNER_TEMP/rustup-init.sh"
            export RUSTUP_INIT_SKIP_PATH_CHECK=yes
            ci_run "install rustup" sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          args=(--profile minimal --no-self-update)
          IFS=',' read -ra comps <<<"${RUST_COMPONENTS:-}"
          for c in "${comps[@]}"; do if [ -n "$c" ]; then args+=(-c "$c"); fi; done
          ci_run "rustup toolchain install $RUST_VERSION" rustup toolchain install "$RUST_VERSION" "${args[@]}"
          rustup default "$RUST_VERSION" > /dev/null
          if ls rust-toolchain rust-toolchain.toml >/dev/null 2>&1; then ci_note "rust-toolchain file found: RUSTUP_TOOLCHAIN=$RUST_VERSION overrides it in CI"; fi
          rustc -vV
          cargo --version
      - &rust_tnote
        name: Report target cache
        env:
          TGT_KEY: ${{ steps.keys.outputs.target }}
          TGT_MATCH: ${{ steps.c_tgt.outputs.cache-matched-key }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_cache_note target "$TGT_KEY" "$TGT_MATCH" target
      - name: Lint
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          fmt_run() { cargo fmt --all -- --check 2>&1 | ci_awk_fmt; }
          clippy_run() { ci_cargo_clippy --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --exclude gitrun-management --all-targets --all-features --locked --message-format=json-diagnostic-rendered-ansi -- -D warnings | ci_cargo_json; }
          doc_run() { ci_cargo_doc --workspace --exclude gitrun-dashboard-tauri --exclude gitrun-recovery --exclude gitrun-management --all-features --no-deps --locked --message-format=json-diagnostic-rendered-ansi | ci_cargo_json; }
          rc=0
          ci_run "cargo fmt --check" fmt_run || rc=1
          ci_run "cargo clippy (-D warnings)" clippy_run || rc=1
          ci_run "cargo doc --no-deps" doc_run || rc=1
          ci_run "cargo clippy shared management backend (headless)" ci_cargo_clippy --locked -p gitrun-management --no-default-features --all-targets -- -D warnings || rc=1
          ci_run "cargo doc shared management backend (headless)" ci_cargo_doc --locked -p gitrun-management --no-default-features --no-deps || rc=1
          exit "$rc"
      - &rust_prune
        name: Prune target cache
        id: prune
        if: success()
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          t="${CARGO_TARGET_DIR:-target}"
          if [ ! -d "$t" ]; then echo "save=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="$(du -sm "$t" | cut -f1)"
          find "$t" -maxdepth 3 -type d -name incremental -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$t/doc" "$t/tmp" "$t"/*/bundle
          # Preserve workspace artifacts and Cargo fingerprints across commits.
          # Cargo validates source/dependency fingerprints and rebuilds anything stale;
          # deleting every local crate forces all GitRun crates to recompile each job.
          after="$(du -sm "$t" | cut -f1)"
          echo "target cache pruned: ${before} MB → ${after} MB (limit ${TARGET_CACHE_MAX_MB} MB)"
          echo "largest target cache directories after pruning:"
          for dir in "$t"/*; do
            [ -d "$dir" ] || continue
            printf '  %s\n' "${dir#"$t"/}"
            du -sm "$dir"/* 2>/dev/null | sort -nr | head -n 5 | awk '{ printf "    %s MB  %s\n", $1, $2 }'
          done
          { echo "- 🧹 target cache pruned: **${before} MB → ${after} MB**"; } | ci_sum
          if [ "$after" -gt "$TARGET_CACHE_MAX_MB" ]; then
            ci_warn "target cache is ${after} MB, above the ${TARGET_CACHE_MAX_MB} MB limit: it is NOT saved (raise TARGET_CACHE_MAX_MB or reduce build outputs)"
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - &s_tc
        id: save_tc
        name: Save toolchain cache
        if: success() && steps.c_tc.outputs.cache-matched-key != steps.c_tc.outputs.cache-primary-key && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/rustup
            .gitrun-ci/cargo/bin
          key: ${{ steps.c_tc.outputs.cache-primary-key }}
      - &s_reg
        id: save_reg
        name: Save cargo registry cache
        if: success() && steps.c_reg.outputs.cache-matched-key != steps.c_reg.outputs.cache-primary-key && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo/registry/index
            .gitrun-ci/cargo/registry/cache
            .gitrun-ci/cargo/git/db
          key: ${{ steps.c_reg.outputs.cache-primary-key }}
      - &s_tgt
        id: save_tgt
        name: Save target cache
        if: success() && steps.prune.outputs.save == 'true' && steps.c_tgt.outputs.cache-matched-key != steps.c_tgt.outputs.cache-primary-key && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ steps.c_tgt.outputs.cache-primary-key }}
      - &cache_save_report
        name: Report cache save activity
        if: always()
        env:
          CACHE_WRITE_ALLOWED: ${{ env.CI_CACHE_WRITE_ALLOWED }}
          TC_OUTCOME: ${{ steps.save_tc.outcome || 'skipped' }}
          REG_OUTCOME: ${{ steps.save_reg.outcome || 'skipped' }}
          TGT_OUTCOME: ${{ steps.save_tgt.outcome || 'skipped' }}
          TC_MATCH: ${{ steps.c_tc.outputs.cache-matched-key }}
          TC_PRIMARY: ${{ steps.c_tc.outputs.cache-primary-key }}
          REG_MATCH: ${{ steps.c_reg.outputs.cache-matched-key }}
          REG_PRIMARY: ${{ steps.c_reg.outputs.cache-primary-key }}
          TGT_MATCH: ${{ steps.c_tgt.outputs.cache-matched-key }}
          TGT_PRIMARY: ${{ steps.c_tgt.outputs.cache-primary-key }}
          PRUNE_SAVE: ${{ steps.prune.outputs.save || 'unknown' }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          save_state() {
            local outcome="$1" matched="$2" primary="$3" reason="$4"
            case "$outcome" in
              success) echo "saved" ;;
              failure) echo "save failed (continue-on-error)" ;;
              *)
                if [ "$CACHE_WRITE_ALLOWED" != true ]; then
                  echo "not saved (fork pull-request cache-write policy)"
                elif [ -n "$matched" ] && [ "$matched" = "$primary" ]; then
                  echo "not saved (exact cache already restored)"
                elif [ "$reason" = over-budget ]; then
                  echo "not saved (target cache exceeded size limit)"
                elif [ "$reason" = prune-unavailable ]; then
                  echo "not determined (target cache pruning did not complete)"
                else
                  echo "skipped (job did not reach cache save)"
                fi
                ;;
            esac
          }
          {
            echo "### Cache save activity"
            echo
            echo "| Cache | Save result |"
            echo "|---|---|"
            printf '| Toolchain | %s |\n' "$(save_state "$TC_OUTCOME" "$TC_MATCH" "$TC_PRIMARY" "")"
            printf '| Cargo registry | %s |\n' "$(save_state "$REG_OUTCOME" "$REG_MATCH" "$REG_PRIMARY" "")"
            case "$PRUNE_SAVE" in
              false) prune_reason=over-budget ;;
              true) prune_reason="" ;;
              *) prune_reason=prune-unavailable ;;
            esac
            printf '| Target artifacts | %s |\n' "$(save_state "$TGT_OUTCOME" "$TGT_MATCH" "$TGT_PRIMARY" "$prune_reason")"
            echo
          } | ci_sum
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────── security-hardening gate ──
  security-hardening:
    name: Security hardening regression gate
    needs: [cargo-lock, rust-lint]
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.rust == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUST_COMPONENTS: ""
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - *rust_keys
      - *c_tc
      - *c_reg
      - *c_tgt
      - *rust_install
      - *rust_tnote
      - name: Run security regression suites
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          rc=0
          ci_run "Scheduler DockRegistry regression tests" cargo test --locked -p gitrun-scheduler dock_registry::tests || rc=1
          ci_run "Scheduler VM regression tests" cargo test --locked -p gitrun-scheduler vm::tests || rc=1
          ci_run "Scheduler VM resolution regression tests" cargo test --locked -p gitrun-scheduler vm_resolution::tests || rc=1
          ci_run "GSR security tests" cargo test --locked -p gitrun-gsr || rc=1
          ci_run "Vault security tests" cargo test --locked -p gitrun-vault || rc=1
          exit "$rc"
      - name: Verify security-sensitive workflow invariants
        run: python3 scripts/ci/check-security-invariants.py
      - *rust_prune
      - *s_tc
      - *s_reg
      - *s_tgt
      - *cache_save_report
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────── GSR watchdog lifecycle ──
  gsr-watchdog:
    name: GSR watchdog lifecycle and failure detection
    needs: [cargo-lock, rust-lint]
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.rust == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUST_COMPONENTS: ""
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - *rust_keys
      - *c_tc
      - *c_reg
      - *c_tgt
      - *rust_install
      - *rust_tnote
      - name: Test watchdog and real process-exit recovery
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          rc=0
          ci_run "GSR watchdog and security event tests" cargo test --locked -p gitrun-gsr || rc=1
          ci_run "Build the packaged CLI entrypoint" cargo build --locked -p gitrun-cli --bin gitrun || rc=1
          ci_run "Inject a real child-process exit into the GSR watchdog" bash scripts/test-runtime-contracts.sh target/debug/gitrun || rc=1
          exit "$rc"
      - *rust_prune
      - *s_tc
      - *s_reg
      - *s_tgt
      - *cache_save_report
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────── runtime contract gate ──
  runtime-contracts:
    name: Runtime contracts and configuration integration
    needs: [cargo-lock, rust-lint]
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.rust == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUST_COMPONENTS: ""
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - *rust_keys
      - *c_tc
      - *c_reg
      - *c_tgt
      - *rust_install
      - *rust_tnote
      - name: Run runtime and configuration contract tests
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          rc=0
          ci_run "Example environment parses with the runtime loader" cargo test --locked -p gitrun-core example_env_file_parses_and_validates_with_runtime_loader || rc=1
          ci_run "Example environment variables have runtime owners" cargo test --locked -p gitrun-core example_env_keys_have_runtime_consumers_or_explicit_external_owners || rc=1
          ci_run "Setup-generated environment and service contracts" cargo test --locked -p gitrun-setup generated_bootstrap_env_parses_and_validates_with_runtime_loader || rc=1
          ci_run "Setup installs the shared CLI, watchdog and Control Manager" cargo test --locked -p gitrun-setup installed_services_share_the_single_gitrun_binary_and_start_separate_watchdog || rc=1
          ci_run "Partial dashboard repository settings use safe defaults" cargo test --locked -p gitrun-core dashboard_partial_repository_settings_deserialize_with_safe_defaults || rc=1
          ci_run "Management backend build version follows version.txt" cargo test --locked -p gitrun-management --no-default-features management_build_version_matches_workspace_version_txt || rc=1
          ci_run "Control Manager IPC validates requests and enforces confirmations" cargo test --locked -p gitrun-management --no-default-features backend::control_manager::tests -- --nocapture || rc=1
          ci_run "Manage routes reads and writes through Control Manager IPC" cargo test --locked -p gitrun-cli control_manager_routing_tests -- --nocapture || rc=1
          ci_run "CLI doctor reads protected configuration through Control Manager IPC" cargo test --locked -p gitrun-cli control_manager_cli_routing_tests -- --nocapture || rc=1

          ci_run "Validate systemd unit syntax and service command alignment" python3 scripts/ci/check-systemd-units.py || rc=1
          exit "$rc"
      - name: Verify live GitDockRun mount namespace behavior
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ci-lib.sh"
          if ! command -v docker >/dev/null 2>&1 || [ ! -S /var/run/docker.sock ] || ! docker info >/dev/null 2>&1; then
            ci_err "GitDockRun privileged mount integration test requires a usable local Docker daemon; refusing to report a skipped security gate as green."
            exit 1
          fi
          if ! sudo -n true >/dev/null 2>&1; then
            ci_err "GitDockRun privileged mount integration test requires passwordless sudo on the configured self-hosted runner; refusing to skip."
            exit 1
          fi
          ci_run "Build scheduler mount integration test" cargo test --locked -p gitrun-scheduler --lib --no-run
          test_bin="$(find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -executable -name 'gitrun_scheduler-*' -print -quit)"
          if [ -z "$test_bin" ]; then
            ci_err "Could not locate the gitrun-scheduler unit test binary"
            exit 1
          fi
          ci_run "Bind, read-only enforcement, and unmount in a live container namespace" \
            sudo env GITRUN_ENABLE_PRIVILEGED_MOUNT_TESTS=1 "$test_bin" \
              --exact api_service::mount_runtime_tests::privileged_mount_namespace_bind_unmount_smoke_test --nocapture
      - *rust_prune
      - *s_tc
      - *s_reg
      - *s_tgt
      - *cache_save_report
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────── standalone systemd unit gate ──
  systemd-verify:
    name: systemd-analyze unit verification
    needs: cargo-lock
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.rust == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - name: Verify scheduler, watchdog and Control Manager units with systemd-analyze
        run: python3 scripts/ci/check-systemd-unit-isolated.py
      - *report
      - *job_result
      - *logs

  # ─────────────────────────────── Linux product target build matrix ──
  platform-target-check:
    name: Server + updater · ${{ matrix.target }}
    needs: [cargo-lock, rust-build]
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && (needs.cargo-lock.outputs.rust == 'true') }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.gitrun-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - *checkout
      - *boot
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Restore target-specific Cargo cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-target-check-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
          restore-keys: |
            gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-target-check-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}-
      - name: Record target cache restore
        env:
          TARGET_CACHE_PRIMARY: ${{ steps.target-cache.outputs.cache-primary-key }}
          TARGET_CACHE_MATCHED: ${{ steps.target-cache.outputs.cache-matched-key }}
          TARGET: ${{ matrix.target }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_cache_note "target-$TARGET" "$TARGET_CACHE_PRIMARY" "$TARGET_CACHE_MATCHED" .gitrun-cargo target
      - name: Verify cross-build runtime
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          verify_cross_build_runtime() {
            set -euo pipefail
            command -v docker >/dev/null 2>&1
            docker info >/dev/null
            command -v file
            command -v readelf
          }
          ci_run "Verify cross-build runtime" verify_cross_build_runtime
      - name: Install pinned cross compiler
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          install_cross() {
            set -euo pipefail
            cargo install cross --locked --version 0.2.5
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          }
          ci_run "Install cross 0.2.5" install_cross
      - name: Build the complete headless server and updater for target
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TERM_COLOR: always
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          build_target() {
            set -euo pipefail
            cross build --locked --release -p gitrun-cli --bin gitrun --target "$TARGET"
            cross test --locked -p gitrun-updater --no-run --target "$TARGET"
            cross check --locked -p gitrun-management --target "$TARGET"
            binary="target/$TARGET/release/gitrun"
            test -x "$binary"
            file "$binary"
            case "$TARGET" in
              x86_64-unknown-linux-gnu)
                test "$("$binary" --version --gitrun)" = "GitRun $(tr -d '[:space:]' < version.txt)"
                ;;
              aarch64-unknown-linux-gnu)
                readelf -h "$binary" | grep -Fq 'AArch64'
                readelf -l "$binary" | grep -Fq 'ld-linux-aarch64.so.1'
                ;;
              x86_64-unknown-linux-musl)
                readelf -h "$binary" | grep -Fq 'Advanced Micro Devices X86-64'
                # musl static PIE binaries may be reported as "static-pie linked"
                # by file(1). The ABI-level invariant is that no PT_INTERP loader
                # is requested; checking the ELF program headers is stable.
                if readelf -lW "$binary" | grep -Fq ' INTERP '; then
                  echo "musl binary unexpectedly requests a dynamic ELF interpreter" >&2
                  exit 1
                fi
                ;;
              aarch64-unknown-linux-musl)
                readelf -h "$binary" | grep -Fq 'AArch64'
                # A static musl executable must not declare a PT_INTERP loader.
                if readelf -lW "$binary" | grep -Fq ' INTERP '; then
                  echo "musl binary unexpectedly requests a dynamic ELF interpreter" >&2
                  exit 1
                fi
                ;;
            esac
          }
          ci_run "Build and validate server + updater ($TARGET)" build_target
      - name: Upload server executable for package certification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-build-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gitrun
          if-no-files-found: error
          retention-days: 1
      - name: Save target-specific Cargo cache
        id: target-cache-save
        if: success() && steps.target-cache.outputs.cache-hit != 'true' && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-target-check-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      - name: Record target cache save result
        if: always()
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.target-cache-save.outcome || 'skipped' }}
          TARGET: ${{ matrix.target }}
        run: |
          source "$RUNNER_TEMP/ci-lib.sh"
          {
            echo "### Target cache save"
            echo
            printf -- '- Target: `%s`\n' "$TARGET"
            printf -- '- Save action result: `%s`\n' "$CACHE_SAVE_OUTCOME"
            echo
          } | ci_sum
      - *report
      - *job_result
      - *logs

  # ───────────────────────────────────────────── Linux platform contracts ──
  release-package-certification:
    name: Release Server package certification · ${{ matrix.target }}
    needs: [cargo-lock, rust-lint, platform-target-check]
    if: ${{ needs.cargo-lock.outputs.rust == 'true' && needs.rust-lint.result == 'success' }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            xbps_static_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            xbps_static_arch: x86_64
          - target: x86_64-unknown-linux-musl
            xbps_static_arch: x86_64
          - target: aarch64-unknown-linux-musl
            xbps_static_arch: x86_64
    env:
      TARGET: ${{ matrix.target }}
      XBPS_STATIC_ARCH: ${{ matrix.xbps_static_arch }}
    steps:
      - *checkout
      - *boot
      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          test -n "$VERSION_NUMBER"
          VERSION="v$VERSION_NUMBER"
          {
            echo "VERSION_NUMBER=$VERSION_NUMBER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Download target executable built by CI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: server-build-${{ matrix.target }}
          path: canonical
      - name: Restore canonical binary permissions and target name
        shell: bash
        run: |
          set -euo pipefail
          test -s canonical/gitrun
          chmod 0755 canonical/gitrun
          mv canonical/gitrun "canonical/gitrun-$TARGET"
      - name: Synchronize Markdown source-version markers
        run: |
          set -euo pipefail
          python3 scripts/sync-markdown-version.py --version "$VERSION_NUMBER"
          python3 scripts/sync-markdown-version.py --check --version "$VERSION_NUMBER"
      - name: Set up pinned Go toolchain for nFPM
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Create TAR.ZST, DEB, RPM, APK, Arch and XBPS packages
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/server-packages"
          stage="$RUNNER_TEMP/server-stage"
          binary="$GITHUB_WORKSPACE/canonical/gitrun-$TARGET"
          rm -rf "$out" "$stage"
          mkdir -p "$out" "$stage/usr/bin" "$stage/usr/share/gitrun" "$stage/usr/share/doc/gitrun"
          test -x "$binary"
          install -m 0755 "$binary" "$stage/usr/bin/gitrun"
          install -m 0644 version.txt "$stage/usr/share/gitrun/version.txt"
          install -m 0644 LICENSE README.md config/config.example.env "$stage/usr/share/doc/gitrun/"
          tar -C "$stage" -czf "$out/GitRun-Server-$VERSION-$TARGET-server.tar.gz" .
          tar --zstd -C "$stage" -cf "$out/GitRun-Server-$VERSION-$TARGET-server.tar.zst" .
          package_stage="$RUNNER_TEMP/package-stage"
          rm -rf "$package_stage"
          cp -a "$stage" "$package_stage"
          unit_contents=""
          init_contents=""
          # GNU packages carry systemd units. Alpine APK ships OpenRC definitions;
          # Void XBPS ships runit definitions. GitRun setup owns enable/start and
          # creates only the runit supervision links after runtime configuration.
          if [[ "$TARGET" == *-gnu ]]; then
            mkdir -p "$package_stage/usr/lib/systemd/system"
            for unit in gitrun.service gitrun-gsr.service gitrun-control.service; do
              sed 's#/usr/local/bin/gitrun#/usr/bin/gitrun#g' "systemd/$unit" > "$package_stage/usr/lib/systemd/system/$unit"
            done
            grep -Fq 'ExecStart=/usr/bin/gitrun scheduler' "$package_stage/usr/lib/systemd/system/gitrun.service"
            grep -Fq 'ExecStart=/usr/bin/gitrun gsr-watchdog' "$package_stage/usr/lib/systemd/system/gitrun-gsr.service"
            grep -Fq 'ExecStart=/usr/bin/gitrun control-manager' "$package_stage/usr/lib/systemd/system/gitrun-control.service"
            unit_contents="$(cat <<YAML
            - src: $package_stage/usr/lib/systemd/system/gitrun.service
              dst: /usr/lib/systemd/system/gitrun.service
            - src: $package_stage/usr/lib/systemd/system/gitrun-gsr.service
              dst: /usr/lib/systemd/system/gitrun-gsr.service
            - src: $package_stage/usr/lib/systemd/system/gitrun-control.service
              dst: /usr/lib/systemd/system/gitrun-control.service
          YAML
          )"
          elif [[ "$TARGET" == *-musl ]]; then
            mkdir -p "$package_stage/etc/init.d" "$package_stage/usr/libexec/gitrun"
            install -m 0755 packaging/gitrun-service "$package_stage/usr/libexec/gitrun/gitrun-service"
            install -m 0755 packaging/openrc/gitrun "$package_stage/etc/init.d/gitrun"
            install -m 0755 packaging/openrc/gitrun-gsr "$package_stage/etc/init.d/gitrun-gsr"
            init_contents="$(cat <<YAML
            - src: $package_stage/usr/libexec/gitrun/gitrun-service
              dst: /usr/libexec/gitrun/gitrun-service
              file_info:
                mode: 0755
            - src: $package_stage/etc/init.d/gitrun
              dst: /etc/init.d/gitrun
              file_info:
                mode: 0755
            - src: $package_stage/etc/init.d/gitrun-gsr
              dst: /etc/init.d/gitrun-gsr
              file_info:
                mode: 0755
          YAML
          )"
          fi

          case "$TARGET" in
            x86_64-unknown-linux-gnu) arch=amd64; formats="deb rpm archlinux"; xbps_arch=x86_64; xbps_dep=glibc; base_dep=libc6; cpu=x86_64 ;;
            aarch64-unknown-linux-gnu) arch=arm64; formats="deb rpm archlinux"; xbps_arch=aarch64; xbps_dep=glibc; base_dep=libc6; cpu=aarch64 ;;
            x86_64-unknown-linux-musl) arch=amd64; formats="apk"; xbps_arch=x86_64-musl; xbps_dep=musl; base_dep=musl; cpu=x86_64-musl ;;
            aarch64-unknown-linux-musl) arch=arm64; formats="apk"; xbps_arch=aarch64-musl; xbps_dep=musl; base_dep=musl; cpu=aarch64-musl ;;
            *) echo "Unsupported package target: $TARGET" >&2; exit 1 ;;
          esac
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_apt rpm zstd
          command -v go >/dev/null
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/nfpm.yaml" <<NFPM
          name: gitrun-server
          arch: $arch
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun headless server, scheduler, runner manager and recovery CLI
          license: Apache-2.0
          contents:
            - src: $package_stage/usr/bin/gitrun
              dst: /usr/bin/gitrun
            - src: $package_stage/usr/share/gitrun/version.txt
              dst: /usr/share/gitrun/version.txt
            - src: $package_stage/usr/share/doc/gitrun/LICENSE
              dst: /usr/share/doc/gitrun/LICENSE
            - src: $package_stage/usr/share/doc/gitrun/README.md
              dst: /usr/share/doc/gitrun/README.md
            - src: $package_stage/usr/share/doc/gitrun/config.example.env
              dst: /usr/share/doc/gitrun/config.example.env
          $unit_contents
          $init_contents
          depends: [$base_dep]
          # nFPM's generic preremove hook maps to APK pre-deinstall.
          scripts:
            preremove: packaging/apk-pre-remove
          # APK lifecycle scripts use nFPM's dedicated top-level APK section.
          apk:
            scripts:
              postupgrade: packaging/apk-post-upgrade
          overrides:
            deb:
              depends: [libc6, policykit-1]
              conflicts: [gitrun]
              replaces: [gitrun]
              # Debian maintainer scripts use dpkg-specific arguments.
              # Keep them in the Debian override, not the Deb-only metadata block.
              scripts:
                postinstall: packaging/gitrun-postinst
                preremove: packaging/gitrun-prerm
            rpm:
              depends: [glibc, polkit]
            apk:
              depends: [musl]
            archlinux:
              depends: [glibc, polkit]
          NFPM
          for format in $formats; do
            nfpm package --config "$RUNNER_TEMP/nfpm.yaml" --packager "$format" --target "$out"
            case "$format" in
              deb) ext=deb; suffix=deb ;;
              rpm) ext=rpm; suffix=rpm ;;
              apk) ext=apk; suffix=apk ;;
              archlinux) ext=pkg.tar.zst; suffix=arch ;;
            esac
            produced="$(find "$out" -maxdepth 1 -type f -name "gitrun*.$ext" -print -quit)"
            test -n "$produced"
            if [[ "$format" == "apk" ]]; then
              apk_contents="$(tar -tzf "$produced")"
              for required in \
                usr/libexec/gitrun/gitrun-service \
                etc/init.d/gitrun etc/init.d/gitrun-gsr; do
                grep -Fqx "$required" <<< "$apk_contents" || {
                  echo "APK package is missing OpenRC resource: $required" >&2
                  exit 1
                }
              done
              grep -Eq '(^|/)\.pre-deinstall$' <<< "$apk_contents" || {
                echo "APK package is missing its pre-deinstall service cleanup hook" >&2
                exit 1
              }
              grep -Eq '(^|/)\.post-upgrade$' <<< "$apk_contents" || {
                echo "APK package is missing its post-upgrade service restart hook" >&2
                exit 1
              }
              if grep -Eq '(^|/)(etc|usr/lib)/systemd/' <<< "$apk_contents"; then
                echo "APK package must contain OpenRC resources, not systemd units" >&2
                exit 1
              fi
            fi
            mv "$produced" "$out/GitRun-Server-$VERSION-linux-$cpu-$suffix.$ext"
          done

          # XBPS is used by Void Linux, whose default init system is runit.
          # Build its archive from the neutral stage, never the systemd-enabled
          # package stage shared by DEB, RPM and Arch.
          xbps_stage="$RUNNER_TEMP/xbps-stage"
          rm -rf "$xbps_stage"
          cp -a "$stage" "$xbps_stage"
          mkdir -p "$xbps_stage/usr/libexec/gitrun" \
            "$xbps_stage/etc/sv/gitrun/log" "$xbps_stage/etc/sv/gitrun-gsr/log"
          install -m 0755 packaging/gitrun-service "$xbps_stage/usr/libexec/gitrun/gitrun-service"
          install -m 0755 packaging/xbps/INSTALL "$xbps_stage/INSTALL"
          install -m 0755 packaging/xbps/REMOVE "$xbps_stage/REMOVE"
          install -m 0755 packaging/runit/gitrun/run "$xbps_stage/etc/sv/gitrun/run"
          install -m 0755 packaging/runit/gitrun/log/run "$xbps_stage/etc/sv/gitrun/log/run"
          install -m 0755 packaging/runit/gitrun-gsr/run "$xbps_stage/etc/sv/gitrun-gsr/run"
          install -m 0755 packaging/runit/gitrun-gsr/log/run "$xbps_stage/etc/sv/gitrun-gsr/log/run"
          xbps_root="$RUNNER_TEMP/xbps"
          mkdir -p "$xbps_root"
          curl --fail --silent --show-error --location \
            "https://repo-default.voidlinux.org/static/xbps-static-latest.${XBPS_STATIC_ARCH}-musl.tar.xz" \
            -o "$RUNNER_TEMP/xbps-static.tar.xz"
          tar -xJf "$RUNNER_TEMP/xbps-static.tar.xz" -C "$xbps_root"
          xbps_create="$xbps_root/usr/bin/xbps-create"
          xbps_rindex="$xbps_root/usr/bin/xbps-rindex"
          xbps_query="$xbps_root/usr/bin/xbps-query"
          test -x "$xbps_create" && test -x "$xbps_rindex" && test -x "$xbps_query"
          python3 scripts/ci/build-xbps-server-package.py \
            --output "$out" \
            --stage "$xbps_stage" \
            --repository "$RUNNER_TEMP/xbps-repository" \
            --create "$xbps_create" \
            --rindex "$xbps_rindex" \
            --query "$xbps_query" \
            --architecture "$xbps_arch" \
            --dependency "$xbps_dep" \
            --package-id "gitrun-server-${VERSION_NUMBER}_1" \
            --version "$VERSION" \
            --cpu "$cpu" \
            --install-hook packaging/xbps/INSTALL \
            --remove-hook packaging/xbps/REMOVE

      - name: Audit every Server package output
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/server-packages"
          case "$TARGET" in
            x86_64-unknown-linux-gnu) cpu=x86_64 ;;
            aarch64-unknown-linux-gnu) cpu=aarch64 ;;
            x86_64-unknown-linux-musl) cpu=x86_64-musl ;;
            aarch64-unknown-linux-musl) cpu=aarch64-musl ;;
            *) echo "Unsupported target architecture: $TARGET" >&2; exit 1 ;;
          esac
          test -s "$out/GitRun-Server-$VERSION-$TARGET-server.tar.gz"
          test -s "$out/GitRun-Server-$VERSION-$TARGET-server.tar.zst"
          gzip_listing="$RUNNER_TEMP/gitrun-server-gzip-listing.txt"
          tar -tzf "$out/GitRun-Server-$VERSION-$TARGET-server.tar.gz" > "$gzip_listing"
          grep -Fq 'usr/bin/gitrun' "$gzip_listing"
          zstd_listing="$RUNNER_TEMP/gitrun-server-zstd-listing.txt"
          tar --zstd -tf "$out/GitRun-Server-$VERSION-$TARGET-server.tar.zst" > "$zstd_listing"
          grep -Fq 'usr/bin/gitrun' "$zstd_listing"
          test -s "$out/GitRun-Server-$VERSION-linux-$cpu-xbps.xbps"
          if [[ "$TARGET" == *-gnu ]]; then
            deb="$out/GitRun-Server-$VERSION-linux-$cpu-deb.deb"
            rpm_file="$out/GitRun-Server-$VERSION-linux-$cpu-rpm.rpm"
            arch="$out/GitRun-Server-$VERSION-linux-$cpu-arch.pkg.tar.zst"
            test "$(dpkg-deb -f "$deb" Package)" = gitrun-server
            test "$(dpkg-deb -f "$deb" Version)" = "$VERSION_NUMBER"
            test "$(dpkg-deb -f "$deb" Conflicts)" = gitrun
            test "$(dpkg-deb -f "$deb" Replaces)" = gitrun
            rpm -qp --queryformat '%{NAME} %{VERSION}' "$rpm_file" | grep -Fx "gitrun-server $VERSION_NUMBER"
            rpm_files="$(rpm -qpl "$rpm_file")"
            grep -Fxq /usr/bin/gitrun <<< "$rpm_files"
            arch_info="$(tar --zstd -xOf "$arch" .PKGINFO)"
            grep -Fq 'pkgname = gitrun-server' <<< "$arch_info"
            grep -Fq "pkgver = ${VERSION_NUMBER}-1" <<< "$arch_info"
            arch_files="$(tar --zstd -tf "$arch")"
            grep -Fq 'usr/bin/gitrun' <<< "$arch_files"
            grep -Fq 'usr/lib/systemd/system/gitrun.service' <<< "$arch_files"
          else
            apk="$out/GitRun-Server-$VERSION-linux-$cpu-apk.apk"
            apk_contents="$(tar -tzf "$apk")"
            grep -Fq '.PKGINFO' <<< "$apk_contents"
            apk_info="$(tar -xOzf "$apk" .PKGINFO)"
            grep -Fq 'pkgname = gitrun-server' <<< "$apk_info"
            grep -Eq "^pkgver = ${VERSION_NUMBER}([.-]|$)" <<< "$apk_info"
            grep -Fq 'etc/init.d/gitrun' <<< "$apk_contents"
            grep -Fq 'etc/init.d/gitrun-gsr' <<< "$apk_contents"
          fi
          xbps="$out/GitRun-Server-$VERSION-linux-$cpu-xbps.xbps"
          xbps_listing="$RUNNER_TEMP/gitrun-xbps-package-listing.txt"
          tar -tf "$xbps" > "$xbps_listing"
          grep -Fxq './usr/bin/gitrun' "$xbps_listing"
          sha256sum "$out"/* > "$out/SHA256SUMS"
          echo "Audited every generated Server package for $TARGET."
      - name: Upload immutable target packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-server-packages-${{ matrix.target }}
          path: ${{ runner.temp }}/server-packages/*
          if-no-files-found: error
          retention-days: 1
      - *report
      - *job_result
      - *logs


  migration-package-certification:
    name: Conditional legacy migration package certification
    needs: [cargo-lock, rust-lint, platform-target-check]
    if: ${{ needs.cargo-lock.outputs.rust == 'true' && needs.rust-lint.result == 'success' }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      secs: ${{ steps.report.outputs.secs }}
      cache: ${{ steps.report.outputs.cache }}
      errors: ${{ steps.report.outputs.errors }}
      migration_release: ${{ steps.migration.outputs.enabled }}
    steps:
      - *checkout
      - *boot
      - name: Detect one-time migration release
        id: migration
        env:
          MIGRATION_RELEASE_ENABLED: ${{ vars.GITRUN_ENABLE_MIGRATION_RELEASE }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          VERSION="v$VERSION_NUMBER"
          {
            echo "VERSION_NUMBER=$VERSION_NUMBER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
          if [ "$VERSION" = v1.9.1 ] && [ "$MIGRATION_RELEASE_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Migration package not applicable to $VERSION."
          fi
      - name: Download new Server binary
        if: steps.migration.outputs.enabled == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: server-build-x86_64-unknown-linux-gnu
          path: canonical
      - name: Restore canonical binary permissions
        if: steps.migration.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          chmod 0755 canonical/gitrun
          mv canonical/gitrun canonical/gitrun-x86_64-unknown-linux-gnu
      - name: Checkout exact 1.8.23 packaging contract
        if: steps.migration.outputs.enabled == 'true'
        run: git clone --quiet --depth 1 --branch v1.8.23 "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/gitrun-v1.8.23-packaging"
      - name: Assemble legacy-layout migration package
        if: steps.migration.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_apt dpkg-dev imagemagick
          test "$VERSION" = v1.9.1
          binary="$GITHUB_WORKSPACE/canonical/gitrun-x86_64-unknown-linux-gnu"
          test -x "$binary"
          root="$RUNNER_TEMP/legacy-deb-root"
          out="$RUNNER_TEMP/migration-package"
          rm -rf "$root" "$out"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/libexec/gitrun" \
            "$root/usr/share/gitrun" "$root/usr/share/doc/gitrun" "$root/usr/share/applications" "$out"
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: gitrun
          Version: $VERSION_NUMBER
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Vider06
          Description: GitRun self-hosted GitHub Actions runner manager
           One-time migration package for existing GitRun 1.8.23 installations.
          CONTROL
          install -m 0755 "$binary" "$root/usr/bin/gitrun"
          install -m 0755 "$RUNNER_TEMP/gitrun-v1.8.23-packaging/scripts/reinstall-latest.sh" "$root/usr/libexec/gitrun/reinstall-latest.sh"
          install -m 0755 "$RUNNER_TEMP/gitrun-v1.8.23-packaging/scripts/uninstall.sh" "$root/usr/libexec/gitrun/uninstall.sh"
          install -m 0755 packaging/gitrun-migration-prerm "$root/DEBIAN/prerm"
          install -m 0755 "$RUNNER_TEMP/gitrun-v1.8.23-packaging/packaging/gitrun-postinst" "$root/DEBIAN/postinst"
          sh -n "$root/DEBIAN/prerm"
          sh -n "$root/DEBIAN/postinst"
          install -m 0644 version.txt "$root/usr/share/gitrun/version.txt"
          install -m 0644 LICENSE "$root/usr/share/doc/gitrun/LICENSE"
          install -m 0644 README.md "$root/usr/share/doc/gitrun/README.md"
          install -m 0644 config/config.example.env "$root/usr/share/doc/gitrun/config.example.env"
          install -m 0644 "$RUNNER_TEMP/gitrun-v1.8.23-packaging/packaging/gitrun.desktop" "$root/usr/share/applications/gitrun.desktop"
          for size in 32 64 128 256 512; do
            source="$RUNNER_TEMP/gitrun-v1.8.23-packaging/assets/gitrun-icon-$size.png"
            destination="$root/usr/share/icons/hicolor/${size}x${size}/apps/gitrun.png"
            test -s "$source"
            mkdir -p "$(dirname "$destination")"
            convert "$source" -alpha on -define png:color-type=6 "PNG32:$destination"
          done
          artifact="GitRun-$VERSION-linux-x86_64-deb.deb"
          dpkg-deb --build --root-owner-group "$root" "$out/$artifact" >/dev/null
          test "$(dpkg-deb -f "$out/$artifact" Package)" = gitrun
          test "$(dpkg-deb -f "$out/$artifact" Version)" = "$VERSION_NUMBER"
          control_inspect="$RUNNER_TEMP/migration-control-inspect"
          dpkg-deb -e "$out/$artifact" "$control_inspect"
          sh -n "$control_inspect/prerm"
          grep -Fq 'in-favour' "$control_inspect/prerm"
          grep -Fq 'gitrun-server' "$control_inspect/prerm"
          mock_bin="$RUNNER_TEMP/migration-prerm-mock"
          mock_log="$RUNNER_TEMP/migration-prerm-systemctl.log"
          mkdir -p "$mock_bin"
          cat > "$mock_bin/systemctl" <<'MOCK'
          #!/bin/sh
          printf '%s\n' "$*" >> "$GITRUN_MIGRATION_SYSTEMCTL_LOG"
          MOCK
          chmod 0755 "$mock_bin/systemctl"
          : > "$mock_log"
          PATH="$mock_bin:$PATH" GITRUN_MIGRATION_SYSTEMCTL_LOG="$mock_log" \
            "$control_inspect/prerm" remove in-favour gitrun-server "$VERSION_NUMBER"
          test ! -s "$mock_log"
          PATH="$mock_bin:$PATH" GITRUN_MIGRATION_SYSTEMCTL_LOG="$mock_log" \
            "$control_inspect/prerm" remove
          grep -Fq 'disable --now gitrun-gsr.service gitrun.service' "$mock_log"
          dpkg-deb -x "$out/$artifact" "$RUNNER_TEMP/legacy-package-inspect"
          test -x "$RUNNER_TEMP/legacy-package-inspect/usr/bin/gitrun"
          test -x "$RUNNER_TEMP/legacy-package-inspect/usr/libexec/gitrun/reinstall-latest.sh"
          sha256sum "$out/$artifact" > "$out/SHA256SUMS"
      - name: Upload legacy migration package
        if: steps.migration.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-migration-deb-linux-x86_64
          path: ${{ runner.temp }}/migration-package/*
          if-no-files-found: error
          retention-days: 1
      - *report
      - *job_result
      - *logs



  release-dashboard-package-certification:
    name: Release Desktop GNU package certification · ${{ matrix.arch }}
    needs: [tauri, tauri-arm64]
    if: ${{ needs.tauri.result == 'success' && needs.tauri-arm64.result == 'success' }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            package_arch: amd64
          - arch: aarch64
            package_arch: arm64
    env:
      DESKTOP_ARCH: ${{ matrix.arch }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
    steps:
      - *checkout
      - *boot
      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          test -n "$VERSION_NUMBER"
          VERSION="v$VERSION_NUMBER"
          {
            echo "VERSION_NUMBER=$VERSION_NUMBER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Download x86_64 Dashboard build
        if: matrix.arch == 'x86_64'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gitrun-tauri-bundles
          path: dashboard-input
      - name: Download ARM64 Dashboard build
        if: matrix.arch == 'aarch64'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gitrun-dashboard-arm64-ci
          path: dashboard-input
      - name: Stage Dashboard AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dashboard-input -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -s "$appimage"
          file "$appimage"
          stage="$RUNNER_TEMP/dashboard-stage"
          out="$RUNNER_TEMP/dashboard-package"
          rm -rf "$stage" "$out"
          mkdir -p "$stage/opt/gitrun-desktop" "$stage/usr/share/applications" "$out"
          install -m 0755 "$appimage" "$stage/opt/gitrun-desktop/GitRun.AppImage"
           install -m 0755 "$appimage" "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH.AppImage"
          cat > "$stage/usr/share/applications/gitrun-desktop.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=GitRun Desktop
          Comment=GitRun desktop management interface
          Exec=/opt/gitrun-desktop/GitRun.AppImage
          Terminal=false
          Categories=Development;System;
          DESKTOP
      - name: Install package inspection tools
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_apt rpm zstd
      - name: Set up pinned Go toolchain for nFPM
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Create independent Dashboard DEB, RPM and Arch packages
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dashboard-stage"
          out="$RUNNER_TEMP/dashboard-package"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/dashboard-nfpm.yaml" <<NFPM
          name: gitrun-desktop
          arch: $PACKAGE_ARCH
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun Tauri Dashboard, independently installable from the server
          license: Apache-2.0
          depends: [libwebkit2gtk-4.1-0, policykit-1]
          overrides:
            rpm:
              depends: ["(webkit2gtk4.1 or libwebkit2gtk-4_1-0)", polkit]
            archlinux:
              depends: [webkit2gtk-4.1, polkit]
          contents:
            - src: $stage/opt/gitrun-desktop/GitRun.AppImage
              dst: /opt/gitrun-desktop/GitRun.AppImage
              file_info:
                mode: 0755
            - src: $stage/usr/share/applications/gitrun-desktop.desktop
              dst: /usr/share/applications/gitrun-desktop.desktop
          NFPM
          config="$RUNNER_TEMP/dashboard-nfpm.yaml"
          nfpm package --config "$config" --packager deb --target "$out"
          deb="$(find "$out" -maxdepth 1 -type f -name 'gitrun-desktop_*.deb' -print -quit)"
          test -n "$deb"
          mv "$deb" "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-deb.deb"
          test "$(dpkg-deb -f "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-deb.deb" Package)" = gitrun-desktop
          test "$(dpkg-deb -f "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-deb.deb" Version)" = "$VERSION_NUMBER"
          nfpm package --config "$config" --packager rpm --target "$out"
          rpm_file="$(find "$out" -maxdepth 1 -type f -name 'gitrun-desktop-*.rpm' -print -quit)"
          test -n "$rpm_file"
          mv "$rpm_file" "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-rpm.rpm"
          test "$(rpm -qp --queryformat '%{NAME}' "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-rpm.rpm")" = gitrun-desktop
          rpm_requires="$(rpm -qp --requires "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-rpm.rpm")"
          grep -Fq webkit2gtk4.1 <<< "$rpm_requires"
          grep -Fq libwebkit2gtk-4_1-0 <<< "$rpm_requires"
          nfpm package --config "$config" --packager archlinux --target "$out"
          arch="$(find "$out" -maxdepth 1 -type f -name 'gitrun-desktop-*.pkg.tar.zst' -print -quit)"
          test -n "$arch"
          mv "$arch" "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-archlinux.pkg.tar.zst"
          arch_info="$(tar --zstd -xOf "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-archlinux.pkg.tar.zst" .PKGINFO)"
          grep -Fq 'pkgname = gitrun-desktop' <<< "$arch_info"
          grep -Fq 'depend = webkit2gtk-4.1' <<< "$arch_info"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - name: Upload certified GNU Desktop packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-dashboard-gnu-packages-${{ matrix.arch }}
          path: ${{ runner.temp }}/dashboard-package/*
          if-no-files-found: error
          retention-days: 1
      - *report
      - *job_result
      - *logs


  release-dashboard-musl-build-certification:
    name: Release Desktop musl build certification · ${{ matrix.target }}
    needs: [cargo-lock, rust-lint, frontend]
    if: ${{ needs.cargo-lock.outputs.tauri == 'true' && needs.rust-lint.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            arch: x86_64
            kind: musl
            docker_platform: linux/amd64
            musl_distro: alpine
            cache_variant: alpine-rust-1.99.0-alpine3.24
            container_image: rust:1.99.0-alpine3.24
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: aarch64
            kind: musl
            docker_platform: linux/arm64
            musl_distro: void
            cache_variant: void-musl-20260801r1
            container_image: ghcr.io/void-linux/void-musl-full:20260801r1
    env:
      TARGET: ${{ matrix.target }}
      DESKTOP_ARCH: ${{ matrix.arch }}
      BUILD_KIND: musl
      MUSL_DISTRO: ${{ matrix.musl_distro }}
      CONTAINER_IMAGE: ${{ matrix.container_image }}
      CARGO_HOME: ${{ github.workspace }}/.gitrun-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.gitrun-npm-cache
    steps:
      - *checkout
      - *boot
      - name: Set Dashboard package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          test -n "$VERSION_NUMBER"
          VERSION="v$VERSION_NUMBER"
          {
            echo "VERSION_NUMBER=$VERSION_NUMBER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Restore musl Dashboard Cargo and npm caches
        if: matrix.kind == 'musl'
        id: dashboard-cache-musl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
            .gitrun-npm-cache
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-desktop-musl-${{ matrix.cache_variant }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'crates/gitrun-dashboard-tauri/package-lock.json', '.github/workflows/release.yml', 'scripts/ci/check-dashboard-distro-dependencies.py') }}
          restore-keys: |
            gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-desktop-musl-${{ matrix.cache_variant }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-
      - name: Build native musl Dashboard in distro-native environment
        if: matrix.kind == 'musl'
        env:
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$NPM_CONFIG_CACHE"
          docker run --rm --pull=always --platform "$DOCKER_PLATFORM" \
            -e VERSION_NUMBER="$VERSION_NUMBER" \
            -e TARGET="$TARGET" \
            -e RUST_VERSION="$RUST_VERSION" \
            -e MUSL_DISTRO="$MUSL_DISTRO" \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            -e CARGO_HOME=/workspace/.gitrun-cargo \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            -e NPM_CONFIG_CACHE=/workspace/.gitrun-npm-cache \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/crates/gitrun-dashboard-tauri \
            "$CONTAINER_IMAGE" sh -ec '
              if [ "$MUSL_DISTRO" = "alpine" ]; then
                apk add --no-cache build-base pkgconf nodejs npm curl wget file openssl-dev \
                  webkit2gtk-4.1-dev libayatana-appindicator-dev librsvg font-dejavu imagemagick \
                  openssl-libs-static cairo-static harfbuzz-static glib-static wayland-static zlib-static
              else
                xbps-install -Suy
                xbps-install -y base-devel pkg-config nodejs curl ca-certificates file ImageMagick \
                  libwebkit2gtk41-devel libayatana-appindicator-devel librsvg-devel gtk+3-devel \
                  openssl-devel cairo-devel harfbuzz-devel glib-devel wayland-devel zlib-devel
                export RUSTUP_HOME=/workspace/.gitrun-cargo/rustup
                curl --fail --silent --show-error --location \
                  "https://static.rust-lang.org/rustup/dist/${TARGET}/rustup-init" \
                  -o /tmp/rustup-init
                chmod 0755 /tmp/rustup-init
                /tmp/rustup-init -y --no-modify-path --profile minimal \
                  --default-toolchain "$RUST_VERSION" --default-host "$TARGET"
                . "$CARGO_HOME/env"
              fi
              if [ "$MUSL_DISTRO" = "alpine" ]; then
                # The pinned rust:1.99.0-alpine image already contains its matching
                # toolchain under /usr/local/rustup; do not shadow it with an empty cache.
                export RUSTUP_HOME=/usr/local/rustup
              fi
              test "$(rustc -vV | sed -n "s/^host: //p")" = "$TARGET"
              rustc --version | grep -Fq "rustc $RUST_VERSION "
              pkg-config --exists gtk+-3.0 webkit2gtk-4.1 ayatana-appindicator3-0.1
              node --version
              npm --version
              node --input-type=module - "$VERSION_NUMBER" <<NODE
          import fs from "node:fs";
          const version = process.argv[2];
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const value = JSON.parse(fs.readFileSync(file, "utf8"));
            value.version = version;
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + "\\n");
          }
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          lock.version = version;
          lock.packages[""].version = version;
          fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\\n");
          NODE
              npm ci
              for icon in src-tauri/icons/*.png; do
                [ -f "$icon" ] || continue
                tmp="$(mktemp)"
                convert "$icon" -alpha on -define png:color-type=6 "PNG32:$tmp"
                mv "$tmp" "$icon"
              done
              npm run tauri build -- --ci --no-bundle
              binary=/workspace/target/release/gitrun-dashboard-tauri
              test -s "$binary"
              ldd "$binary" > /tmp/gitrun-dashboard-ldd.txt
              if grep -Fq "not found" /tmp/gitrun-dashboard-ldd.txt; then
                cat /tmp/gitrun-dashboard-ldd.txt >&2
                exit 1
              fi
            '
          # The container installs distro packages as root and writes to bind-mounted caches.
          # Return cache ownership to the hosted runner before actions/cache/save reads them.
          sudo chown -R "$(id -u):$(id -g)" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$NPM_CONFIG_CACHE"
          out="$RUNNER_TEMP/dashboard-musl-canonical"
          rm -rf "$out"
          mkdir -p "$out"
          install -m 0755 "$GITHUB_WORKSPACE/target/release/gitrun-dashboard-tauri" "$out/GitRun-Desktop-$VERSION-$TARGET.bin"
      - name: Upload independent musl Dashboard executable
        if: matrix.kind == 'musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-dashboard-musl-build-${{ matrix.target }}
          path: ${{ runner.temp }}/dashboard-musl-canonical/*
          if-no-files-found: error
          retention-days: 1
      - name: Save musl Dashboard Cargo and npm caches
        if: matrix.kind == 'musl' && success() && steps.dashboard-cache-musl.outputs.cache-hit != 'true' && env.CI_CACHE_WRITE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
            .gitrun-npm-cache
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-desktop-musl-${{ matrix.cache_variant }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'crates/gitrun-dashboard-tauri/package-lock.json', '.github/workflows/release.yml', 'scripts/ci/check-dashboard-distro-dependencies.py') }}
      - *report
      - *job_result
      - *logs


  release-dashboard-musl-package-certification:
    name: Release Desktop musl package certification · ${{ matrix.arch }}
    needs: [release-dashboard-musl-build-certification]
    if: ${{ needs.release-dashboard-musl-build-certification.result == 'success' }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            target_triple: x86_64-unknown-linux-musl
            arch: x86_64
            package_arch: amd64
            kind: musl
            xbps_arch: x86_64-musl
            xbps_static_arch: x86_64
          - target: aarch64-unknown-linux-musl
            target_triple: aarch64-unknown-linux-musl
            arch: aarch64
            package_arch: arm64
            kind: musl
            xbps_arch: aarch64-musl
            xbps_static_arch: x86_64
    env:
      TARGET: ${{ matrix.target_triple }}
      DESKTOP_ARCH: ${{ matrix.arch }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      XBPS_ARCH: ${{ matrix.xbps_arch }}
      XBPS_STATIC_ARCH: ${{ matrix.xbps_static_arch }}
    steps:
      - *checkout
      - *boot
      - name: Set Dashboard package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          test -n "$VERSION_NUMBER"
          VERSION="v$VERSION_NUMBER"
          {
            echo "VERSION_NUMBER=$VERSION_NUMBER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Download musl Dashboard executable
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ci-dashboard-musl-build-${{ matrix.target }}
          path: canonical
      - name: Set up pinned Go toolchain for nFPM (musl)
        if: matrix.kind == 'musl'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Build musl APK and XBPS packages
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/canonical/GitRun-Desktop-$VERSION-$TARGET.bin"
          test -s "$binary"
          stage="$RUNNER_TEMP/dashboard-musl-stage"
          out="$RUNNER_TEMP/dashboard-package"
          rm -rf "$stage" "$out"
          mkdir -p "$stage/usr/bin" "$stage/usr/share/applications" "$out"
          install -m 0755 "$binary" "$stage/usr/bin/gitrun-desktop"
          cat > "$stage/usr/share/applications/gitrun-desktop.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=GitRun Desktop
          Comment=GitRun desktop management interface
          Exec=/usr/bin/gitrun-desktop
          Terminal=false
          Categories=Development;System;
          DESKTOP
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/dashboard-musl-nfpm.yaml" <<NFPM
          name: gitrun-desktop
          arch: $PACKAGE_ARCH
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun Tauri Dashboard for musl Linux, independently installable from the server
          license: Apache-2.0
          depends: [musl]
          overrides:
            apk:
              depends: [musl, webkit2gtk-4.1, polkit]
          contents:
            - src: $stage/usr/bin/gitrun-desktop
              dst: /usr/bin/gitrun-desktop
              file_info:
                mode: 0755
            - src: $stage/usr/share/applications/gitrun-desktop.desktop
              dst: /usr/share/applications/gitrun-desktop.desktop
          NFPM
          if [ "$DESKTOP_ARCH" = "x86_64" ]; then
            nfpm package --config "$RUNNER_TEMP/dashboard-musl-nfpm.yaml" --packager apk --target "$out"
            apk="$(find "$out" -maxdepth 1 -type f -name 'gitrun-desktop*.apk' -print -quit)"
            test -n "$apk"
            mv "$apk" "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-musl-apk.apk"
            apk_contents="$(tar -tzf "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-musl-apk.apk")"
            grep -Fq '.PKGINFO' <<< "$apk_contents"
          fi

          xbps_stage="$RUNNER_TEMP/dashboard-xbps-stage"
          cp -a "$stage" "$xbps_stage"
          xbps_root="$RUNNER_TEMP/xbps-static"
          mkdir -p "$xbps_root"
          curl --fail --silent --show-error --location \
            "https://repo-default.voidlinux.org/static/xbps-static-latest.${XBPS_STATIC_ARCH}-musl.tar.xz" \
            -o "$RUNNER_TEMP/xbps-static.tar.xz"
          tar -xJf "$RUNNER_TEMP/xbps-static.tar.xz" -C "$xbps_root"
          xbps_create="$xbps_root/usr/bin/xbps-create"
          xbps_rindex="$xbps_root/usr/bin/xbps-rindex"
          xbps_query="$xbps_root/usr/bin/xbps-query"
          test -x "$xbps_create" && test -x "$xbps_rindex" && test -x "$xbps_query"
          (cd "$out" && "$xbps_create" -A "$XBPS_ARCH" \
            -n "gitrun-desktop-${VERSION_NUMBER}_1" -D "musl libwebkit2gtk41 polkit" \
            -H https://github.com/Vider06/GitRun -l Apache-2.0 -m Vider06 \
            -s "GitRun Desktop for musl Linux" "$xbps_stage")
          xbps="$(find "$out" -maxdepth 1 -type f -name 'gitrun-desktop*.xbps' -print -quit)"
          test -n "$xbps"
          mv "$xbps" "$out/GitRun-Desktop-$VERSION-linux-$DESKTOP_ARCH-musl-xbps.xbps"
          "$xbps_rindex" -a "$out"/*.xbps
          desktop_deps="$("$xbps_query" -R --repository="$out" -x "gitrun-desktop-${VERSION_NUMBER}_1")"
          grep -Fq musl <<< "$desktop_deps"
          grep -Fq libwebkit2gtk41 <<< "$desktop_deps"
          grep -Fq polkit <<< "$desktop_deps"
      - name: Upload musl Desktop packages
        if: matrix.kind == 'musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-dashboard-musl-packages-${{ matrix.arch }}
          path: ${{ runner.temp }}/dashboard-package/*
          if-no-files-found: error
          retention-days: 1
      - *report
      - *job_result
      - *logs


  release-inputs-certification:
    name: Release shared metadata and input certification
    needs: [cargo-lock]
    if: ${{ needs.cargo-lock.outputs.rust == 'true' }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    steps:
      - *checkout
      - *boot
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install metadata tools
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_apt jq zip
      - name: Synchronize and validate release version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          test -n "$VERSION_NUMBER"
          python3 scripts/sync-markdown-version.py --version "$VERSION_NUMBER"
          python3 scripts/sync-markdown-version.py --check --version "$VERSION_NUMBER"
          python3 scripts/check-version-consistency.py
      - name: Assemble the exact shared Release inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/common"
          library="$RUNNER_TEMP/library"
          rm -rf "$root" "$library"
          mkdir -p "$root" "$library"
          sources=(
            "Core/Dockers/runners/linux-x86_64/profiles.json"
            "crates/gitrun-cli/src/cat/cat_states.json"
            "crates/gitrun-cli/src/cat/gitrun.json"
            "crates/gitrun-dashboard-tauri/package.json"
            "crates/gitrun-dashboard-tauri/package-lock.json"
            "crates/gitrun-dashboard-tauri/src-tauri/capabilities/default.json"
            "crates/gitrun-dashboard-tauri/src-tauri/tauri.conf.json"
            "crates/gitrun-recovery/capabilities/default.json"
            "crates/gitrun-recovery/tauri.conf.json"
            "release/release-manifest.example.json"
            "release/release-manifest.schema.json"
          )
          entries=()
          for source in "${sources[@]}"; do
            test -f "$source"
            jq -e 'type == "object" or type == "array"' "$source" >/dev/null
            mkdir -p "$library/$(dirname "$source")"
            install -m 0644 "$source" "$library/$source.Back"
            entries+=("$source.Back")
          done
          (cd "$library" && zip -q -9 "$root/library.zip" "${entries[@]}")
          cargo metadata --locked --format-version 1 > "$root/cargo-metadata.json"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg created "$created" --arg commit "$GITHUB_SHA" \
            '{spdxVersion:"SPDX-2.3",dataLicense:"CC0-1.0",SPDXID:"SPDXRef-DOCUMENT",name:"GitRun",documentNamespace:("https://github.com/Vider06/GitRun/spdx/" + $commit),creationInfo:{created:$created,creators:["Tool: GitRun CI"]},packages:[.packages | to_entries[] | {SPDXID:("SPDXRef-Package-" + (.key|tostring)),name:.value.name,versionInfo:.value.version,downloadLocation:(.value.source // "NOASSERTION")}]}' \
            "$root/cargo-metadata.json" > "$root/sbom.spdx.json"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema:"gitrun.provenance.v2",git_commit:$commit,run_id:$run,server_targets:["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl"],updater_archive:"tar.gz",package_formats:["deb","rpm","apk","archlinux","xbps","tar.zst"],desktop:"GitRun-Desktop",desktop_targets:["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl"],desktop_package_formats:["deb","rpm","archlinux","appimage","apk","xbps"],desktop_package_arches:{apk:["x86_64"],xbps:["x86_64","aarch64"]}}' \
            > "$root/provenance.json"
          for metadata in cargo-metadata.json sbom.spdx.json provenance.json; do jq -e . "$root/$metadata" >/dev/null; done
          test "$(unzip -Z1 "$root/library.zip" | wc -l)" -eq 11
      - name: Upload certified shared Release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-release-common
          path: ${{ runner.temp }}/common/*
          if-no-files-found: error
          retention-days: 1
      - *report
      - *job_result
      - *logs

  release-asset-assembly-certification:
    name: Final Release asset assembly and exact inventory
    needs:
      - release-inputs-certification
      - release-package-certification
      - migration-package-certification
      - release-dashboard-package-certification
      - release-dashboard-musl-build-certification
      - release-dashboard-musl-package-certification
      - formal-verification
      - miri
    if: ${{ always() && needs.release-inputs-certification.result == 'success' && needs.release-package-certification.result == 'success' && needs.migration-package-certification.result == 'success' && needs.release-dashboard-package-certification.result == 'success' && needs.release-dashboard-musl-build-certification.result == 'success' && needs.release-dashboard-musl-package-certification.result == 'success' && needs.formal-verification.result == 'success' && needs.miri.result == 'success' }}
    runs-on: *runner
    timeout-minutes: 60
    permissions:
      contents: read
    outputs: *job_outputs
    env:
      MIGRATION_RELEASE: ${{ needs.migration-package-certification.outputs.migration_release }}
    steps:
      - *checkout
      - *boot
      - name: Download certified Server packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: ci-server-packages-*
          path: all-assets/server
          merge-multiple: true
      - name: Download certified GNU Desktop packages and AppImages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: ci-dashboard-gnu-packages-*
          path: all-assets/desktop-gnu
          merge-multiple: true
      - name: Download certified musl Desktop executables
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: ci-dashboard-musl-build-*
          path: all-assets/desktop-musl-build
          merge-multiple: true
      - name: Download certified musl Desktop packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: ci-dashboard-musl-packages-*
          path: all-assets/desktop-musl-packages
          merge-multiple: true
      - name: Download exact shared Release inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ci-release-common
          path: all-assets/common
      - name: Download conditional migration package
        if: env.MIGRATION_RELEASE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ci-migration-deb-linux-x86_64
          path: all-assets/migration
      - name: Install release asset inspection tools
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ci-lib.sh"
          ci_apt jq zstd unzip rpm file
      - name: Assemble canonical Release asset set
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/release-assets"
          rm -rf "$root"
          mkdir -p "$root"
          for group in server desktop-gnu desktop-musl-build desktop-musl-packages migration; do
            [ -d "all-assets/$group" ] || continue
            find "all-assets/$group" -maxdepth 1 -type f -name 'GitRun-*' -exec cp -t "$root" {} +
          done
          cp all-assets/common/library.zip all-assets/common/cargo-metadata.json all-assets/common/sbom.spdx.json all-assets/common/provenance.json "$root/"
          find "$root" -maxdepth 1 -type f \
            \( -name 'GitRun-Desktop-*.AppImage' -o -name 'GitRun-Desktop-*-unknown-linux-musl.bin' \) \
            -exec chmod 0755 {} +
          VERSION_NUMBER="$(tr -d '[:space:]' < version.txt)"
          VERSION="v$VERSION_NUMBER"
          expected=()
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            expected+=("GitRun-Server-$VERSION-$target-server.tar.gz" "GitRun-Server-$VERSION-$target-server.tar.zst")
          done
          for arch in x86_64 aarch64; do
            expected+=("GitRun-Server-$VERSION-linux-$arch-deb.deb" "GitRun-Server-$VERSION-linux-$arch-rpm.rpm" "GitRun-Server-$VERSION-linux-$arch-arch.pkg.tar.zst" "GitRun-Server-$VERSION-linux-$arch-xbps.xbps")
            expected+=("GitRun-Server-$VERSION-linux-$arch-musl-apk.apk" "GitRun-Server-$VERSION-linux-$arch-musl-xbps.xbps")
            expected+=("GitRun-Desktop-$VERSION-linux-$arch-deb.deb" "GitRun-Desktop-$VERSION-linux-$arch-rpm.rpm" "GitRun-Desktop-$VERSION-linux-$arch-archlinux.pkg.tar.zst" "GitRun-Desktop-$VERSION-linux-$arch.AppImage")
            expected+=("GitRun-Desktop-$VERSION-linux-$arch-musl-xbps.xbps")
            expected+=("GitRun-Desktop-$VERSION-$arch-unknown-linux-musl.bin")
          done
          expected+=("GitRun-Desktop-$VERSION-linux-x86_64-musl-apk.apk" library.zip cargo-metadata.json sbom.spdx.json provenance.json)
          if [ "$MIGRATION_RELEASE" = true ]; then expected+=("GitRun-$VERSION-linux-x86_64-deb.deb"); fi
          for name in "${expected[@]}"; do
            test -s "$root/$name" || { echo "Missing required Release asset: $name" >&2; exit 1; }
          done
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual_sorted < <(find "$root" -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual_sorted[@]}")
          for metadata in cargo-metadata.json sbom.spdx.json provenance.json; do jq -e . "$root/$metadata" >/dev/null; done
          mapfile -t library_members < <(unzip -Z1 "$root/library.zip")
          (( ${#library_members[@]} == 11 ))
          for member in "${library_members[@]}"; do
            [[ "$member" == *.json.Back && "$member" != /* && "$member" != *".."* && "$member" != *\\* ]]
            unzip -p "$root/library.zip" "$member" | jq -e 'type == "object" or type == "array"' >/dev/null
          done
          for package in "$root"/GitRun-*; do
            test -s "$package"
            name="${package##*/}"
            case "$name" in
              *.deb) dpkg-deb --info "$package" >/dev/null ;;
              *.rpm) rpm -qp "$package" >/dev/null ;;
              *.pkg.tar.zst) tar --zstd -tf "$package" >/dev/null ;;
              *.apk) tar -tzf "$package" >/dev/null ;;
              # XBPS payloads created by xbps-create are plain tar archives.
              *.xbps) tar -tf "$package" >/dev/null ;;
              *-server.tar.gz) tar -tzf "$package" >/dev/null ;;
              *-server.tar.zst) tar --zstd -tf "$package" >/dev/null ;;
              *.AppImage|*.bin) test -x "$package"; file "$package" >/dev/null ;;
              *) echo "Unknown Release asset type: $name" >&2; exit 1 ;;
            esac
          done
          (cd "$root" && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload assembled CI Release candidate assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-certified-release-asset-set
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
      - *report
      - *job_result
      - *logs
