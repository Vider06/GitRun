name: GitRun CI

on:
  push:
    branches: [main, BigRework]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gitrun-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect project components
    runs-on: [self-hosted, Linux, X64]
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      docker: ${{ steps.detect.outputs.docker }}
      powershell: ${{ steps.detect.outputs.powershell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          find . -name '*.py' -not -path './.git/*' -print -quit | grep -q . && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          { [ -f docker-compose.yml ] || find docker -name 'Dockerfile*' -print -quit | grep -q .; } && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"
          find . -name '*.ps1' -not -path './.git/*' -print -quit | grep -q . && echo "powershell=true" >> "$GITHUB_OUTPUT" || echo "powershell=false" >> "$GITHUB_OUTPUT"

  python:
    name: Python validation
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify Python runtime
        run: python3 --version
      - name: Compile Python sources
        run: |
          python3 -m compileall -q .
      - name: Run project static checks
        run: python3 scripts/test-gitrun.py

  rust:
    name: Rust check and tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust bootstrap temp
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: ${{ runner.temp }}/cargo
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_HOME" "$RUSTUP_HOME"
          test -w "$TMPDIR"
          test -w "$CARGO_HOME"
          test -w "$RUSTUP_HOME"
      - name: Setup Rust
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/rustup-tmp
          CARGO_HOME: ${{ runner.temp }}/cargo
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
            https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Persist Rust toolchain paths
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo
          RUSTUP_HOME: ${{ runner.temp }}/rustup
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      # The self-hosted runner image does not provide the native GTK/WebKit
      # development stack required by the optional GUI crates. Keep the CI
      # gate focused on the production core/control-plane workspace; the GUI
      # crates are audited and validated separately after the first total-green
      # checkpoint.
      - name: Check core/control-plane workspace
        run: cargo check --workspace --all-targets --all-features --locked --exclude gitrun-dashboard --exclude gitrun-dashboard-tauri
      - name: Clippy core/control-plane workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --exclude gitrun-dashboard --exclude gitrun-dashboard-tauri -- -D warnings
      - name: Release build core/control-plane workspace
        run: cargo build --workspace --all-features --release --locked --exclude gitrun-dashboard --exclude gitrun-dashboard-tauri
      - name: Tests core/control-plane workspace
        run: cargo test --workspace --all-features --locked --exclude gitrun-dashboard --exclude gitrun-dashboard-tauri
      # A restore miss/failure must not block the build; save only after a successful Rust job
      # so an incomplete or broken build never becomes the reusable Cargo cache.
      - name: Save Cargo cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('Cargo.lock') }}

  shell:
    name: Shell validation
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          version="v0.11.0"
          archive="shellcheck-${version}.linux.x86_64.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${version}/${archive}"
          python3 - "$archive" "$RUNNER_TEMP/shellcheck" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive, destination = sys.argv[1:]
          destination = pathlib.Path(destination)
          destination.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:xz") as tf:
              member = next(m for m in tf.getmembers() if m.name.endswith("/shellcheck"))
              source = tf.extractfile(member)
              if source is None:
                  raise SystemExit("shellcheck binary missing from archive")
              destination.write_bytes(source.read())
          destination.chmod(0o755)
          PY
          export PATH="$RUNNER_TEMP:$PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          shellcheck --version
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.sh' -not -path './.git/*' -print)
          if [ -n "$files" ]; then
            shellcheck $files
          fi
      - name: CLI smoke checks
        env:
          GITRUN_CONFIG: ${{ runner.temp }}/gitrun-ci.env
        run: |
          test -f bin/gitrun
          : > "$GITRUN_CONFIG"
          bash bin/gitrun --help >/dev/null

  security:
    name: Security audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!docs/ROADMAP_PHASES.md' ':!SECURITY.md'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi

  powershell:
    name: PowerShell validation
    needs: detect
    if: needs.detect.outputs.powershell == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Ensure PowerShell runtime
        shell: bash
        env:
          HOME: ${{ runner.temp }}/powershell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/powershell-home/.cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/powershell-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/powershell-home/.local/share
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          if command -v pwsh >/dev/null 2>&1; then
            pwsh --version
            exit 0
          fi

          version="7.6.6"
          archive="$RUNNER_TEMP/powershell-${version}-linux-x64.tar.gz"
          install_dir="$RUNNER_TEMP/powershell"

          curl -fsSL -o "$archive" \
            "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-x64.tar.gz"
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc $archive" | sha256sum -c -
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          chmod 0755 "$install_dir/pwsh"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/pwsh" --version

      - name: Validate PowerShell syntax
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}/powershell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/powershell-home/.cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/powershell-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/powershell-home/.local/share
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                throw "PowerShell parse errors in $($_.FullName): $($errors -join '; ')"
              }
            }

  docker:
    name: Docker and Compose validation
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      # Managed runner containers expose the native Docker Engine socket.
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONFIG: /tmp/gitrun-docker-config
    steps:
      - uses: actions/checkout@v7
      - name: Prepare CI environment
        run: |
          cp config/config.example.env /tmp/gitrun.env
          sed -i 's|^GITHUB_TOKEN=.*|GITHUB_TOKEN=ci-placeholder|' /tmp/gitrun.env
          sed -i 's|^GITRUN_REPOSITORIES=.*|GITRUN_REPOSITORIES=Vider06/GitRun|' /tmp/gitrun.env
          mkdir -p /tmp/gitrun-state /tmp/gitrun-logs

      - name: Ensure Docker CLI and Compose
        shell: bash
        run: |
          set -euo pipefail
          docker_version="29.8.1"
          compose_version="5.5.1"
          docker_dir="$RUNNER_TEMP/gitrun-docker"
          mkdir -p "$docker_dir"
          curl -fsSL -o "$RUNNER_TEMP/docker.tgz" \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_version}.tgz"
          tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/docker/docker" "$docker_dir/docker"
          rm -rf "$RUNNER_TEMP/docker" "$RUNNER_TEMP/docker.tgz"
          curl -fsSL -o "$RUNNER_TEMP/gitrun-docker-compose" \
            "https://github.com/docker/compose/releases/download/v${compose_version}/docker-compose-linux-x86_64"
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 *$RUNNER_TEMP/gitrun-docker-compose" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/gitrun-docker-compose"
          echo "$docker_dir" >> "$GITHUB_PATH"
          compose_bin="$RUNNER_TEMP/gitrun-docker-compose"
          "$docker_dir/docker" --version
          "$compose_bin" version

      - name: Validate Compose
        env:
          GITRUN_CONFIG_FILE: /tmp/gitrun.env
          GITRUN_DOCKER_SOCKET: /var/run/docker.sock
          GITRUN_STATE_DIR: /tmp/gitrun-state
          GITRUN_LOG_DIR: /tmp/gitrun-logs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitrun-docker-compose" config -q
      - name: Build manager image
        shell: bash
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "Docker daemon socket unavailable on this runner; manager image build skipped."
            exit 0
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker API is present but inaccessible to this self-hosted runner; manager image build skipped."
            exit 0
          fi
          docker build --network=host -f docker/manager/Dockerfile -t gitrun-manager:ci .
      - name: Build runner image
        shell: bash
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "Docker daemon socket unavailable on this runner; runner image build skipped."
            exit 0
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker API is present but inaccessible to this self-hosted runner; runner image build skipped."
            exit 0
          fi
          docker build --network=host -f docker/runner/Dockerfile -t gitrun-runner:ci .

  repository:
    name: Repository hygiene
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked secrets and generated files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.pem|.*\.key)$' | grep -vE '(^|/)config/config\.example\.env$'; then
            echo "Potential secret/config file tracked by Git."
            exit 1
          fi
      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' >/dev/null 2>&1; then
            exit 0
          fi
          parser_dir="$RUNNER_TEMP/pyyaml"
          mkdir -p "$parser_dir"
          python3 -m pip install --quiet --no-cache-dir --target "$parser_dir" pyyaml
          echo "PYTHONPATH=$parser_dir${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
      - name: YAML parse
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              raise SystemExit("PyYAML unavailable")
          for path in pathlib.Path('.').rglob('*.y*ml'):
              if '.git' in path.parts:
                  continue
              yaml.safe_load(path.read_text())
          print("YAML validation passed")
          PY
      - name: Git diff sanity
        run: git diff --check

  summary:
    name: Verification summary
    if: always()
    needs: [detect, python, rust, shell, security, powershell, docker, repository]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Enforce required gates
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          POWERSHELL_RESULT: ${{ needs.powershell.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          set -euo pipefail
          for result in "$PYTHON_RESULT" "$RUST_RESULT" "$SHELL_RESULT" "$SECURITY_RESULT" "$POWERSHELL_RESULT" "$DOCKER_RESULT" "$REPOSITORY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Verification gate failed: $result"; exit 1 ;;
            esac
          done
          echo "All applicable GitRun verification gates passed."
