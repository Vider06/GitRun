name: GitRun CI

on:
  push:
    branches: [main, BigRework]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitrun-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  environment:
    name: Runner environment verification
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Verify runner identity and platform
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS / $RUNNER_ARCH"
          echo "Workspace: $GITHUB_WORKSPACE"
          uname -a
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64 || test "$RUNNER_ARCH" = ARM64

      - name: Verify filesystem and writable runner directories
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE" && test -w "$GITHUB_WORKSPACE"
          test -d "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          test -d "$RUNNER_TOOL_CACHE" && test -w "$RUNNER_TOOL_CACHE"
          probe="$RUNNER_TEMP/gitrun-ci-write-test"
          printf 'ok\n' > "$probe"
          test "$(cat "$probe")" = ok
          rm -f "$probe"

      - name: Verify required commands
        shell: bash
        run: |
          set -euo pipefail
          for command in bash git curl python3 tar gzip xz sha256sum; do
            command -v "$command" >/dev/null || { echo "Missing command: $command"; exit 1; }
          done
          git --version
          curl --version | head -n 1
          python3 --version

      - name: Verify network and DNS access
        shell: bash
        run: |
          set -euo pipefail
          getent hosts github.com >/dev/null
          getent hosts api.github.com >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://api.github.com/zen >/dev/null

      - name: Verify GitHub repository access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" >/dev/null

      - name: Verify Docker access
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then echo "::warning::Docker CLI is not installed on this runner."; exit 0; fi
          docker --version
          if [ ! -S /var/run/docker.sock ]; then echo "::warning::Docker socket unavailable on this runner."; exit 0; fi
          if ! docker info >/dev/null 2>&1; then echo "::warning::Docker daemon is unavailable to this runner user."; exit 0; fi
          echo "Docker access is available."

      - name: Verify GitHub Actions environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY" && test -n "$GITHUB_SHA"
          test -n "$GITHUB_WORKSPACE" && test -n "$RUNNER_NAME"
          test -n "$RUNNER_TEMP"
          echo "GitHub Actions environment is usable."
  detect:
    name: Detect project components
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      docker: ${{ steps.detect.outputs.docker }}
      powershell: ${{ steps.detect.outputs.powershell }}
      node: ${{ steps.detect.outputs.node }}
      tauri: ${{ steps.detect.outputs.tauri }}
      dependency: ${{ steps.detect.outputs.dependency }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          rust=false
          python=false
          docker=false
          powershell=false
          node=false
          tauri=false

          [ -f Cargo.toml ] && rust=true
          find . -name '*.py' -not -path './.git/*' -print -quit | grep -q . && python=true
          { [ -f docker-compose.yml ] || find docker -name 'Dockerfile*' -print -quit 2>/dev/null | grep -q .; } && docker=true
          find . -name '*.ps1' -not -path './.git/*' -print -quit | grep -q . && powershell=true
          find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' -print -quit | grep -q . && node=true
          if [ -f crates/gitrun-dashboard-tauri/src-tauri/Cargo.toml ] && [ -f crates/gitrun-dashboard-tauri/package.json ]; then
            tauri=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "powershell=$powershell" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "tauri=$tauri" >> "$GITHUB_OUTPUT"

          if [ "$rust" = true ] || [ "$node" = true ]; then
            echo "dependency=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependency=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python validation
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Python runtime
        run: python3 --version
      - name: Compile Python sources
        run: python3 -m compileall -q .
      - name: Run project static checks
        run: python3 scripts/test-gitrun.py

  rust:
    name: Rust check, lint, build and tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
