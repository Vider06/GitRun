name: GitRun CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gitrun-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect project components
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      docker: ${{ steps.detect.outputs.docker }}
      powershell: ${{ steps.detect.outputs.powershell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          [ -f Cargo.toml ] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          find . -name '*.py' -not -path './.git/*' -print -quit | grep -q . && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          { [ -f docker-compose.yml ] || find docker -name 'Dockerfile*' -print -quit | grep -q .; } && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"
          find . -name '*.ps1' -not -path './.git/*' -print -quit | grep -q . && echo "powershell=true" >> "$GITHUB_OUTPUT" || echo "powershell=false" >> "$GITHUB_OUTPUT"

  python:
    name: Python validation
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Compile Python sources
        run: |
          python -m compileall -q .
      - name: Run project static checks
        run: python3 scripts/test-gitrun.py

  rust:
    name: Rust check and tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features

  shell:
    name: Shell validation
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          version="v0.11.0"
          archive="shellcheck-${version}.linux.x86_64.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${version}/${archive}"
          python3 - "$archive" "$RUNNER_TEMP/shellcheck" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive, destination = sys.argv[1:]
          destination = pathlib.Path(destination)
          destination.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:xz") as tf:
              member = next(m for m in tf.getmembers() if m.name.endswith("/shellcheck"))
              source = tf.extractfile(member)
              if source is None:
                  raise SystemExit("shellcheck binary missing from archive")
              destination.write_bytes(source.read())
          destination.chmod(0o755)
          PY
          export PATH="$RUNNER_TEMP:$PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          shellcheck --version
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.sh' -not -path './.git/*' -print)
          if [ -n "$files" ]; then
            shellcheck $files
          fi
      - name: CLI smoke checks
        run: |
          test -f bin/gitrun
          GITRUN_CONFIG_FILE=/dev/null bash bin/gitrun --help >/dev/null

  security:
    name: Security audit
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!docs/ROADMAP_PHASES.md' ':!SECURITY.md'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi

  powershell:
    name: PowerShell validation
    needs: detect
    if: needs.detect.outputs.powershell == 'true'
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[/\\]\.git[/\\]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                throw "PowerShell parse errors in $($_.FullName): $($errors -join '; ')"
              }
            }

  docker:
    name: Docker and Compose validation
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 20
    env:
      # The permanent GitRun host runner exposes the native Docker Engine socket.
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
      - name: Prepare CI environment
        run: |
          cp config/config.example.env /tmp/gitrun.env
          sed -i 's|^GITHUB_TOKEN=.*|GITHUB_TOKEN=ci-placeholder|' /tmp/gitrun.env
          sed -i 's|^GITRUN_REPOSITORIES=.*|GITRUN_REPOSITORIES=Vider06/GitRun|' /tmp/gitrun.env
          mkdir -p /tmp/gitrun-state /tmp/gitrun-logs
      - name: Validate Compose
        env:
          GITRUN_CONFIG_FILE: /tmp/gitrun.env
          GITRUN_DOCKER_SOCKET: /var/run/docker.sock
          GITRUN_STATE_DIR: /tmp/gitrun-state
          GITRUN_LOG_DIR: /tmp/gitrun-logs
        run: docker compose config -q
      - name: Build manager image
        run: docker build --network=host -f docker/manager/Dockerfile -t gitrun-manager:ci .
      - name: Build runner image
        run: docker build --network=host -f docker/runner/Dockerfile -t gitrun-runner:ci .

  repository:
    name: Repository hygiene
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked secrets and generated files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.pem|.*\.key)$' | grep -vE '(^|/)config/config\.example\.env$'; then
            echo "Potential secret/config file tracked by Git."
            exit 1
          fi
      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' >/dev/null 2>&1; then
            exit 0
          fi
          python3 -m pip install --quiet --user --break-system-packages pyyaml
      - name: YAML parse
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              raise SystemExit("PyYAML unavailable")
          for path in pathlib.Path('.').rglob('*.y*ml'):
              if '.git' in path.parts:
                  continue
              yaml.safe_load(path.read_text())
          print("YAML validation passed")
          PY
      - name: Git diff sanity
        run: git diff --check

  summary:
    name: Verification summary
    if: always()
    needs: [detect, python, rust, shell, security, powershell, docker, repository]
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    steps:
      - name: Enforce required gates
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          POWERSHELL_RESULT: ${{ needs.powershell.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          set -euo pipefail
          for result in "$PYTHON_RESULT" "$RUST_RESULT" "$SHELL_RESULT" "$SECURITY_RESULT" "$POWERSHELL_RESULT" "$DOCKER_RESULT" "$REPOSITORY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Verification gate failed: $result"; exit 1 ;;
            esac
          done
          echo "All applicable GitRun verification gates passed."
