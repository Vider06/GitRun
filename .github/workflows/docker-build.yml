name: Premade Docker Definition

on:
  push:
    branches: [feat/premade-initial-assets]
    paths: [Dockers/**, Core/**, Testing/Dockers/**]
  pull_request:
    branches: [feat/gitrun-premade]
    paths: [Dockers/**, Core/**, Testing/Dockers/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate setup runner Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify source synchronization
        run: bash Testing/Dockers/test-runner-image.sh
