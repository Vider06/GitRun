name: Premade Docker Build

on:
  push:
    branches: [feat/gitrun-premade]
    paths: [Dockers/**, Core/**, Testing/Dockers/**]
  pull_request:
    branches: [feat/gitrun-premade]
    paths: [Dockers/**, Core/**, Testing/Dockers/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build every Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(find Dockers -type f -name Dockerfile -print)
          test "${#dockerfiles[@]}" -gt 0
          for dockerfile in "${dockerfiles[@]}"; do
            context="$(dirname "$dockerfile")"
            image="gitrun-premade/ci:$(echo "$context" | tr '/_' '--')"
            docker buildx build --load --platform linux/amd64 --tag "$image" "$context"
          done
