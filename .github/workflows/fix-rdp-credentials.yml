name: Fix RDP credentials

on:
  push:
    branches:
      - fix/setup-chown-uid
  workflow_dispatch:

# Manual trigger marker: secrets are configured and this push starts the repair workflow.
permissions:
  contents: read

jobs:
  configure:
    name: Configure GNOME RDP credentials
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 5
    env:
      SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      RDP_USERNAME: vider06
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        id: secrets
        shell: bash
        run: |
          set -u
          if [[ -n "${SUDO_PASSWORD}" && -n "${RDP_PASSWORD}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Required secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RDP configuration skipped: add repository secrets SUDO_PASSWORD and RDP_PASSWORD."
          fi

      - name: Configure system RDP credentials
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/rdp-credentials"
          trap 'rm -f "$credential_file"' EXIT

          printf '%s\n%s\n' "$RDP_USERNAME" "$RDP_PASSWORD" > "$credential_file"
          chmod 600 "$credential_file"

          sudo -S -p '' bash -c 'grdctl --system rdp set-credentials < "$1"' bash "$credential_file" <<< "$SUDO_PASSWORD"
          sudo -S -p '' systemctl restart gnome-remote-desktop.service <<< "$SUDO_PASSWORD"
          sudo -S -p '' systemctl is-active --quiet gnome-remote-desktop.service <<< "$SUDO_PASSWORD"

          echo "GNOME system RDP credentials configured and service restarted."

      - name: Verify system RDP
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -S -p '' grdctl --system status <<< "$SUDO_PASSWORD"
          echo
          echo "Recent RDP log:"
          sudo -S -p '' journalctl -u gnome-remote-desktop.service -b --no-pager -n 20 <<< "$SUDO_PASSWORD"
