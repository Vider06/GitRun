name: Inspect RDP stack

on:
  push:
    branches:
      - fix/setup-chown-uid

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 5
    env:
      SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
    steps:
      - name: Inspect versions and RDP configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Ubuntu ==="
          . /etc/os-release
          echo "$PRETTY_NAME"
          echo
          echo "=== GNOME Remote Desktop ==="
          gnome-remote-desktop --version 2>&1 || true
          grdctl --version 2>&1 || true
          echo
          echo "=== FreeRDP packages ==="
          dpkg-query -W -f='${Package} ${Version}\n' 'freerdp*' 'libfreerdp*' 2>/dev/null || true
          echo
          echo "=== RDP auth help ==="
          sudo -S -p '' grdctl --system rdp --help <<< "$SUDO_PASSWORD" 2>&1 || true
          echo
          echo "=== system status ==="
          sudo -S -p '' grdctl --system status <<< "$SUDO_PASSWORD" 2>&1 || true
