name: Multi-distro contract guard

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multidistro-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, miniserver-manager]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Test platform detection contracts
        run: cargo test --locked -p gitrun-platform
      - name: Audit repository-wide multi-distro boundaries
        run: python3 scripts/check-multidistro-contracts.py

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Test platform detection contracts
        run: cargo test --locked -p gitrun-platform
      - name: Audit repository-wide multi-distro boundaries
        run: python3 scripts/check-multidistro-contracts.py
