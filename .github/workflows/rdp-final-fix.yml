name: RDP credential final fix

on:
  push:
    branches:
      - fix/setup-chown-uid

permissions:
  contents: read

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 5
    env:
      SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      RDP_USERNAME: vider06
    steps:
      - name: Set and verify RDP credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUDO_PASSWORD}"
          test -n "${RDP_PASSWORD}"

          sudo -S -p '' grdctl --system rdp set-credentials "${RDP_USERNAME}" "${RDP_PASSWORD}" <<< "${SUDO_PASSWORD}"
          sudo -S -p '' systemctl restart gnome-remote-desktop.service <<< "${SUDO_PASSWORD}"

          status="$(sudo -S -p '' grdctl --system status <<< "${SUDO_PASSWORD}")"
          printf '%s\n' "$status"

          printf '%s\n' "$status" | grep -Fq 'Username: vider06'
          ! printf '%s\n' "$status" | grep -Fq 'Password: (empty)'

          echo "RDP credentials verified."
