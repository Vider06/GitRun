name: One-time recreate v0.4.8 via release workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  recreate:
    if: github.event.head_commit.message == 'chore: recreate v0.4.8 through release workflow'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Remove manually-created release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.4.8 --repo Vider06/GitRun --yes --cleanup-tag || true

      - name: Run official release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run .github/workflows/release.yml             --repo Vider06/GitRun             --ref main             --field version=v0.4.8

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          file_json="$(gh api /repos/Vider06/GitRun/contents/.github/workflows/recreate-release.yml?ref=main)"
          sha="$(printf '%s' "$file_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          gh api             --method DELETE             "/repos/Vider06/GitRun/contents/.github/workflows/recreate-release.yml"             -f message='chore: remove one-time release recreation workflow'             -f sha="$sha"             -f branch=main
