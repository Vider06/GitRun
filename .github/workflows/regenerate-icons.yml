name: Regenerate application icons

on:
  push:
    branches:
      - audit/docker-manager-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-icons:
    name: Generate icon variants
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate source artwork
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # The full-size artwork must live in the repository root.
          # Ignore GitRun's generated icon names so the workflow cannot
          # accidentally use one of its own outputs as the source.
          mapfile -t candidates < <(
            find . -maxdepth 1 -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
              ! -name 'gitrun-icon-32.png' \
              ! -name 'gitrun-icon-64.png' \
              ! -name 'gitrun-icon-128.png' \
              ! -name 'gitrun-icon-256.png' \
              ! -name 'gitrun-icon-512.png' \
              -print | sort
          )

          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one source image in the repository root; found ${#candidates[@]}."
            printf '%s\n' "${candidates[@]:-<none>}"
            exit 1
          fi

          echo "path=${candidates[0]}" >> "$GITHUB_OUTPUT"
          echo "Using source: ${candidates[0]}"

      - name: Generate PNG variants
        env:
          SOURCE: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if command -v magick >/dev/null 2>&1; then
            IM=(magick)
          elif command -v convert >/dev/null 2>&1; then
            IM=(convert)
          else
            echo "::error::ImageMagick (magick/convert) is required on the runner."
            exit 1
          fi

          sizes=(32 64 128 256 512)

          for size in "${sizes[@]}"; do
            echo "Generating ${size}x${size}..."
            "${IM[@]}" "$SOURCE" \
              -resize "${size}x${size}" \
              -strip \
              "assets/gitrun-icon-${size}.png"

            "${IM[@]}" "$SOURCE" \
              -resize "${size}x${size}" \
              -strip \
              "crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-${size}.png"
          done

      - name: Generate SVG variant
        env:
          SOURCE: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          encoded="$(base64 -w0 "$SOURCE")"

          cat > assets/gitrun-icon.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <image width="512" height="512" href="data:image/png;base64,$encoded"/>
          </svg>
          EOF

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail

          expected=(32 64 128 256 512)
          for size in "${expected[@]}"; do
            for file in \
              "assets/gitrun-icon-${size}.png" \
              "crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-${size}.png"; do
              test -s "$file"
              identify "$file"
            done
          done

          test -s assets/gitrun-icon.svg
          grep -q '<svg' assets/gitrun-icon.svg

      - name: Commit regenerated assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/gitrun-icon-32.png \
            assets/gitrun-icon-64.png \
            assets/gitrun-icon-128.png \
            assets/gitrun-icon-256.png \
            assets/gitrun-icon-512.png \
            assets/gitrun-icon.svg \
            crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-32.png \
            crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-64.png \
            crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-128.png \
            crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-256.png \
            crates/gitrun-dashboard-tauri/src-tauri/icons/gitrun-icon-512.png

          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
            exit 0
          fi

          git commit -m "assets: regenerate icon variants from source artwork"
          git push
