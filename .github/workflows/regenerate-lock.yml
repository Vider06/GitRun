name: Regenerate dependency lockfile

on:
  push:
    branches:
      - dependabot/cargo/sha2-0.11.0

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dependabot/cargo/sha2-0.11.0
          fetch-depth: 0

      - name: Regenerate dependency lockfile
        run: |
          cargo update -p sha2 --precise 0.11.0
          cargo update -p aes-gcm --precise 0.11.1

      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-lock.yml
          git add Cargo.lock
          git diff --cached --check
          git diff --cached -- Cargo.lock
          git commit -m "fix(deps): regenerate lockfile with Cargo"
          git push origin HEAD:dependabot/cargo/sha2-0.11.0
