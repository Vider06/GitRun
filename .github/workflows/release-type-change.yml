name: GitRun Release Type Change

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v1.9.1)"
        required: true
        type: string
      release_type:
        description: "New classification for the existing signed release"
        required: true
        type: choice
        options:
          - pre
          - full
          - security

permissions:
  contents: write

concurrency:
  group: gitrun-release-type-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  change-release-type:
    name: Reclassify signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install signing tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq openssl python3
      - name: Re-sign manifest and synchronize release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SIGNING_KEY_ID: ${{ vars.GITRUN_UPDATE_SIGNING_KEY_ID }}
          SIGNING_PRIVATE_KEY_B64: ${{ secrets.GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          EXPECTED_PUBLIC_KEY_HEX: "11cc9eaf0147dada407ffd3497c2cebce17d195e21c06030c1e2e1dc688f41f1"
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          case "$RELEASE_TYPE" in pre|full|security) ;; *) echo "Invalid release type" >&2; exit 1 ;; esac
          test "$SIGNING_KEY_ID" = "gitrun-release-ed25519-v1"
          test -n "$SIGNING_PRIVATE_KEY_B64"

          release_json="$RUNNER_TEMP/release.json"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          jq -e '.draft == false' "$release_json" >/dev/null
          old_prerelease="$(jq -r '.prerelease' "$release_json")"
          old_body_file="$RUNNER_TEMP/release-body.old"
          jq -r '.body // ""' "$release_json" > "$old_body_file"

          work="$RUNNER_TEMP/release-type-change"
          mkdir -m 700 "$work"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$work"
          old_manifest="$work/release-manifest.json"
          test -s "$old_manifest"
          normalized_tag="$TAG"
          test "$(jq -r '.version' "$old_manifest")" = "$normalized_tag"

          key="$RUNNER_TEMP/signing-key.der"
          public="$RUNNER_TEMP/signing-public.der"
          payload="$RUNNER_TEMP/manifest-payload.json"
          signature_file="$RUNNER_TEMP/manifest-signature.bin"
          unsigned="$work/manifest-unsigned.json"
          mkdir -m 700 "$work/updated"
          signed="$work/updated/release-manifest.json"
          trap 'rm -f "$key" "$public" "$payload" "$signature_file"' EXIT

          printf '%s' "$SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -inform DER -in "$key" -pubout -outform DER -out "$public"
          public_hex="$(tail -c 32 "$public" | od -An -v -tx1 | tr -d '[:space:]')"
          expected_public_hex="$EXPECTED_PUBLIC_KEY_HEX"
          if [ "$public_hex" != "$expected_public_hex" ]; then
            echo "Signing key does not match the configured updater trust anchor" >&2
            exit 1
          fi

          jq --arg release_type "$RELEASE_TYPE" '.release_type = $release_type | del(.signature, .signature_key_id)' "$old_manifest" > "$unsigned"
          jq -S -c '.' "$unsigned" | tr -d '\n' > "$payload"
          openssl pkeyutl -sign -rawin -inkey "$key" -keyform DER -in "$payload" -out "$signature_file"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public" -keyform DER -in "$payload" -sigfile "$signature_file"
          signature="$(od -An -v -tx1 "$signature_file" | tr -d '[:space:]')"
          test "${#signature}" -eq 128
          jq --arg signature "$signature" --arg key_id "$SIGNING_KEY_ID" \
            '. + {signature:$signature,signature_key_id:$key_id}' "$unsigned" > "$signed"

          # Verify the final signed JSON payload before touching the remote release.
          jq -S -c '. | del(.signature, .signature_key_id)' "$signed" | tr -d '\n' > "$payload"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public" -keyform DER -in "$payload" -sigfile "$signature_file"

          new_body_file="$work/release-body.new"
          python3 - "$old_body_file" "$new_body_file" "$RELEASE_TYPE" <<'PY'
          import re, sys
          from pathlib import Path
          old = Path(sys.argv[1]).read_text(encoding="utf-8")
          kind = sys.argv[3]
          body = re.sub(r"(?m)^<!-- GITRUN_RELEASE_TYPE:.*? -->\s*\n?", "", old).lstrip("\n")
          Path(sys.argv[2]).write_text(f"<!-- GITRUN_RELEASE_TYPE: {kind} -->\n\n" + body, encoding="utf-8")
          PY

          # Keep the previous asset available for rollback if the metadata update fails.
          committed=false
          rollback() {
            if [ "$committed" != true ]; then
              gh release upload "$TAG" "$old_manifest" --repo "$GITHUB_REPOSITORY" --clobber || true
            fi
          }
          trap rollback ERR
          gh release upload "$TAG" "$signed" --repo "$GITHUB_REPOSITORY" --clobber

          if [ "$RELEASE_TYPE" = pre ]; then
            new_prerelease=true
          else
            new_prerelease=false
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F prerelease="$new_prerelease" \
            -F body="$(cat "$new_body_file")" >/dev/null
          committed=true
          trap - ERR
          echo "Release $TAG is now classified as $RELEASE_TYPE."
