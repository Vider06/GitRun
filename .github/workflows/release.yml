name: GitRun Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.9.0)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gitrun-release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  RUST_VERSION: "1.99.0"
  CACHE_EPOCH: "release-v6"
jobs:
  prepare:
    name: Prepare immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve version and synchronize Markdown markers
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          number="${version#v}"
          test "$(tr -d '[:space:]' < version.txt)" = "$number"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse "$version^{commit}")" = "$GITHUB_SHA"
          fi
          python3 scripts/sync-markdown-version.py --version "$number"
          python3 scripts/sync-markdown-version.py --check --version "$number"
          python3 scripts/check-version-consistency.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_number=$number" >> "$GITHUB_OUTPUT"
      - name: Assemble shared release inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/common"
          library="$RUNNER_TEMP/library"
          rm -rf "$root" "$library"
          mkdir -p "$root" "$library"
          sources=(
            "Core/Dockers/runners/linux-x86_64/profiles.json"
            "crates/gitrun-cli/src/cat/cat_states.json"
            "crates/gitrun-cli/src/cat/gitrun.json"
            "crates/gitrun-dashboard-tauri/package.json"
            "crates/gitrun-dashboard-tauri/package-lock.json"
            "crates/gitrun-dashboard-tauri/src-tauri/capabilities/default.json"
            "crates/gitrun-dashboard-tauri/src-tauri/tauri.conf.json"
            "crates/gitrun-recovery/capabilities/default.json"
            "crates/gitrun-recovery/tauri.conf.json"
            "release/release-manifest.example.json"
            "release/release-manifest.schema.json"
          )
          entries=()
          for source in "${sources[@]}"; do
            test -f "$source"
            jq -e 'type == "object" or type == "array"' "$source" >/dev/null
            mkdir -p "$library/$(dirname "$source")"
            install -m 0644 "$source" "$library/$source.Back"
            entries+=("$source.Back")
          done
          (cd "$library" && zip -q -9 "$root/library.zip" "${entries[@]}")
          cargo metadata --locked --format-version 1 > "$root/cargo-metadata.json"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg created "$created" --arg commit "$GITHUB_SHA" \
            '{spdxVersion:"SPDX-2.3",dataLicense:"CC0-1.0",SPDXID:"SPDXRef-DOCUMENT",name:"GitRun",documentNamespace:("https://github.com/Vider06/GitRun/spdx/" + $commit),creationInfo:{created:$created,creators:["Tool: GitRun CI"]},packages:[.packages | to_entries[] | {SPDXID:("SPDXRef-Package-" + (.key|tostring)),name:.value.name,versionInfo:.value.version,downloadLocation:(.value.source // "NOASSERTION")}]}' \
            "$root/cargo-metadata.json" > "$root/sbom.spdx.json"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema:"gitrun.provenance.v2",git_commit:$commit,run_id:$run,server_targets:["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl"],package_formats:["deb","rpm","apk","archlinux","xbps","tar.zst"],desktop:"separate-tauri-dashboard"}' \
            > "$root/provenance.json"
      - name: Upload shared inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-common
          path: ${{ runner.temp }}/common/*
          if-no-files-found: error
          retention-days: 3

  build-server:
    name: Server target matrix
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      TARGET: ${{ matrix.target }}
      CARGO_HOME: ${{ github.workspace }}/.gitrun-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Verify cross-build runtime
        run: |
          set -euo pipefail
          docker info >/dev/null
          command -v zstd
      - name: Restore target-specific Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
          restore-keys: |
            gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ env.RUST_VERSION }}-
      - name: Install pinned cross compiler
        run: cargo install cross --locked --version 0.2.5
      - name: Build Server and compile updater tests for this target
        run: |
          set -euo pipefail
          cross build --locked --release -p gitrun-cli --bin gitrun --target "$TARGET"
          cross test --locked -p gitrun-updater --no-run --target "$TARGET"
          cross check --locked -p gitrun-management --target "$TARGET"
          binary="target/$TARGET/release/gitrun"
          test -x "$binary"
          test "$("$binary" --version --gitrun)" = "GitRun $VERSION_NUMBER"
      - name: Save target-specific Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      - name: Package canonical payload and native formats
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/assets"
          stage="$RUNNER_TEMP/stage"
          binary="target/$TARGET/release/gitrun"
          rm -rf "$out" "$stage"
          mkdir -p "$out" "$stage/usr/bin" "$stage/usr/share/gitrun" "$stage/usr/share/doc/gitrun"
          install -m 0755 "$binary" "$stage/usr/bin/gitrun"
          install -m 0644 version.txt "$stage/usr/share/gitrun/version.txt"
          install -m 0644 LICENSE README.md config/config.example.env "$stage/usr/share/doc/gitrun/"
          install -m 0644 systemd/gitrun.service systemd/gitrun-gsr.service systemd/gitrun-control.service "$stage/usr/share/gitrun/"
          tar --zstd -C "$stage" -cf "$out/GitRun-$VERSION-$TARGET-server.tar.zst" .
          update_root="$RUNNER_TEMP/update-root"
          rm -rf "$update_root"
          mkdir -p "$update_root"
          install -m 0755 "$binary" "$update_root/gitrun"
          install -m 0644 version.txt "$update_root/version.txt"
          install -m 0644 LICENSE README.md config/config.example.env "$update_root/"
          tar -C "$update_root" -czf "$out/GitRun-$VERSION-$TARGET-server.tar.gz" .

          case "$TARGET" in
            x86_64-unknown-linux-gnu) arch=amd64; formats="deb rpm archlinux"; xbps_arch=x86_64; xbps_dep=glibc ;;
            aarch64-unknown-linux-gnu) arch=arm64; formats="deb rpm"; xbps_arch=aarch64; xbps_dep=glibc ;;
            x86_64-unknown-linux-musl) arch=amd64; formats="apk"; xbps_arch=x86_64-musl; xbps_dep=musl ;;
            aarch64-unknown-linux-musl) arch=arm64; formats="apk"; xbps_arch=aarch64-musl; xbps_dep=musl ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rpm
          command -v go >/dev/null
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/nfpm.yaml" <<NFPM
          name: gitrun
          arch: $arch
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun headless server, scheduler, runner manager and recovery CLI
          license: Apache-2.0
          contents:
            - src: $stage/usr/bin/gitrun
              dst: /usr/bin/gitrun
            - src: $stage/usr/share/gitrun/version.txt
              dst: /usr/share/gitrun/version.txt
            - src: $stage/usr/share/doc/gitrun/LICENSE
              dst: /usr/share/doc/gitrun/LICENSE
            - src: $stage/usr/share/doc/gitrun/README.md
              dst: /usr/share/doc/gitrun/README.md
            - src: $stage/usr/share/doc/gitrun/config.example.env
              dst: /usr/share/doc/gitrun/config.example.env
            - src: $stage/usr/share/gitrun/gitrun.service
              dst: /usr/lib/systemd/system/gitrun.service
            - src: $stage/usr/share/gitrun/gitrun-gsr.service
              dst: /usr/lib/systemd/system/gitrun-gsr.service
            - src: $stage/usr/share/gitrun/gitrun-control.service
              dst: /usr/lib/systemd/system/gitrun-control.service
          deb:
            depends: [libc6, policykit-1]
            scripts:
              postinstall: packaging/gitrun-postinst
              preremove: packaging/gitrun-prerm
          rpm:
            depends: [glibc, polkit]
            scripts:
              postinstall: packaging/gitrun-postinst
              preremove: packaging/gitrun-prerm
          apk:
            depends: [musl]
          archlinux:
            depends: [glibc]
          NFPM
          for format in $formats; do
            nfpm package --config "$RUNNER_TEMP/nfpm.yaml" --packager "$format" --target "$out"
            case "$format" in
              deb) ext=deb; suffix=deb ;;
              rpm) ext=rpm; suffix=rpm ;;
              apk) ext=apk; suffix=apk ;;
              archlinux) ext=pkg.tar.zst; suffix=arch ;;
            esac
            produced="$(find "$out" -maxdepth 1 -type f -name "gitrun*.$ext" -print -quit)"
            test -n "$produced"
            case "$TARGET" in x86_64-*) cpu=x86_64 ;; aarch64-*) cpu=aarch64 ;; esac
            mv "$produced" "$out/GitRun-$VERSION-linux-$cpu-$suffix.$ext"
          done

          xbps_root="$RUNNER_TEMP/xbps"
          mkdir -p "$xbps_root"
          curl --fail --silent --show-error --location \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o "$RUNNER_TEMP/xbps-static.tar.xz"
          tar -xJf "$RUNNER_TEMP/xbps-static.tar.xz" -C "$xbps_root"
          xbps_create="$xbps_root/usr/bin/xbps-create"
          test -x "$xbps_create"
          (cd "$out" && "$xbps_create" -A "$xbps_arch" -n "gitrun-${VERSION_NUMBER}_1" \
            -D "$xbps_dep" -H https://github.com/Vider06/GitRun \
            -l Apache-2.0 -m Vider06 -s "GitRun headless server" "$stage")
          xbps_file="$(find "$out" -maxdepth 1 -type f -name 'gitrun-*.xbps' -print -quit)"
          test -n "$xbps_file"
          case "$TARGET" in
            x86_64-unknown-linux-gnu) cpu=x86_64 ;;
            aarch64-unknown-linux-gnu) cpu=aarch64 ;;
            x86_64-unknown-linux-musl) cpu=x86_64-musl ;;
            aarch64-unknown-linux-musl) cpu=aarch64-musl ;;
          esac
          mv "$xbps_file" "$out/GitRun-$VERSION-linux-$cpu-xbps.xbps"
          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -ge 3
      - name: Upload immutable target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 3

  build-dashboard:
    name: Independent Tauri Dashboard
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libwebkit2gtk-4.1-dev imagemagick
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/gitrun-dashboard-tauri/package-lock.json
      - name: Synchronize Dashboard package version
        working-directory: crates/gitrun-dashboard-tauri
        run: |
          set -euo pipefail
          node --input-type=module - "$VERSION_NUMBER" <<'NODE'
          import fs from "node:fs";
          const version = process.argv[2];
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const value = JSON.parse(fs.readFileSync(file, "utf8"));
            value.version = version;
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + "\n");
          }
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          lock.version = version;
          lock.packages[""].version = version;
          fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
          NODE
          npm ci
      - name: Normalize Tauri PNG icons
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          icons=(crates/gitrun-dashboard-tauri/src-tauri/icons/*.png)
          (("${#icons[@]}" > 0))
          for icon in "${icons[@]}"; do
            tmp="$(mktemp --suffix=.png)"
            convert "$icon" -alpha on -define png:color-type=6 "PNG32:$tmp"
            mv "$tmp" "$icon"
          done
      - name: Build standalone Dashboard AppImage
        working-directory: crates/gitrun-dashboard-tauri
        run: |
          set -euo pipefail
          npm exec tauri build -- --bundles appimage
          appimage="$(find ../../target/release/bundle -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          out="$RUNNER_TEMP/dashboard-assets"
          stage="$RUNNER_TEMP/dashboard-stage"
          rm -rf "$out" "$stage"
          mkdir -p "$out" "$stage/opt/gitrun-dashboard" "$stage/usr/share/applications"
          install -m 0755 "$appimage" "$stage/opt/gitrun-dashboard/GitRun.AppImage"
          cat > "$stage/usr/share/applications/gitrun-dashboard.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=GitRun Dashboard
          Comment=GitRun desktop management interface
          Exec=/opt/gitrun-dashboard/GitRun.AppImage
          Terminal=false
          Categories=Development;System;
          DESKTOP
          cp "$stage/opt/gitrun-dashboard/GitRun.AppImage" "$out/GitRun-Dashboard-$VERSION-linux-x86_64.AppImage"
          command -v go >/dev/null
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/dashboard-nfpm.yaml" <<NFPM
          name: gitrun-dashboard
          arch: amd64
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun Tauri Dashboard, independently installable from the server
          license: Apache-2.0
          depends: [libwebkit2gtk-4.1-0]
          contents:
            - src: $stage/opt/gitrun-dashboard/GitRun.AppImage
              dst: /opt/gitrun-dashboard/GitRun.AppImage
              file_info:
                mode: 0755
            - src: $stage/usr/share/applications/gitrun-dashboard.desktop
              dst: /usr/share/applications/gitrun-dashboard.desktop
          NFPM
          nfpm package --config "$RUNNER_TEMP/dashboard-nfpm.yaml" --packager deb --target "$out"
          deb="$(find "$out" -maxdepth 1 -type f -name 'gitrun-dashboard_*.deb' -print -quit)"
          test -n "$deb"
          mv "$deb" "$out/GitRun-Dashboard-$VERSION-linux-x86_64-deb.deb"
          test "$(dpkg-deb -f "$out/GitRun-Dashboard-$VERSION-linux-x86_64-deb.deb" Package)" = gitrun-dashboard
      - name: Upload independent Dashboard artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dashboard-linux-x86_64
          path: ${{ runner.temp }}/dashboard-assets/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Collect, validate, sign and publish
    needs: [prepare, build-server, build-dashboard]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download all immutable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - name: Install release verification tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq zstd unzip zip
      - name: Verify required artifacts and create checksums
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/release-assets"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -s "$root/GitRun-$VERSION-$target-server.tar.gz"
            test -s "$root/GitRun-$VERSION-$target-server.tar.zst"
          done
          for file in \
            "GitRun-$VERSION-linux-x86_64-deb.deb" \
            "GitRun-$VERSION-linux-aarch64-deb.deb" \
            "GitRun-$VERSION-linux-x86_64-rpm.rpm" \
            "GitRun-$VERSION-linux-aarch64-rpm.rpm" \
            "GitRun-$VERSION-linux-x86_64-apk.apk" \
            "GitRun-$VERSION-linux-aarch64-apk.apk" \
            "GitRun-$VERSION-linux-x86_64-arch.pkg.tar.zst" \
            "GitRun-$VERSION-linux-x86_64-xbps.xbps" \
            "GitRun-$VERSION-linux-aarch64-xbps.xbps" \
            "GitRun-$VERSION-linux-x86_64-musl-xbps.xbps" \
            "GitRun-$VERSION-linux-aarch64-musl-xbps.xbps" \
            "GitRun-Dashboard-$VERSION-linux-x86_64-deb.deb" \
            "GitRun-Dashboard-$VERSION-linux-x86_64.AppImage" \
            library.zip cargo-metadata.json sbom.spdx.json provenance.json; do
            test -s "$root/$file" || { echo "Missing required artifact: $file" >&2; exit 1; }
          done
          for deb in "$root"/GitRun-"$VERSION"-linux-*-deb.deb; do
            test "$(dpkg-deb -f "$deb" Package)" = gitrun
            test "$(dpkg-deb -f "$deb" Version)" = "$VERSION_NUMBER"
          done
          gui="$root/GitRun-Dashboard-$VERSION-linux-x86_64-deb.deb"
          test "$(dpkg-deb -f "$gui" Package)" = gitrun-dashboard
          ! dpkg-deb -c "$gui" | grep -Eq '/usr/bin/gitrun$'
          ! dpkg-deb -c "$root/GitRun-$VERSION-linux-x86_64-deb.deb" | grep -Eq '/GitRun\.AppImage$'
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="$root/GitRun-$VERSION-$target-server.tar.gz"
            dir="$RUNNER_TEMP/update-check-$target"
            rm -rf "$dir"; mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            test -x "$dir/gitrun"
            test "$(cat "$dir/version.txt")" = "$VERSION_NUMBER"
            archive="$root/GitRun-$VERSION-$target-server.tar.zst"
            dir="$RUNNER_TEMP/package-check-$target"
            rm -rf "$dir"; mkdir -p "$dir"
            tar --zstd -xf "$archive" -C "$dir"
            test -x "$dir/usr/bin/gitrun"
            test "$(cat "$dir/usr/share/gitrun/version.txt")" = "$VERSION_NUMBER"
          done
          (cd "$root" && sha256sum * > SHA256SUMS)
      - name: Install Rust toolchain for updater verification
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate complete release manifest
        env:
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          python3 - "$ROOT" "$VERSION" "$GITHUB_SHA" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root, version, commit = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          items = []
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name == "release-manifest.json":
                  continue
              name = path.name
              if name == "library.zip": target = "library-json-backup"
              elif name == "cargo-metadata.json": target = "cargo-metadata"
              elif name == "sbom.spdx.json": target = "sbom-spdx"
              elif name == "provenance.json": target = "provenance"
              elif name == "SHA256SUMS": target = "sha256sums"
              elif "-server.tar.gz" in name: target = name[len(f"GitRun-{version}-"):-len("-server.tar.gz")]
              elif "-server.tar.zst" in name:
                  cpu = "aarch64" if "aarch64" in name else "x86_64"
                  target = f"linux-{cpu}-tar-zst"
              elif name.endswith(".AppImage"): target = "linux-x86_64-dashboard-appimage"
              elif "Dashboard-" in name: target = "linux-x86_64-dashboard-deb"
              else: target = "linux-package-" + name[len(f"GitRun-{version}-"):].replace(".", "-")
              items.append({"target":target,"file":name,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
          required = {
              "x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-musl","aarch64-unknown-linux-musl",
              "linux-x86_64-dashboard-appimage","linux-x86_64-dashboard-deb",
              "library-json-backup","cargo-metadata","sbom-spdx","provenance","sha256sums"
          }
          missing = required - {item["target"] for item in items}
          if missing: raise SystemExit(f"Missing manifest targets: {sorted(missing)}")
          if len(items) != 26: raise SystemExit(f"Expected 26 release files, found {len(items)}")
          manifest = {"name":"GitRun","version":version,"git_commit":commit,"repository":"Vider06/GitRun","artifacts":items}
          (root/"release-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Sign manifest with Ed25519
        env:
          GITRUN_UPDATE_SIGNING_KEY_ID: ${{ vars.GITRUN_UPDATE_SIGNING_KEY_ID }}
          GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          test -n "$GITRUN_UPDATE_SIGNING_KEY_ID"
          test -n "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64"
          key="$RUNNER_TEMP/key.der"; public="$RUNNER_TEMP/public.der"; payload="$RUNNER_TEMP/payload.json"; sigfile="$RUNNER_TEMP/manifest.sig"
          trap 'rm -f "$key" "$public" "$payload" "$sigfile"' EXIT
          printf '%s' "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -inform DER -in "$key" -pubout -outform DER -out "$public"
          public_hex="$(tail -c 32 "$public" | od -An -v -tx1 | tr -d '[:space:]')"
          echo "GITRUN_UPDATE_PUBLIC_KEY_HEX=$public_hex" >> "$GITHUB_ENV"
          echo "GITRUN_UPDATE_PUBLIC_KEY_ID=$GITRUN_UPDATE_SIGNING_KEY_ID" >> "$GITHUB_ENV"
          jq -S -c '. | del(.signature, .signature_key_id)' "$ROOT/release-manifest.json" | tr -d '\n' > "$payload"
          openssl pkeyutl -sign -rawin -inkey "$key" -keyform DER -in "$payload" -out "$sigfile"
          signature="$(od -An -v -tx1 "$sigfile" | tr -d '[:space:]')"
          test "${#signature}" -eq 128
          jq --arg sig "$signature" --arg key_id "$GITRUN_UPDATE_SIGNING_KEY_ID" \
            '. + {signature:$sig,signature_key_id:$key_id}' "$ROOT/release-manifest.json" > "$ROOT/manifest.tmp"
          mv "$ROOT/manifest.tmp" "$ROOT/release-manifest.json"
      - name: Run updater tests against the aggregated manifest
        env:
          GITRUN_UPDATE_SIGNATURE_REQUIRED: "true"
          GITRUN_RELEASE_MANIFEST: ${{ github.workspace }}/release-assets/release-manifest.json
        run: |
          set -euo pipefail
          cargo test --locked -p gitrun-updater
          tampered="$RUNNER_TEMP/manifest-tampered.json"
          jq '.version = (.version + "-tampered")' "$GITRUN_RELEASE_MANIFEST" > "$tampered"
          if GITRUN_RELEASE_MANIFEST="$tampered" cargo test --locked -p gitrun-updater --test release_manifest_signature; then
            echo "Updater accepted a tampered manifest" >&2
            exit 1
          fi
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '.name == "GitRun" and .version == $version and .git_commit == $commit and (.artifacts | length == 26) and all(.artifacts[]; (.sha256 | test("^[0-9a-f]{64}$")) and (.file | test("^[^/\\\\]+$")))' \
            "$GITRUN_RELEASE_MANIFEST" >/dev/null
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-notes.md"; notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" --jq '.body' > "$generated" || : > "$generated"
          {
            echo "# GitRun $VERSION"; echo
            echo "Server builds: x86_64/aarch64 with GNU and musl."
            echo "Server package formats: DEB, RPM, APK, Arch Linux, XBPS and TAR.ZST."
            echo
            echo "The Tauri Dashboard is published as a separate AppImage and independently installable DEB package."
            echo
            echo "All files are listed in the signed Ed25519 manifest with SHA-256 hashes."
            echo; echo "## Changes"; echo
            if [ -s "$generated" ]; then cat "$generated"; else echo "See the commits and pull requests associated with this release."; fi
          } > "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
      - name: Publish all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          mapfile -t assets < <(find "$ROOT" -maxdepth 1 -type f -printf '%p\n' | sort)
          (("${#assets[@]}" == 26))
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "GitRun $VERSION" --notes-file "$NOTES_FILE"
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "GitRun $VERSION" --notes-file "$NOTES_FILE"
          fi
