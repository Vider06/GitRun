name: GitRun Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.9.0)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gitrun-release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  RUST_VERSION: "1.99.0"
  CACHE_EPOCH: "release-v6"
jobs:
  prepare:
    name: Prepare immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      migration_release: ${{ steps.version.outputs.migration_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install metadata tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq zip
      - name: Resolve version and synchronize Markdown markers
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          number="${version#v}"
          test "$(tr -d '[:space:]' < version.txt)" = "$number"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse "$version^{commit}")" = "$GITHUB_SHA"
          fi
          python3 scripts/sync-markdown-version.py --version "$number"
          python3 scripts/sync-markdown-version.py --check --version "$number"
          python3 scripts/check-version-consistency.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_number=$number" >> "$GITHUB_OUTPUT"
          if [ "$number" = "1.9.0" ]; then migration_release=true; else migration_release=false; fi
          echo "migration_release=$migration_release" >> "$GITHUB_OUTPUT"
      - name: Assemble shared release inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/common"
          library="$RUNNER_TEMP/library"
          rm -rf "$root" "$library"
          mkdir -p "$root" "$library"
          sources=(
            "Core/Dockers/runners/linux-x86_64/profiles.json"
            "crates/gitrun-cli/src/cat/cat_states.json"
            "crates/gitrun-cli/src/cat/gitrun.json"
            "crates/gitrun-dashboard-tauri/package.json"
            "crates/gitrun-dashboard-tauri/package-lock.json"
            "crates/gitrun-dashboard-tauri/src-tauri/capabilities/default.json"
            "crates/gitrun-dashboard-tauri/src-tauri/tauri.conf.json"
            "crates/gitrun-recovery/capabilities/default.json"
            "crates/gitrun-recovery/tauri.conf.json"
            "release/release-manifest.example.json"
            "release/release-manifest.schema.json"
          )
          entries=()
          for source in "${sources[@]}"; do
            test -f "$source"
            jq -e 'type == "object" or type == "array"' "$source" >/dev/null
            mkdir -p "$library/$(dirname "$source")"
            install -m 0644 "$source" "$library/$source.Back"
            entries+=("$source.Back")
          done
          (cd "$library" && zip -q -9 "$root/library.zip" "${entries[@]}")
          cargo metadata --locked --format-version 1 > "$root/cargo-metadata.json"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg created "$created" --arg commit "$GITHUB_SHA" \
            '{spdxVersion:"SPDX-2.3",dataLicense:"CC0-1.0",SPDXID:"SPDXRef-DOCUMENT",name:"GitRun",documentNamespace:("https://github.com/Vider06/GitRun/spdx/" + $commit),creationInfo:{created:$created,creators:["Tool: GitRun CI"]},packages:[.packages | to_entries[] | {SPDXID:("SPDXRef-Package-" + (.key|tostring)),name:.value.name,versionInfo:.value.version,downloadLocation:(.value.source // "NOASSERTION")}]}' \
            "$root/cargo-metadata.json" > "$root/sbom.spdx.json"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema:"gitrun.provenance.v2",git_commit:$commit,run_id:$run,server_targets:["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl"],updater_archive:"tar.gz",package_formats:["deb","rpm","apk","archlinux","xbps","tar.zst"],desktop:"separate-tauri-dashboard",desktop_target:"x86_64-unknown-linux-gnu"}' \
            > "$root/provenance.json"
      - name: Upload shared inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-common
          path: ${{ runner.temp }}/common/*
          if-no-files-found: error
          retention-days: 3

  build-server:
    name: Server target matrix
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      TARGET: ${{ matrix.target }}
      CARGO_HOME: ${{ github.workspace }}/.gitrun-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Synchronize Markdown source-version markers
        run: |
          set -euo pipefail
          python3 scripts/sync-markdown-version.py --version "$VERSION_NUMBER"
          python3 scripts/sync-markdown-version.py --check --version "$VERSION_NUMBER"
      - name: Verify cross-build runtime
        run: |
          set -euo pipefail
          docker info >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends file binutils
          command -v readelf
      - name: Restore target-specific Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
          restore-keys: |
            gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ env.RUST_VERSION }}-
      - name: Install pinned cross compiler
        run: |
          set -euo pipefail
          cargo install cross --locked --version 0.2.5
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Build Server and compile updater tests for this target
        run: |
          set -euo pipefail
          cross build --locked --release -p gitrun-cli --bin gitrun --target "$TARGET"
          cross test --locked -p gitrun-updater --no-run --target "$TARGET"
          cross check --locked -p gitrun-management --target "$TARGET"
          binary="target/$TARGET/release/gitrun"
          test -x "$binary"
          file "$binary"
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              test "$("$binary" --version --gitrun)" = "GitRun $VERSION_NUMBER"
              ;;
            aarch64-unknown-linux-gnu)
              readelf -h "$binary" | grep -Fq 'AArch64'
              readelf -l "$binary" | grep -Fq 'ld-linux-aarch64.so.1'
              ;;
            x86_64-unknown-linux-musl)
              readelf -h "$binary" | grep -Fq 'Advanced Micro Devices X86-64'
              file "$binary" | grep -Fq 'statically linked'
              ;;
            aarch64-unknown-linux-musl)
              readelf -h "$binary" | grep -Fq 'AArch64'
              file "$binary" | grep -Fq 'statically linked'
              ;;
          esac
      - name: Save target-specific Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-cargo
            target
          key: gitrun-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      - name: Create canonical updater archive and target binary
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/canonical"
          binary="target/$TARGET/release/gitrun"
          rm -rf "$out"
          mkdir -p "$out" "$RUNNER_TEMP/update-root"
          install -m 0755 "$binary" "$out/gitrun-$TARGET"
          install -m 0755 "$binary" "$RUNNER_TEMP/update-root/gitrun"
          install -m 0644 version.txt "$RUNNER_TEMP/update-root/version.txt"
          install -m 0644 LICENSE README.md config/config.example.env "$RUNNER_TEMP/update-root/"
          tar -C "$RUNNER_TEMP/update-root" -czf "$out/GitRun-Server-$VERSION-$TARGET-server.tar.gz" .
      - name: Upload immutable target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-${{ matrix.target }}
          path: ${{ runner.temp }}/canonical/*
          if-no-files-found: error
          retention-days: 3

  build-dashboard:
    name: Independent Tauri Dashboard
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      MIGRATION_RELEASE: ${{ needs.prepare.outputs.migration_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils libwebkit2gtk-4.1-dev imagemagick
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/gitrun-dashboard-tauri/package-lock.json
      - name: Synchronize Dashboard package version
        working-directory: crates/gitrun-dashboard-tauri
        run: |
          set -euo pipefail
          node --input-type=module - "$VERSION_NUMBER" <<'NODE'
          import fs from "node:fs";
          const version = process.argv[2];
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const value = JSON.parse(fs.readFileSync(file, "utf8"));
            value.version = version;
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + "\n");
          }
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          lock.version = version;
          lock.packages[""].version = version;
          fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
          NODE
          npm ci
      - name: Normalize Tauri PNG icons
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          icons=(crates/gitrun-dashboard-tauri/src-tauri/icons/*.png)
          (("${#icons[@]}" > 0))
          for icon in "${icons[@]}"; do
            tmp="$(mktemp --suffix=.png)"
            convert "$icon" -alpha on -define png:color-type=6 "PNG32:$tmp"
            mv "$tmp" "$icon"
          done
      - name: Build standalone Dashboard AppImage
        working-directory: crates/gitrun-dashboard-tauri
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/tauri-tmp" XDG_CACHE_HOME="$RUNNER_TEMP/tauri-cache"
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"
          npm run tauri build -- --ci --no-bundle
          npm run tauri bundle -- --bundles appimage --no-binary-patching
          appimage="$(find ../../target/release/bundle -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          out="$RUNNER_TEMP/dashboard-canonical"
          rm -rf "$out"
          mkdir -p "$out"
          install -m 0755 "$appimage" "$out/GitRun-Desktop-$VERSION-linux-x86_64.AppImage"
      - name: Upload independent Dashboard artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dashboard-linux-x86_64
          path: ${{ runner.temp }}/dashboard-canonical/*
          if-no-files-found: error
          retention-days: 3

  collect:
    name: Collect canonical target builds
    needs: [prepare, build-server, build-dashboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Download immutable build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: canonical-inputs
          merge-multiple: true
      - name: Gate complete canonical target set
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -x "canonical-inputs/gitrun-$target"
            test -s "canonical-inputs/GitRun-${{ needs.prepare.outputs.version }}-$target-server.tar.gz"
          done
          test -s "canonical-inputs/GitRun-Dashboard-${{ needs.prepare.outputs.version }}-linux-x86_64.AppImage"
          test -s canonical-inputs/library.zip
          test -s canonical-inputs/cargo-metadata.json
          test -s canonical-inputs/sbom.spdx.json
          test -s canonical-inputs/provenance.json
      - name: Upload collected canonical inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: canonical-release-inputs
          path: canonical-inputs/*
          if-no-files-found: error
          retention-days: 3

  package-server:
    name: Package Server target matrix
    needs: [prepare, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout packaging metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download canonical target outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-release-inputs
          path: canonical
      - name: Synchronize Markdown source-version markers
        run: |
          set -euo pipefail
          python3 scripts/sync-markdown-version.py --version "$VERSION_NUMBER"
          python3 scripts/sync-markdown-version.py --check --version "$VERSION_NUMBER"
      - name: Set up pinned Go toolchain for nFPM
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.4"
          check-latest: false
          cache: false
      - name: Create TAR.ZST, DEB, RPM, APK, Arch and XBPS packages
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/server-packages"
          stage="$RUNNER_TEMP/server-stage"
          binary="$GITHUB_WORKSPACE/canonical/gitrun-$TARGET"
          rm -rf "$out" "$stage"
          mkdir -p "$out" "$stage/usr/bin" "$stage/usr/share/gitrun" "$stage/usr/share/doc/gitrun"
          test -x "$binary"
          install -m 0755 "$binary" "$stage/usr/bin/gitrun"
          install -m 0644 version.txt "$stage/usr/share/gitrun/version.txt"
          install -m 0644 LICENSE README.md config/config.example.env "$stage/usr/share/doc/gitrun/"
          tar --zstd -C "$stage" -cf "$out/GitRun-Server-$VERSION-$TARGET-server.tar.zst" .
          package_stage="$RUNNER_TEMP/package-stage"
          rm -rf "$package_stage"
          cp -a "$stage" "$package_stage"
          unit_contents=""
          # Only systemd package formats carry systemd units. APK and XBPS remain
          # init-neutral until native OpenRC/runit service backends are implemented.
          if [[ "$TARGET" == *-gnu ]]; then
            mkdir -p "$package_stage/usr/lib/systemd/system"
            for unit in gitrun.service gitrun-gsr.service gitrun-control.service; do
              sed 's#/usr/local/bin/gitrun#/usr/bin/gitrun#g' "systemd/$unit" > "$package_stage/usr/lib/systemd/system/$unit"
            done
            grep -Fq 'ExecStart=/usr/bin/gitrun scheduler' "$package_stage/usr/lib/systemd/system/gitrun.service"
            grep -Fq 'ExecStart=/usr/bin/gitrun gsr-watchdog' "$package_stage/usr/lib/systemd/system/gitrun-gsr.service"
            grep -Fq 'ExecStart=/usr/bin/gitrun control-manager' "$package_stage/usr/lib/systemd/system/gitrun-control.service"
            unit_contents="$(cat <<YAML
            - src: $package_stage/usr/lib/systemd/system/gitrun.service
              dst: /usr/lib/systemd/system/gitrun.service
            - src: $package_stage/usr/lib/systemd/system/gitrun-gsr.service
              dst: /usr/lib/systemd/system/gitrun-gsr.service
            - src: $package_stage/usr/lib/systemd/system/gitrun-control.service
              dst: /usr/lib/systemd/system/gitrun-control.service
          YAML
          )"
          fi

          case "$TARGET" in
            x86_64-unknown-linux-gnu) arch=amd64; formats="deb rpm archlinux"; xbps_arch=x86_64; xbps_dep=glibc; base_dep=libc6; cpu=x86_64 ;;
            aarch64-unknown-linux-gnu) arch=arm64; formats="deb rpm"; xbps_arch=aarch64; xbps_dep=glibc; base_dep=libc6; cpu=aarch64 ;;
            x86_64-unknown-linux-musl) arch=amd64; formats="apk"; xbps_arch=x86_64-musl; xbps_dep=musl; base_dep=musl; cpu=x86_64-musl ;;
            aarch64-unknown-linux-musl) arch=arm64; formats="apk"; xbps_arch=aarch64-musl; xbps_dep=musl; base_dep=musl; cpu=aarch64-musl ;;
            *) echo "Unsupported package target: $TARGET" >&2; exit 1 ;;
          esac
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rpm zstd
          command -v go >/dev/null
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/nfpm.yaml" <<NFPM
          name: gitrun-server
          arch: $arch
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun headless server, scheduler, runner manager and recovery CLI
          license: Apache-2.0
          contents:
            - src: $package_stage/usr/bin/gitrun
              dst: /usr/bin/gitrun
            - src: $package_stage/usr/share/gitrun/version.txt
              dst: /usr/share/gitrun/version.txt
            - src: $package_stage/usr/share/doc/gitrun/LICENSE
              dst: /usr/share/doc/gitrun/LICENSE
            - src: $package_stage/usr/share/doc/gitrun/README.md
              dst: /usr/share/doc/gitrun/README.md
            - src: $package_stage/usr/share/doc/gitrun/config.example.env
              dst: /usr/share/doc/gitrun/config.example.env
          $unit_contents
          depends: [$base_dep]
          overrides:
            deb:
              depends: [libc6, policykit-1]
            rpm:
              depends: [glibc, polkit]
            apk:
              depends: [musl]
            archlinux:
              depends: [glibc]
          deb:
            scripts:
              postinstall: packaging/gitrun-postinst
              preremove: packaging/gitrun-prerm
          NFPM
          for format in $formats; do
            nfpm package --config "$RUNNER_TEMP/nfpm.yaml" --packager "$format" --target "$out"
            case "$format" in
              deb) ext=deb; suffix=deb ;;
              rpm) ext=rpm; suffix=rpm ;;
              apk) ext=apk; suffix=apk ;;
              archlinux) ext=pkg.tar.zst; suffix=arch ;;
            esac
            produced="$(find "$out" -maxdepth 1 -type f -name "gitrun*.$ext" -print -quit)"
            test -n "$produced"
            mv "$produced" "$out/GitRun-Server-$VERSION-linux-$cpu-$suffix.$ext"
          done

          xbps_root="$RUNNER_TEMP/xbps"
          mkdir -p "$xbps_root"
          curl --fail --silent --show-error --location \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            -o "$RUNNER_TEMP/xbps-static.tar.xz"
          tar -xJf "$RUNNER_TEMP/xbps-static.tar.xz" -C "$xbps_root"
          xbps_create="$xbps_root/usr/bin/xbps-create"
          xbps_rindex="$xbps_root/usr/bin/xbps-rindex"
          test -x "$xbps_create" && test -x "$xbps_rindex"
          export XBPS_ARCH="$xbps_arch"
          (cd "$out" && "$xbps_create" -A "$xbps_arch" -n "gitrun-server-${VERSION_NUMBER}_1" \
            -D "$xbps_dep" -H https://github.com/Vider06/GitRun \
            -l Apache-2.0 -m Vider06 -s "GitRun headless server" "$stage")
          xbps_file="$(find "$out" -maxdepth 1 -type f -name 'gitrun-*.xbps' -print -quit)"
          test -n "$xbps_file"
          test -s "$xbps_file"
          mv "$xbps_file" "$out/GitRun-Server-$VERSION-linux-$cpu-xbps.xbps"
          # Indexing the local repository parses the XBPS archive and validates its metadata.
          "$xbps_rindex" -a "$out"/*.xbps
          test "$(find "$out" -maxdepth 1 -type f -name '*.xbps' | wc -l)" -eq 1
          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -ge 3
      - name: Upload immutable target packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-packages-${{ matrix.target }}
          path: ${{ runner.temp }}/server-packages/*
          if-no-files-found: error
          retention-days: 3

  package-dashboard:
    name: Package independent Dashboard
    needs: [prepare, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
    steps:
      - name: Checkout packaging metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download canonical Dashboard build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-release-inputs
          path: canonical
      - name: Set up pinned Go toolchain for nFPM
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.4"
          check-latest: false
          cache: false
      - name: Create separate Dashboard DEB
        shell: bash
        run: |
          set -euo pipefail
          appimage="$GITHUB_WORKSPACE/canonical/GitRun-Desktop-$VERSION-linux-x86_64.AppImage"
          test -s "$appimage"
          stage="$RUNNER_TEMP/dashboard-stage"
          out="$RUNNER_TEMP/dashboard-package"
          rm -rf "$stage" "$out"
          mkdir -p "$stage/opt/gitrun-desktop" "$stage/usr/share/applications" "$out"
          install -m 0755 "$appimage" "$stage/opt/gitrun-desktop/GitRun.AppImage"
          cat > "$stage/usr/share/applications/gitrun-desktop.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=GitRun Dashboard
          Comment=GitRun desktop management interface
          Exec=/opt/gitrun-desktop/GitRun.AppImage
          Terminal=false
          Categories=Development;System;
          DESKTOP
          command -v go >/dev/null
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/dashboard-nfpm.yaml" <<NFPM
          name: gitrun-desktop
          arch: amd64
          platform: linux
          version: $VERSION_NUMBER
          maintainer: Vider06
          description: GitRun Tauri Dashboard, independently installable from the server
          license: Apache-2.0
          depends: [libwebkit2gtk-4.1-0]
          contents:
            - src: $stage/opt/gitrun-desktop/GitRun.AppImage
              dst: /opt/gitrun-desktop/GitRun.AppImage
              file_info:
                mode: 0755
            - src: $stage/usr/share/applications/gitrun-desktop.desktop
              dst: /usr/share/applications/gitrun-desktop.desktop
          NFPM
          nfpm package --config "$RUNNER_TEMP/dashboard-nfpm.yaml" --packager deb --target "$out"
          deb="$(find "$out" -maxdepth 1 -type f -name 'gitrun-desktop_*.deb' -print -quit)"
          test -n "$deb"
          mv "$deb" "$out/GitRun-Desktop-$VERSION-linux-x86_64-deb.deb"
          test "$(dpkg-deb -f "$out/GitRun-Desktop-$VERSION-linux-x86_64-deb.deb" Package)" = gitrun-desktop
      - name: Upload separate Dashboard package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dashboard-package
          path: ${{ runner.temp }}/dashboard-package/*
          if-no-files-found: error
          retention-days: 3

  migration-package:
    name: Build 1.8.23-compatible migration DEB
    needs: [prepare, collect]
    if: needs.prepare.outputs.migration_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
    steps:
      - name: Checkout legacy packaging inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download new Server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-release-inputs
          path: canonical
      - name: Assemble legacy-layout migration package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dpkg-dev imagemagick
          test "$VERSION" = v1.9.0
          binary="$GITHUB_WORKSPACE/canonical/gitrun-x86_64-unknown-linux-gnu"
          test -x "$binary"
          root="$RUNNER_TEMP/legacy-deb-root"
          out="$RUNNER_TEMP/migration-package"
          rm -rf "$root" "$out"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/libexec/gitrun" \
            "$root/usr/share/gitrun" "$root/usr/share/doc/gitrun" "$root/usr/share/applications" "$out"
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: gitrun
          Version: $VERSION_NUMBER
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Vider06
          Description: GitRun self-hosted GitHub Actions runner manager
           One-time migration package for existing GitRun 1.8.23 installations.
          CONTROL
          install -m 0755 "$binary" "$root/usr/bin/gitrun"
          install -m 0755 scripts/reinstall-latest.sh "$root/usr/libexec/gitrun/reinstall-latest.sh"
          install -m 0755 scripts/uninstall.sh "$root/usr/libexec/gitrun/uninstall.sh"
          install -m 0755 packaging/gitrun-prerm "$root/DEBIAN/prerm"
          install -m 0755 packaging/gitrun-postinst "$root/DEBIAN/postinst"
          sh -n "$root/DEBIAN/prerm"
          sh -n "$root/DEBIAN/postinst"
          install -m 0644 version.txt "$root/usr/share/gitrun/version.txt"
          install -m 0644 LICENSE "$root/usr/share/doc/gitrun/LICENSE"
          install -m 0644 README.md "$root/usr/share/doc/gitrun/README.md"
          install -m 0644 config/config.example.env "$root/usr/share/doc/gitrun/config.example.env"
          install -m 0644 packaging/gitrun.desktop "$root/usr/share/applications/gitrun.desktop"
          for size in 32 64 128 256 512; do
            source="assets/gitrun-icon-$size.png"
            destination="$root/usr/share/icons/hicolor/${size}x${size}/apps/gitrun.png"
            test -s "$source"
            mkdir -p "$(dirname "$destination")"
            convert "$source" -alpha on -define png:color-type=6 "PNG32:$destination"
          done
          artifact="GitRun-$VERSION-linux-x86_64-deb.deb"
          dpkg-deb --build --root-owner-group "$root" "$out/$artifact" >/dev/null
          test "$(dpkg-deb -f "$out/$artifact" Package)" = gitrun
          test "$(dpkg-deb -f "$out/$artifact" Version)" = "$VERSION_NUMBER"
          dpkg-deb -x "$out/$artifact" "$RUNNER_TEMP/legacy-package-inspect"
          test -x "$RUNNER_TEMP/legacy-package-inspect/usr/bin/gitrun"
          test -x "$RUNNER_TEMP/legacy-package-inspect/usr/libexec/gitrun/reinstall-latest.sh"
      - name: Upload legacy migration package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: migration-deb-linux-x86_64
          path: ${{ runner.temp }}/migration-package/*
          if-no-files-found: error
          retention-days: 3

  validate:
    name: Validate collected package matrix
    needs: [prepare, collect, package-server, package-dashboard, migration-package]
    if: always() && needs.prepare.result == 'success' && needs.collect.result == 'success' && needs.package-server.result == 'success' && needs.package-dashboard.result == 'success' && (needs.migration-package.result == 'success' || (needs.prepare.outputs.migration_release != 'true' && needs.migration-package.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      MIGRATION_RELEASE: ${{ needs.prepare.outputs.migration_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download collected canonical inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-release-inputs
          path: all-assets
      - name: Download all Server package targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: server-packages-*
          path: all-assets
          merge-multiple: true
      - name: Download independent Dashboard package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dashboard-package
          path: all-assets
          merge-multiple: true
      - name: Download one-off legacy migration package
        if: env.MIGRATION_RELEASE == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: migration-deb-linux-x86_64
          path: all-assets
      - name: Stage publishable release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp all-assets/GitRun-* release-assets/
          cp all-assets/library.zip all-assets/cargo-metadata.json all-assets/sbom.spdx.json all-assets/provenance.json release-assets/
          migration_extra=0; [ "$MIGRATION_RELEASE" = true ] && migration_extra=1
          expected=$((25 + migration_extra))
          actual="$(find release-assets -maxdepth 1 -type f | wc -l)"
          test "$actual" -eq "$expected"
      - name: Install release verification tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq zstd unzip zip rpm
      - name: Verify required artifacts and create checksums
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/release-assets"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -s "$root/GitRun-Server-$VERSION-$target-server.tar.gz"
            test -s "$root/GitRun-Server-$VERSION-$target-server.tar.zst"
          done
          for file in \
            "GitRun-Server-$VERSION-linux-x86_64-deb.deb" \
            "GitRun-Server-$VERSION-linux-aarch64-deb.deb" \
            "GitRun-Server-$VERSION-linux-x86_64-rpm.rpm" \
            "GitRun-Server-$VERSION-linux-aarch64-rpm.rpm" \
            "GitRun-Server-$VERSION-linux-x86_64-apk.apk" \
            "GitRun-Server-$VERSION-linux-aarch64-apk.apk" \
            "GitRun-Server-$VERSION-linux-x86_64-arch.pkg.tar.zst" \
            "GitRun-Server-$VERSION-linux-x86_64-xbps.xbps" \
            "GitRun-Server-$VERSION-linux-aarch64-xbps.xbps" \
            "GitRun-Server-$VERSION-linux-x86_64-musl-xbps.xbps" \
            "GitRun-Server-$VERSION-linux-aarch64-musl-xbps.xbps" \
            "GitRun-Desktop-$VERSION-linux-x86_64-deb.deb" \
            "GitRun-Desktop-$VERSION-linux-x86_64.AppImage" \
            library.zip cargo-metadata.json sbom.spdx.json provenance.json; do
            test -s "$root/$file" || { echo "Missing required artifact: $file" >&2; exit 1; }
          done
          for deb in "$root"/GitRun-Server-"$VERSION"-linux-*-deb.deb; do
            test "$(dpkg-deb -f "$deb" Package)" = gitrun-server
            test "$(dpkg-deb -f "$deb" Version)" = "$VERSION_NUMBER"
            dpkg-deb -c "$deb" | grep -Fq '/usr/lib/systemd/system/gitrun.service'
          done
          gui="$root/GitRun-Desktop-$VERSION-linux-x86_64-deb.deb"
          test "$(dpkg-deb -f "$gui" Package)" = gitrun-desktop
          dpkg-deb -c "$gui" | grep -Fq '/opt/gitrun-desktop/GitRun.AppImage'
          ! dpkg-deb -c "$gui" | grep -Eq '/usr/bin/gitrun$'
          ! dpkg-deb -c "$root/GitRun-Server-$VERSION-linux-x86_64-deb.deb" | grep -Eq '/GitRun\.AppImage$'
          if [ "$MIGRATION_RELEASE" = true ]; then
            legacy="$root/GitRun-$VERSION-linux-x86_64-deb.deb"
            test -s "$legacy"
            test "$(dpkg-deb -f "$legacy" Package)" = gitrun
            test "$(dpkg-deb -f "$legacy" Version)" = "$VERSION_NUMBER"
            dpkg-deb -c "$legacy" | grep -Fq '/usr/libexec/gitrun/reinstall-latest.sh'
            dpkg-deb -c "$legacy" | grep -Fq '/usr/bin/gitrun'
          else
            ! find "$root" -maxdepth 1 -type f -name 'GitRun-*-linux-x86_64-deb.deb' | grep -q .
          fi
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="$root/GitRun-Server-$VERSION-$target-server.tar.gz"
            dir="$RUNNER_TEMP/update-check-$target"
            rm -rf "$dir"; mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            test -x "$dir/gitrun"
            test "$(cat "$dir/version.txt")" = "$VERSION_NUMBER"
            archive="$root/GitRun-Server-$VERSION-$target-server.tar.zst"
            dir="$RUNNER_TEMP/package-check-$target"
            rm -rf "$dir"; mkdir -p "$dir"
            tar --zstd -xf "$archive" -C "$dir"
            test -x "$dir/usr/bin/gitrun"
            test "$(cat "$dir/usr/share/gitrun/version.txt")" = "$VERSION_NUMBER"
          done
          # Inspect the native package metadata and payloads without executing foreign-architecture binaries.
          for rpm_file in "$root"/GitRun-Server-"$VERSION"-linux-*-rpm.rpm; do
            rpm -qp --qf '%{NAME} %{VERSION}' "$rpm_file" | grep -Fx "gitrun-server $VERSION_NUMBER"
            rpm -qpl "$rpm_file" | grep -Fxq /usr/bin/gitrun
            rpm -qpl "$rpm_file" | grep -Fxq /usr/lib/systemd/system/gitrun.service
          done
          for apk_file in "$root"/GitRun-Server-"$VERSION"-linux-*-apk.apk; do
            tar -tzf "$apk_file" | grep -Fxq .PKGINFO
          done
          arch_file="$root/GitRun-Server-$VERSION-linux-x86_64-arch.pkg.tar.zst"
          tar --zstd -tf "$arch_file" | grep -Fxq .PKGINFO
          tar --zstd -tf "$arch_file" | grep -Fxq usr/bin/gitrun
          tar --zstd -tf "$arch_file" | grep -Fxq usr/lib/systemd/system/gitrun.service

          mapfile -t library_members < <(unzip -Z1 "$root/library.zip")
          (("${#library_members[@]}" == 11))
          for member in "${library_members[@]}"; do
            [[ "$member" == *.json.Back && "$member" != /* && "$member" != *".."* && "$member" != *\\* ]]
            unzip -p "$root/library.zip" "$member" | jq -e 'type == "object" or type == "array"' >/dev/null
          done

          (cd "$root" && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload validated release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validated-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign manifest and verify updater
    needs: [prepare, validate]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      MIGRATION_RELEASE: ${{ needs.prepare.outputs.migration_release }}
    steps:
      - name: Checkout updater source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download validated release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-assets
          path: release-assets
      - name: Install release manifest tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
      - name: Install Rust toolchain for updater verification
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate complete release manifest
        env:
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          python3 - "$ROOT" "$VERSION" "$GITHUB_SHA" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root, version, commit = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          items = []
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name == "release-manifest.json":
                  continue
              name = path.name
              if name == "library.zip": target = "library-json-backup"
              elif name == "cargo-metadata.json": target = "cargo-metadata"
              elif name == "sbom.spdx.json": target = "sbom-spdx"
              elif name == "provenance.json": target = "provenance"
              elif name == "SHA256SUMS": target = "sha256sums"
              elif "-server.tar.gz" in name: target = name[len(f"GitRun-Server-{version}-"):-len("-server.tar.gz")]
              elif "-server.tar.zst" in name:
                  triple = name[len(f"GitRun-Server-{version}-"):-len("-server.tar.zst")]
                  cpu, abi = triple.split("-unknown-linux-")
                  target = f"linux-{cpu}-{abi}-tar-zst"
              elif name.endswith(".AppImage"): target = "linux-x86_64-desktop-appimage"
              elif "Desktop-" in name: target = "linux-x86_64-desktop-deb"
              elif name == f"GitRun-{version}-linux-x86_64-deb.deb": target = "linux-x86_64-deb"
              elif name.startswith(f"GitRun-Server-{version}-linux-"):
                  package_target = name[len(f"GitRun-Server-{version}-"):]
                  if package_target.endswith(".pkg.tar.zst"):
                      package_target = package_target[:-len(".pkg.tar.zst")]
                  else:
                      package_target = package_target.rsplit(".", 1)[0]
                  if package_target.endswith("-deb"): target = package_target[:-4] + "-server-deb"
                  elif package_target.endswith("-rpm"): target = package_target[:-4] + "-server-rpm"
                  elif package_target.endswith("-apk"): target = package_target[:-4] + "-server-apk"
                  elif package_target.endswith("-arch"): target = package_target[:-5] + "-server-arch"
                  elif package_target.endswith("-xbps"): target = package_target[:-5] + "-server-xbps"
                  else: raise SystemExit(f"Unknown Server package suffix: {name}")
              items.append({"target":target,"file":name,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
          required = {
              "x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-musl","aarch64-unknown-linux-musl",
              "linux-x86_64-gnu-tar-zst","linux-aarch64-gnu-tar-zst",
              "linux-x86_64-musl-tar-zst","linux-aarch64-musl-tar-zst",
              "linux-x86_64-desktop-appimage","linux-x86_64-desktop-deb",
              "linux-x86_64-server-deb","linux-aarch64-server-deb",
              "linux-x86_64-server-rpm","linux-aarch64-server-rpm",
              "linux-x86_64-server-apk","linux-aarch64-server-apk",
              "linux-x86_64-server-arch","linux-x86_64-server-xbps",
              "linux-aarch64-server-xbps","linux-x86_64-musl-server-xbps",
              "linux-aarch64-musl-server-xbps",
              "library-json-backup","cargo-metadata","sbom-spdx","provenance","sha256sums"
          }
          if os.environ.get("MIGRATION_RELEASE") == "true": required.add("linux-x86_64-deb")
          if os.environ.get("MIGRATION_RELEASE") != "true" and any(item["target"] == "linux-x86_64-deb" for item in items): raise SystemExit("Unexpected legacy migration target")
          missing = required - {item["target"] for item in items}
          if missing: raise SystemExit(f"Missing manifest targets: {sorted(missing)}")
          if len({item["target"] for item in items}) != len(items): raise SystemExit("Duplicate manifest targets")
          expected = 26 + (1 if os.environ.get("MIGRATION_RELEASE") == "true" else 0)
          if len(items) != expected: raise SystemExit(f"Expected {expected} release files, found {len(items)}")
          manifest = {"name":"GitRun","version":version,"git_commit":commit,"repository":"Vider06/GitRun","artifacts":items}
          (root/"release-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Verify updater target-to-archive mapping
        env:
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          python3 - "$ROOT/release-manifest.json" "$VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          version = sys.argv[2]
          targets = [
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-musl",
              "aarch64-unknown-linux-musl",
          ]
          by_target = {item["target"]: item["file"] for item in manifest["artifacts"]}
          for target in targets:
              expected = f"GitRun-Server-{version}-{target}-server.tar.gz"
              if by_target.get(target) != expected:
                  raise SystemExit(f"Updater target {target} must select {expected}, got {by_target.get(target)!r}")
          if len(by_target) != len(manifest["artifacts"]):
              raise SystemExit("Manifest contains duplicate artifact targets")
          PY
      - name: Sign manifest with Ed25519
        env:
          GITRUN_UPDATE_SIGNING_KEY_ID: ${{ vars.GITRUN_UPDATE_SIGNING_KEY_ID }}
          GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          test -n "$GITRUN_UPDATE_SIGNING_KEY_ID"
          test -n "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64"
          key="$RUNNER_TEMP/key.der"; public="$RUNNER_TEMP/public.der"; payload="$RUNNER_TEMP/payload.json"; sigfile="$RUNNER_TEMP/manifest.sig"
          trap 'rm -f "$key" "$public" "$payload" "$sigfile"' EXIT
          printf '%s' "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -inform DER -in "$key" -pubout -outform DER -out "$public"
          public_hex="$(tail -c 32 "$public" | od -An -v -tx1 | tr -d '[:space:]')"
          echo "GITRUN_UPDATE_PUBLIC_KEY_HEX=$public_hex" >> "$GITHUB_ENV"
          echo "GITRUN_UPDATE_PUBLIC_KEY_ID=$GITRUN_UPDATE_SIGNING_KEY_ID" >> "$GITHUB_ENV"
          jq -S -c '. | del(.signature, .signature_key_id)' "$ROOT/release-manifest.json" | tr -d '\n' > "$payload"
          openssl pkeyutl -sign -rawin -inkey "$key" -keyform DER -in "$payload" -out "$sigfile"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public" -keyform DER -in "$payload" -sigfile "$sigfile"
          signature="$(od -An -v -tx1 "$sigfile" | tr -d '[:space:]')"
          test "${#signature}" -eq 128
          jq --arg sig "$signature" --arg key_id "$GITRUN_UPDATE_SIGNING_KEY_ID" \
            '. + {signature:$sig,signature_key_id:$key_id}' "$ROOT/release-manifest.json" > "$ROOT/manifest.tmp"
          mv "$ROOT/manifest.tmp" "$ROOT/release-manifest.json"
      - name: Run updater tests against the aggregated manifest
        env:
          GITRUN_UPDATE_SIGNATURE_REQUIRED: "true"
          GITRUN_RELEASE_MANIFEST: ${{ github.workspace }}/release-assets/release-manifest.json
        run: |
          set -euo pipefail
          cargo test --locked -p gitrun-updater
          tampered="$RUNNER_TEMP/manifest-tampered.json"
          jq '.version = (.version + "-tampered")' "$GITRUN_RELEASE_MANIFEST" > "$tampered"
          if GITRUN_RELEASE_MANIFEST="$tampered" cargo test --locked -p gitrun-updater --test release_manifest_signature; then
            echo "Updater accepted a tampered manifest" >&2
            exit 1
          fi
          migration_extra=0; [ "$MIGRATION_RELEASE" = true ] && migration_extra=1
          expected_count=$((26 + migration_extra))
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" --argjson count "$expected_count" \
            '.name == "GitRun" and .version == $version and .git_commit == $commit and (.artifacts | length == $count) and all(.artifacts[]; (.sha256 | test("^[0-9a-f]{64}$")) and (.file | test("^[^/\\\\]+$")))' \
            "$GITRUN_RELEASE_MANIFEST" >/dev/null
      - name: Upload signed release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish validated release
    needs: [prepare, sign]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
      MIGRATION_RELEASE: ${{ needs.prepare.outputs.migration_release }}
    steps:
      - name: Download signed release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release-assets
          path: release-assets
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-notes.md"; notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" --jq '.body' > "$generated" || : > "$generated"
          {
            echo "# GitRun $VERSION"; echo
            echo "Your self-hosted GitHub Actions runners, under your control."
            echo
            echo "## What's included"
            echo "- **GitRun-Server:** headless server and CLI for x86_64/aarch64 GNU and musl."
            echo "- **GitRun-Desktop:** independent desktop application, distributed as AppImage and DEB."
            echo "- Server formats: updater TAR.GZ, TAR.ZST, DEB, RPM, APK, Arch Linux and XBPS."
            echo
            echo "## Downloads"
            for file in release-assets/GitRun-Server-$VERSION-* release-assets/GitRun-Desktop-$VERSION-*; do
              [ -f "$file" ] || continue
              name="${file##*/}"
              echo "- [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$name)"
            done
            echo
            echo "## Integrity and build metadata"
            for name in release-manifest.json SHA256SUMS library.zip cargo-metadata.json sbom.spdx.json provenance.json; do
              [ -s "release-assets/$name" ] && echo "- [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$name)"
            done
            if [ "$MIGRATION_RELEASE" = true ]; then
              echo
              echo "## Migration Release"
              echo
              echo "**DO NOT USE FOR FRESH INSTALL!**"
              echo
              echo "One-time migration from GitRun 1.8.23 to 1.9.0. Use the existing installation's legacy gitrun reinstall flow; do not install this package on a fresh system."
              echo
              echo "### Legacy downloads"
              echo "- [GitRun-$VERSION-linux-x86_64-deb.deb](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/GitRun-$VERSION-linux-x86_64-deb.deb)"
            else
              echo
              echo "No migration needed, updater/release system has not been changed in a way that requires a migration package."
            fi
          } > "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
      - name: Publish all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ROOT: ${{ github.workspace }}/release-assets
        run: |
          set -euo pipefail
          mapfile -t assets < <(find "$ROOT" -maxdepth 1 -type f -printf '%p\n' | sort)
          migration_extra=0; [ "$MIGRATION_RELEASE" = true ] && migration_extra=1
          expected=$((27 + migration_extra))
          (("${#assets[@]}" == expected))
          if [ "$MIGRATION_RELEASE" = true ]; then title="GitRun $VERSION — Migration Release"; else title="GitRun $VERSION"; fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$title" --notes-file "$NOTES_FILE"
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$NOTES_FILE"
          fi
      - name: Verify migration with the actual 1.8.23 updater
        if: env.MIGRATION_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITRUN_UPDATE_SIGNING_KEY_ID: ${{ vars.GITRUN_UPDATE_SIGNING_KEY_ID }}
          GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = v1.9.0
          old="$RUNNER_TEMP/gitrun-v1.8.23"
          git clone --quiet --depth 1 --branch v1.8.23 "https://github.com/$GITHUB_REPOSITORY.git" "$old"
          (cd "$old" && cargo build --locked --release -p gitrun-cli --bin gitrun && test -x target/release/gitrun)
          key="$RUNNER_TEMP/migration-key.der"; public="$RUNNER_TEMP/migration-public.der"
          trap 'rm -f "$key" "$public"' EXIT
          printf '%s' "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key"
          openssl pkey -inform DER -in "$key" -pubout -outform DER -out "$public"
          export GITRUN_UPDATE_PUBLIC_KEY_HEX="$(tail -c 32 "$public" | od -An -v -tx1 | tr -d '[:space:]')"
          export GITRUN_UPDATE_PUBLIC_KEY_ID="$GITRUN_UPDATE_SIGNING_KEY_ID"
          export GITRUN_UPDATE_SIGNATURE_REQUIRED=true
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP/legacy-manifest"
          manifest="$RUNNER_TEMP/legacy-manifest/release-manifest.json"
          test -s "$manifest"
          test_dir="$old/crates/gitrun-updater/tests"; mkdir -p "$test_dir"
          cat > "$test_dir/migration_release_compat.rs" <<'RUST'
          use gitrun_updater::{build_plan, download_and_verify, load_manifest};
          use std::path::PathBuf;
          #[test]
          fn v1823_reinstall_contract_downloads_and_verifies_migration_deb() {
              let manifest = load_manifest(std::env::var("GITRUN_RELEASE_MANIFEST").unwrap())
                  .expect("legacy updater must verify the signed manifest");
              let artifact = manifest.artifact_for("linux-x86_64-deb")
                  .expect("legacy reinstall target must exist");
              assert_eq!(artifact.file, "GitRun-v1.9.0-linux-x86_64-deb.deb");
              let plan = build_plan(&manifest, "1.8.23", "linux-x86_64-deb", &[])
                  .expect("legacy updater must construct the release URL");
              assert_eq!(plan.artifact, artifact.file);
              assert_eq!(plan.artifact_url, format!(
                  "https://github.com/Vider06/GitRun/releases/download/{}/{}",
                  manifest.version, artifact.file));
              download_and_verify(&plan.artifact_url, &artifact.sha256,
                  PathBuf::from(std::env::var("GITRUN_MIGRATION_DOWNLOAD").unwrap()))
                  .expect("legacy updater must download and verify SHA-256");
          }
          RUST
          (
            cd "$old"
            GITRUN_RELEASE_MANIFEST="$manifest" \
            GITRUN_MIGRATION_DOWNLOAD="$RUNNER_TEMP/GitRun-v1.9.0-linux-x86_64-deb.downloaded.deb" \
            cargo test --locked -p gitrun-updater --test migration_release_compat -- --nocapture
          )
          downloaded="$RUNNER_TEMP/GitRun-v1.9.0-linux-x86_64-deb.downloaded.deb"
          test -s "$downloaded"
          test "$(dpkg-deb -f "$downloaded" Package)" = gitrun
          test "$(dpkg-deb -f "$downloaded" Version)" = 1.9.0
          dpkg-deb -x "$downloaded" "$RUNNER_TEMP/legacy-updater-package"
          test -x "$RUNNER_TEMP/legacy-updater-package/usr/bin/gitrun"
          test -x "$RUNNER_TEMP/legacy-updater-package/usr/libexec/gitrun/reinstall-latest.sh"
          test "$(cat "$RUNNER_TEMP/legacy-updater-package/usr/share/gitrun/version.txt")" = 1.9.0
