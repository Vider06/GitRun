name: GitRun Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.4.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: gitrun-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitRun
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 60
    env:
      RELEASE_TARGET: x86_64-unknown-linux-gnu
      DOCKER_CONFIG: /tmp/gitrun-docker-config
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          [[ "$version" =~ ^v[0-9]+.[0-9]+.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build GitRun
        run: cargo build --release -p gitrun-cli --bin gitrun

      - name: Build Ubuntu package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/build-deb.sh "$VERSION" target/release/gitrun "${RUNNER_TEMP}/gitrun.deb"

      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/gitrun
          test -f "${RUNNER_TEMP}/gitrun.deb"
          dpkg-deb --info "${RUNNER_TEMP}/gitrun.deb"
          dpkg-deb --contents "${RUNNER_TEMP}/gitrun.deb" | grep -F "/usr/local/bin/gitrun"
          dpkg-deb --contents "${RUNNER_TEMP}/gitrun.deb" | grep -F "/usr/share/gitrun/version.txt"
          ls -lh "${RUNNER_TEMP}/gitrun.deb"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP}/gitrun.deb"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$package" --clobber
          else
            gh release create "$VERSION" "$package" \
              --title "GitRun $VERSION" \
              --generate-notes
          fi
