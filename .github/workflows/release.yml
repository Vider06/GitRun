name: GitRun Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.4.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gitrun-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: Build and publish GitRun
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      RELEASE_TARGET: x86_64-unknown-linux-gnu
      DOCKER_CONFIG: /tmp/gitrun-docker-config
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          [[ "$version" =~ ^v[0-9]+.[0-9]+.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup
          CARGO_HOME: ${{ runner.temp }}/cargo
          TMPDIR: ${{ runner.temp }}/rust-tmp
        run: |
          set -euo pipefail
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME" "$TMPDIR"
          export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
          export TMPDIR

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto "=https" --tlsv1.2 --retry 10 --retry-connrefused               -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init"
            chmod 0755 "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain stable --no-modify-path
          fi

          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          cargo_bin="$(rustup which cargo)"
          test -x "$cargo_bin"
          rustc --version
          "$cargo_bin" --version
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "CARGO_BIN=$cargo_bin" >> "$GITHUB_ENV"

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Build GitRun
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CARGO_BIN"
          mkdir -p "$GITHUB_WORKSPACE/.gitrun-bin"
          ln -sf "$CARGO_BIN" "$GITHUB_WORKSPACE/.gitrun-bin/cargo"
          export PATH="$GITHUB_WORKSPACE/.gitrun-bin:$PATH"
          cargo --version
          cargo build --locked --release -p gitrun-cli --bin gitrun

      - name: Free build space before packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            target/debug \
            target/release/deps \
            target/release/build \
            target/release/.fingerprint \
            "$CARGO_HOME/registry/src" \
            "$CARGO_HOME/git/checkouts" \
            "$CARGO_HOME/git/db"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build Ubuntu package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/build-deb.sh "$VERSION" target/release/gitrun "${RUNNER_TEMP}/gitrun.deb"

      - name: Build portable archive and manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ env.RELEASE_TARGET }}
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/gitrun-release-payload"
          archive="${RUNNER_TEMP}/GitRun-${VERSION}-${TARGET}.tar.gz"
          manifest="${RUNNER_TEMP}/release-manifest.json"
          rm -rf "$payload"
          mkdir -p "$payload"
          install -m 0755 target/release/gitrun "$payload/gitrun"
          cp LICENSE README.md config/config.example.env "$payload/"
          tar -C "$payload" -czf "$archive" .
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          cat > "$manifest" <<JSON
          {
            "name": "GitRun",
            "version": "${VERSION}",
            "git_commit": "${GITHUB_SHA}",
            "repository": "Vider06/GitRun",
            "artifacts": [
              {
                "target": "${TARGET}",
                "file": "GitRun-${VERSION}-${TARGET}.tar.gz",
                "sha256": "${sha256}"
              }
            ]
          }
          JSON

      - name: Verify release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ env.RELEASE_TARGET }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/GitRun-${VERSION}-${TARGET}.tar.gz"
          manifest="${RUNNER_TEMP}/release-manifest.json"
          test -x target/release/gitrun
          test -f "${RUNNER_TEMP}/gitrun.deb"
          test -f "$archive"
          test -f "$manifest"
          dpkg-deb --info "${RUNNER_TEMP}/gitrun.deb"
          dpkg-deb --contents "${RUNNER_TEMP}/gitrun.deb" | grep -F "/usr/local/bin/gitrun"
          sha256sum "$archive"
          printf '%s\n' "$manifest" | python3 -c '
          import json, sys
          manifest = json.load(sys.stdin)
          assert manifest["name"] == "GitRun"
          assert manifest["artifacts"]
          assert manifest["artifacts"][0]["target"] == "x86_64-unknown-linux-gnu"
          assert len(manifest["artifacts"][0]["sha256"]) == 64
          print("Release manifest: PASS")
          '

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ env.RELEASE_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP}/gitrun.deb"
          archive="${RUNNER_TEMP}/GitRun-${VERSION}-${TARGET}.tar.gz"
          manifest="${RUNNER_TEMP}/release-manifest.json"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$package" "$archive" "$manifest" --clobber
          else
            gh api --method DELETE "/repos/Vider06/GitRun/git/refs/tags/$VERSION" || true
            gh release create "$VERSION" "$package" "$archive" "$manifest" \
              --target "$GITHUB_SHA" \
              --title "GitRun $VERSION" \
              --notes "Fixed a lil bit of small but very important stuff, cleaned Commits history, Preparing branch for BigRework release."
          fi
