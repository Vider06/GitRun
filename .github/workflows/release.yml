name: GitRun Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.5.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gitrun-release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.0"
  RELEASE_TARGET: "x86_64-unknown-linux-gnu"

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    name: Build and publish GitRun
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.gitrun-ci/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.gitrun-ci/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          expected_version="${version#v}"
          repository_version="$(tr -d '[:space:]' < version.txt)"
          test "$repository_version" = "$expected_version"
          if git rev-parse -q --verify "refs/tags/$version^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$version^{commit}")" = "$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "Tag $version is missing from the checkout." >&2
            exit 1
          fi
          echo "GITRUN_VERSION=$expected_version" >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "version_number=$expected_version"
          } >> "$GITHUB_OUTPUT"

      - name: Synchronize Markdown source-version markers
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/sync-markdown-version.py --version "$VERSION"
          python3 scripts/sync-markdown-version.py --check --version "$VERSION"

          # Keep the release checkout synchronized for packaging, but never push
          # directly to main. When main still targets this product version, open
          # or update a docs-only PR from a temporary worktree based on origin/main.
          if ! git diff --quiet -- '*.md'; then
            git fetch origin main
            main_sha="$(git rev-parse FETCH_HEAD)"
            main_version="$(git show "$main_sha:version.txt" | tr -d '[:space:]')"
            if [ "$main_version" = "$VERSION" ]; then
              sync_branch="automation/sync-markdown-version-v${VERSION//./-}"
              sync_dir="${RUNNER_TEMP}/gitrun-markdown-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              trap 'git worktree remove --force "$sync_dir" >/dev/null 2>&1 || true' EXIT
              git worktree add --detach "$sync_dir" "$main_sha"
              python3 "$sync_dir/scripts/sync-markdown-version.py" --version "$VERSION"
              python3 "$sync_dir/scripts/sync-markdown-version.py" --check --version "$VERSION"
              mapfile -t changed_markdown < <(git -C "$sync_dir" diff --name-only -- '*.md')

              if ((${#changed_markdown[@]} > 0)); then
                git -C "$sync_dir" config user.name "github-actions[bot]"
                git -C "$sync_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git -C "$sync_dir" add -- "${changed_markdown[@]}"
                git -C "$sync_dir" commit -m "docs: sync Markdown source version to $VERSION"

                # This branch name is reserved for the version-sync automation.
                # If a previous run left its PR open, refresh that branch with a
                # fresh docs-only commit based on current main using a lease.
                remote_sha="$(git ls-remote origin "refs/heads/$sync_branch" | awk 'NR == 1 {print $1}')"
                if [ -n "$remote_sha" ]; then
                  if ! git -C "$sync_dir" push --force-with-lease="refs/heads/$sync_branch:$remote_sha" origin "HEAD:refs/heads/$sync_branch"; then
                    echo "::warning::Markdown markers are synchronized for the release workspace, but the docs PR branch could not be updated."
                    exit 0
                  fi
                else
                  if ! git -C "$sync_dir" push origin "HEAD:refs/heads/$sync_branch"; then
                    echo "::warning::Markdown markers are synchronized for the release workspace, but the docs PR branch could not be pushed."
                    exit 0
                  fi
                fi

                existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$sync_branch" --state open --json url --jq '.[0].url // ""' 2>/dev/null || true)"
                if [ -n "$existing_pr" ]; then
                  echo "Updated existing Markdown synchronization PR: $existing_pr"
                elif ! gh pr create \
                  --repo "$GITHUB_REPOSITORY" \
                  --base main \
                  --head "$sync_branch" \
                  --title "docs: sync Markdown source version to $VERSION" \
                  --body "Automated, docs-only synchronization of current-source Markdown markers to version ${VERSION}. Created by the release workflow after verifying that main/version.txt still matches the selected release. No source or crate versions are changed."; then
                  echo "::warning::Markdown markers are synchronized for release artifacts, but GitHub could not open the docs-only PR. Check the Actions token's pull-request permissions and repository policy allowing workflows to create pull requests."
                fi
              else
                echo "main already has synchronized Markdown markers; no documentation PR is needed."
              fi
            else
              echo "::warning::Markdown markers were refreshed for release artifacts, but main/version.txt targets $main_version rather than $VERSION; no source documentation PR was created."
            fi
          fi

      - name: Prepare release caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gitrun-ci/cargo .gitrun-ci/rustup target
          {
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.gitrun-ci/cargo"
            echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.gitrun-ci/rustup"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
          } >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.gitrun-ci/cargo/bin" >> "$GITHUB_PATH"
      - name: Restore Rust common cache
        id: rust-common-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: gitrun-${{ runner.os }}-${{ runner.arch }}-release-rust-v3-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            gitrun-${{ runner.os }}-${{ runner.arch }}-release-rust-v3-${{ env.RUST_VERSION }}-

      - name: Restore release target cache
        id: release-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: gitrun-${{ runner.os }}-${{ runner.arch }}-release-target-v3-${{ env.RUST_VERSION }}-${{ steps.version.outputs.version_number }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            gitrun-${{ runner.os }}-${{ runner.arch }}-release-target-v3-${{ env.RUST_VERSION }}-

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Avoid the intermittently stalled Azure Ubuntu archive on hosted runners.
          # Keep security.ubuntu.com and all Ubuntu suites/components unchanged.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo -n sed -i -E 's#https?://azure[.]archive[.]ubuntu[.]com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt
            echo "APT mirror list after override:"
            sudo -n cat /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo -n sed -i -E 's#https?://azure[.]archive[.]ubuntu[.]com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$source"
          done
          sudo -n apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            imagemagick \
            zip \
            unzip

      - name: Normalize Tauri PNG icons to RGBA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          icons=(crates/gitrun-dashboard-tauri/src-tauri/icons/*.png)
          [ "${#icons[@]}" -gt 0 ] || { echo "No Tauri PNG icons found" >&2; exit 1; }
          for icon in "${icons[@]}"; do
            tmp="$(mktemp --suffix=.png)"
            convert "$icon" -alpha on -define png:color-type=6 "PNG32:$tmp"
            mv "$tmp" "$icon"
          done
          echo "${#icons[@]} Tauri PNG icons normalized to RGBA with ImageMagick"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Set Tauri release version
        working-directory: crates/gitrun-dashboard-tauri
        env:
          VERSION: ${{ steps.version.outputs.version_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          config_path = Path("src-tauri/tauri.conf.json")
          package_path = Path("package.json")
          lock_path = Path("package-lock.json")

          for path in (config_path, package_path, lock_path):
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = version
              if path == lock_path:
                  packages = data.get("packages")
                  if not isinstance(packages, dict) or "" not in packages:
                      raise SystemExit("package-lock.json is missing root package metadata")
                  packages[""]["version"] = version
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build unified GitRun executable
        env:
          VERSION: ${{ steps.version.outputs.version_number }}
          GITRUN_NO_CAT: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p gitrun-cli --bin gitrun
          test -x target/release/gitrun
          test "$(target/release/gitrun --version --gitrun)" = "GitRun $VERSION"
      - name: Save Rust common cache
        if: success() && steps.rust-common-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/cargo
            .gitrun-ci/rustup
          key: gitrun-${{ runner.os }}-${{ runner.arch }}-release-rust-v3-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Save release target cache
        if: success() && steps.release-target-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: gitrun-${{ runner.os }}-${{ runner.arch }}-release-target-v3-${{ env.RUST_VERSION }}-${{ steps.version.outputs.version_number }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}

      - name: Generate release SBOM and provenance
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gitrun-release-provenance"
          rm -rf "$root"
          mkdir -p "$root"
          cargo metadata --locked --format-version 1 > "$root/cargo-metadata.json"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg created "$created" --arg commit "$GITHUB_SHA" \
            '{spdxVersion:"SPDX-2.3", dataLicense:"CC0-1.0", SPDXID:"SPDXRef-DOCUMENT", name:"GitRun", documentNamespace:("https://github.com/Vider06/GitRun/spdx/" + $commit), creationInfo:{created:$created,creators:["Tool: GitRun CI"]}, packages:[.packages | to_entries[] | {SPDXID:("SPDXRef-Package-" + (.key|tostring)),name:.value.name,versionInfo:.value.version,downloadLocation:(.value.source // "NOASSERTION")}]}' \
            "$root/cargo-metadata.json" > "$root/sbom.spdx.json"
          jq -n \
            --arg git_commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg ref "$GITHUB_REF" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            '{schema:"gitrun.provenance.v1", git_commit:$git_commit, run_id:$run_id, workflow:$workflow, ref:$ref, runner_os:$runner_os, runner_arch:$runner_arch}' \
            > "$root/provenance.json"
          echo "PROVENANCE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Assemble release artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ env.RELEASE_TARGET }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gitrun-release"
          deb_root="$RUNNER_TEMP/gitrun-deb-root"
          rm -rf "$root" "$deb_root" "$RUNNER_TEMP/server-check"
          mkdir -p "$root/server" "$deb_root/DEBIAN" "$deb_root/usr/bin" "$deb_root/usr/libexec/gitrun" "$deb_root/usr/share/gitrun" "$deb_root/usr/share/doc/gitrun" "$deb_root/usr/share/applications"
          deb="GitRun-$VERSION-linux-x86_64-deb.deb"
          server_archive="GitRun-$VERSION-$TARGET-server.tar.gz"
          library_archive="library.zip"

          install -m 0755 target/release/gitrun "$root/server/gitrun"
          install -m 0644 version.txt "$root/server/version.txt"
          cp LICENSE README.md config/config.example.env "$root/server/"
          tar -C "$root/server" -czf "$root/$server_archive" .

          # The published Main Library archive intentionally contains only
          # .json.Back reference files. It never contains live secrets or
          # overwrites a user's installed JSON during Setup/Updater extraction.
          library_root="$RUNNER_TEMP/gitrun-library-archive"
          rm -rf "$library_root"
          mkdir -p "$library_root"
          library_sources=(
            "Core/Dockers/runners/linux-x86_64/profiles.json"
            "crates/gitrun-cli/src/cat/cat_states.json"
            "crates/gitrun-cli/src/cat/gitrun.json"
            "crates/gitrun-dashboard-tauri/package.json"
            "crates/gitrun-dashboard-tauri/package-lock.json"
            "crates/gitrun-dashboard-tauri/src-tauri/capabilities/default.json"
            "crates/gitrun-dashboard-tauri/src-tauri/tauri.conf.json"
            "crates/gitrun-recovery/capabilities/default.json"
            "crates/gitrun-recovery/tauri.conf.json"
            "release/release-manifest.example.json"
            "release/release-manifest.schema.json"
          )
          library_entries=()
          for source in "${library_sources[@]}"; do
            test -f "$source" || { echo "Missing Main Library source JSON: $source" >&2; exit 1; }
            jq -e 'type == "object" or type == "array"' "$source" >/dev/null
            destination="$library_root/$source.Back"
            mkdir -p "$(dirname "$destination")"
            install -m 0644 "$source" "$destination"
            library_entries+=("$source.Back")
          done
          (cd "$library_root" && zip -q -9 "$root/$library_archive" "${library_entries[@]}")
          test -s "$root/$library_archive"

          cat > "$deb_root/DEBIAN/control" <<CONTROL
          Package: gitrun
          Version: ${VERSION#v}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Vider06
          Description: GitRun self-hosted GitHub Actions runner manager
           Rust-native GitRun manager with CLI, scheduler, recovery and Tauri dashboard.
          CONTROL

          install -m 0755 target/release/gitrun "$deb_root/usr/bin/gitrun"
          install -m 0755 scripts/reinstall-latest.sh "$deb_root/usr/libexec/gitrun/reinstall-latest.sh"
          install -m 0755 scripts/uninstall.sh "$deb_root/usr/libexec/gitrun/uninstall.sh"
          install -m 0755 packaging/gitrun-prerm "$deb_root/DEBIAN/prerm"
          sh -n "$deb_root/DEBIAN/prerm"
          install -m 0644 version.txt "$deb_root/usr/share/gitrun/version.txt"
          install -m 0644 LICENSE "$deb_root/usr/share/doc/gitrun/LICENSE"
          install -m 0644 README.md "$deb_root/usr/share/doc/gitrun/README.md"
          install -m 0644 config/config.example.env "$deb_root/usr/share/doc/gitrun/config.example.env"
          install -m 0644 packaging/gitrun.desktop "$deb_root/usr/share/applications/gitrun.desktop"
          for spec in \
            "32:32" \
            "64:64" \
            "128:128" \
            "256:256" \
            "512:512"; do
            size="${spec%%:*}"
            input="assets/gitrun-icon-${size}.png"
            output="$deb_root/usr/share/icons/hicolor/${size}x${size}/apps/gitrun.png"
            mkdir -p "$(dirname "$output")"
            convert "$input" -alpha on -define png:color-type=6 "PNG32:$output"
          done
          dpkg-deb --build --root-owner-group "$deb_root" "$root/$deb" >/dev/null

          cp "$PROVENANCE_ROOT/cargo-metadata.json" "$root/cargo-metadata.json"
          cp "$PROVENANCE_ROOT/provenance.json" "$root/provenance.json"
          cp "$PROVENANCE_ROOT/sbom.spdx.json" "$root/sbom.spdx.json"
          metadata_sha="$(sha256sum "$root/cargo-metadata.json" | awk '{print $1}')"
          provenance_sha="$(sha256sum "$root/provenance.json" | awk '{print $1}')"
          sbom_sha="$(sha256sum "$root/sbom.spdx.json" | awk '{print $1}')"
          deb_sha="$(sha256sum "$root/$deb" | awk '{print $1}')"
          server_sha="$(sha256sum "$root/$server_archive" | awk '{print $1}')"
          library_sha="$(sha256sum "$root/$library_archive" | awk '{print $1}')"
          cat > "$root/release-manifest.json" <<JSON
          {
            "name": "GitRun",
            "version": "$VERSION",
            "git_commit": "$GITHUB_SHA",
            "repository": "Vider06/GitRun",
            "artifacts": [
              {
                "target": "$TARGET",
                "file": "$server_archive",
                "sha256": "$server_sha"
              },
              {
                "target": "library-json-backup",
                "file": "$library_archive",
                "sha256": "$library_sha"
              },
              {
                "target": "linux-x86_64-deb",
                "file": "$deb",
                "sha256": "$deb_sha"
              },
              {
                "target": "cargo-metadata",
                "file": "cargo-metadata.json",
                "sha256": "$metadata_sha"
              },
              {
                "target": "provenance",
                "file": "provenance.json",
                "sha256": "$provenance_sha"
              },
              {
                "target": "sbom-spdx",
                "file": "sbom.spdx.json",
                "sha256": "$sbom_sha"
              }
            ]
          }
          JSON

          {
            echo "root=$root"
            echo "deb=$deb"
            echo "server_archive=$server_archive"
            echo "library_archive=$library_archive"
          } >> "$GITHUB_OUTPUT"
      - name: Sign release manifest
        env:
          GITRUN_UPDATE_SIGNING_KEY_ID: ${{ vars.GITRUN_UPDATE_SIGNING_KEY_ID }}
          GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          ROOT: ${{ steps.artifacts.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GITRUN_UPDATE_SIGNING_KEY_ID" ]] || {
            echo "GITRUN_UPDATE_SIGNING_KEY_ID is required" >&2
            exit 1
          }
          [[ -n "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64" ]] || {
            echo "GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64 is required" >&2
            exit 1
          }
          command -v openssl >/dev/null 2>&1 || {
            echo "OpenSSL is required for Ed25519 release signing" >&2
            exit 1
          }
          key="$RUNNER_TEMP/gitrun-release-signing-key.der"
          public_key="$RUNNER_TEMP/gitrun-release-signing-public-key.der"
          public_key_hex="$RUNNER_TEMP/gitrun-release-signing-public-key.hex"
          payload="$RUNNER_TEMP/gitrun-manifest-signing-payload.json"
          signature="$RUNNER_TEMP/gitrun-manifest.sig"
          trap 'rm -f "$key" "$public_key" "$public_key_hex" "$payload" "$signature"' EXIT
          printf '%s' "$GITRUN_UPDATE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -inform DER -in "$key" -pubout -outform DER -out "$public_key"
          tail -c 32 "$public_key" | od -An -v -tx1 | tr -d '[:space:]' > "$public_key_hex"
          test "$(wc -c < "$public_key_hex")" -eq 64
          jq -S -c '. | del(.signature, .signature_key_id)' "$ROOT/release-manifest.json" | tr -d '\n' > "$payload"
          openssl pkeyutl -sign -rawin -inkey "$key" -keyform DER -in "$payload" -out "$signature"
          sig_hex="$(od -An -v -tx1 "$signature" | tr -d '[:space:]')"
          [[ "${#sig_hex}" -eq 128 ]] || {
            echo "Ed25519 signature was not 64 bytes" >&2
            exit 1
          }
          jq --arg sig "$sig_hex" --arg key_id "$GITRUN_UPDATE_SIGNING_KEY_ID"             '. + {signature:$sig, signature_key_id:$key_id}'             "$ROOT/release-manifest.json" > "$ROOT/release-manifest.json.tmp"
          mv "$ROOT/release-manifest.json.tmp" "$ROOT/release-manifest.json"
          {
            echo "GITRUN_UPDATE_PUBLIC_KEY_HEX=$(cat "$public_key_hex")"
            echo "GITRUN_UPDATE_PUBLIC_KEY_ID=$GITRUN_UPDATE_SIGNING_KEY_ID"
            echo "GITRUN_RELEASE_MANIFEST=$ROOT/release-manifest.json"
          } >> "$GITHUB_ENV"
          echo "Release manifest signature: PASS (GitHub Actions secret + Ed25519)"

      - name: Verify release manifest with GitRun updater
        shell: bash
        env:
          GITRUN_UPDATE_SIGNATURE_REQUIRED: "true"
        run: |
          set -euo pipefail
          test -n "$GITRUN_UPDATE_PUBLIC_KEY_HEX"
          test -n "$GITRUN_UPDATE_PUBLIC_KEY_ID"
          test -f "$GITRUN_RELEASE_MANIFEST"
          cargo test --locked -p gitrun-updater --test release_manifest_signature

          tampered="$RUNNER_TEMP/gitrun-release-manifest-tampered.json"
          jq '.version = (.version + "-tampered")' "$GITRUN_RELEASE_MANIFEST" > "$tampered"
          if GITRUN_RELEASE_MANIFEST="$tampered" cargo test --locked -p gitrun-updater --test release_manifest_signature; then
            echo "GitRun updater accepted a tampered signed manifest" >&2
            exit 1
          fi
          echo "Release manifest tamper rejection: PASS"

      - name: Verify release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITRUN_NO_CAT: "1"
          ROOT: ${{ steps.artifacts.outputs.root }}
          DEB: ${{ steps.artifacts.outputs.deb }}
          SERVER_ARCHIVE: ${{ steps.artifacts.outputs.server_archive }}
          LIBRARY_ARCHIVE: ${{ steps.artifacts.outputs.library_archive }}
        run: |
          set -euo pipefail
          deb="$ROOT/$DEB"
          server="$ROOT/$SERVER_ARCHIVE"
          library="$ROOT/$LIBRARY_ARCHIVE"
          test -f "$deb" && test -f "$server" && test -f "$library" && test -f "$ROOT/release-manifest.json"
          mapfile -t library_members < <(unzip -Z1 "$library")
          (("${#library_members[@]}" == 11)) || { echo "Expected 11 Main Library .json.Back entries, found ${#library_members[@]}" >&2; exit 1; }
          unique_members="$(printf '%s\\n' "${library_members[@]}" | sort -u | wc -l)"
          test "$unique_members" -eq "${#library_members[@]}" || { echo "library.zip contains duplicate members" >&2; exit 1; }
          for member in "${library_members[@]}"; do
            [[ "$member" == *.json.Back && "$member" != /* && "$member" != *".."* && "$member" != *\\* ]] || {
              echo "Unsafe or unexpected Main Library archive member: $member" >&2
              exit 1
            }
            unzip -p "$library" "$member" | jq -e 'type == "object" or type == "array"' >/dev/null
          done
          test -f "$ROOT/cargo-metadata.json" && test -f "$ROOT/provenance.json" && test -f "$ROOT/sbom.spdx.json"
          test "$(dpkg-deb -f "$deb" Version)" = "${VERSION#v}"
          test "$(dpkg-deb -c "$deb" | grep -Ec '/usr/bin/gitrun$')" -eq 1
          dpkg-deb --contents "$deb" | grep -E '/usr/libexec/gitrun/reinstall-latest\.sh$'
          dpkg-deb --contents "$deb" | grep -E '/usr/libexec/gitrun/uninstall\.sh$'
          dpkg-deb --control "$deb" "$RUNNER_TEMP/gitrun-deb-control"
          test -x "$RUNNER_TEMP/gitrun-deb-control/prerm"
          if grep -Fq -- '--uninstall-package-hook' "$RUNNER_TEMP/gitrun-deb-control/prerm"; then
            echo "package prerm must not invoke the destructive uninstall hook on ordinary package removal" >&2
            exit 1
          fi
          grep -Fq -- 'systemctl disable --now' "$RUNNER_TEMP/gitrun-deb-control/prerm"
          if dpkg-deb -c "$deb" | grep -Eq '/(gitrun-recovery|gitrun-dashboard-tauri)(\.exe)?$'; then
            echo "release package contains a retired secondary executable" >&2
            exit 1
          fi
          dpkg-deb --contents "$deb" | grep -E '/usr/share/applications/gitrun\.desktop$'
          dpkg-deb --contents "$deb" | grep -E '/usr/share/gitrun/version\.txt$'

          rm -rf "$RUNNER_TEMP/server-check"
          mkdir -p "$RUNNER_TEMP/server-check"
          tar -xzf "$server" -C "$RUNNER_TEMP/server-check"
          test -x "$RUNNER_TEMP/server-check/gitrun"
          test "$(find "$RUNNER_TEMP/server-check" -type f -perm /111 | wc -l)" -eq 1
          test "$(cat "$RUNNER_TEMP/server-check/version.txt")" = "${VERSION#v}"
          test "$(target/release/gitrun --version --gitrun)" = "GitRun ${VERSION#v}"

          command -v jq >/dev/null 2>&1
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" '.name == "GitRun" and .version == $version and .git_commit == $commit and (([.artifacts[].target] | sort) == ["cargo-metadata", "library-json-backup", "linux-x86_64-deb", "provenance", "sbom-spdx", "x86_64-unknown-linux-gnu"]) and (.artifacts | length == 6) and all(.artifacts[]; (.sha256 | test("^[0-9a-f]{64}$")) and (.file | test("^[^/\\\\]+$")))' "$ROOT/release-manifest.json" >/dev/null
          echo "Release manifest: PASS"
      - name: Generate release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/gitrun-release-notes.md"
          generated="$RUNNER_TEMP/gitrun-generated-notes.md"

          # Ask GitHub to build the compare/PR changelog for this exact tag.
          # Keep release publication working even when GitHub has no generated
          # notes (for example, for an initial release or a tag with no PRs).
          if gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > "$generated"; then
            :
          else
            echo "GitHub-generated changelog unavailable; publishing the release with the artifact summary only."
            : > "$generated"
          fi

          {
            echo "# GitRun $VERSION"
            echo
            echo "GitRun is a Rust-native manager for self-hosted GitHub Actions runners."
            echo
            echo "This release was built from commit [\`$GITHUB_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
            echo
            echo "## Downloads"
            echo
            echo "| File | Purpose |"
            echo "| --- | --- |"
            echo "| [GitRun-$VERSION-linux-x86_64-deb.deb](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/GitRun-$VERSION-linux-x86_64-deb.deb) | Debian/Ubuntu amd64 package |"
            echo "| [GitRun-$VERSION-$RELEASE_TARGET-server.tar.gz](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/GitRun-$VERSION-$RELEASE_TARGET-server.tar.gz) | Standalone Linux x86_64 server archive |"
            echo "| [release-manifest.json](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/release-manifest.json) | Signed manifest with SHA-256 hashes for release artifacts |"
            echo "| [library.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/library.zip) | Signed-manifest-verified JSON.Back reference library |"
            echo "| [sbom.spdx.json](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/sbom.spdx.json) | SPDX software bill of materials |"
            echo "| [provenance.json](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/provenance.json) | Build provenance metadata |"
            echo "| [cargo-metadata.json](https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/cargo-metadata.json) | Cargo dependency metadata used for the build |"
            echo
            echo "## Integrity and supply-chain information"
            echo
            echo "- The release manifest is signed with Ed25519 and verified by the release workflow."
            echo "- The manifest records SHA-256 hashes for the distributable artifacts and metadata."
            echo "- The SBOM, provenance record, and Cargo metadata are published alongside the binaries for inspection."
            echo
            echo "Verify downloaded files against the SHA-256 values in \`release-manifest.json\` before installing or distributing them. The manifest signature can be checked with the public key configured for GitRun's updater."
            echo
            echo "## Changes"
            echo
            if [ -s "$generated" ] && [ -n "$(tr -d '[:space:]' < "$generated")" ]; then
              cat "$generated"
            else
              echo "GitHub did not return an automatic changelog for this tag. Review the [compare view](https://github.com/$GITHUB_REPOSITORY/compare/$(git describe --tags --abbrev=0 "$GITHUB_SHA"^ 2>/dev/null || echo main)...$VERSION) and the linked pull requests for changes."
            fi
            echo
            echo "---"
            echo
            echo "For installation and configuration instructions, see the [README](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/README.md) and the example configuration included with the server archive."
          } > "$notes"

          test -s "$notes"
          echo "Release notes prepared: $(wc -l < "$notes") lines"
          echo "notes_file=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ROOT: ${{ steps.artifacts.outputs.root }}
          DEB: ${{ steps.artifacts.outputs.deb }}
          SERVER_ARCHIVE: ${{ steps.artifacts.outputs.server_archive }}
          LIBRARY_ARCHIVE: ${{ steps.artifacts.outputs.library_archive }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "$ROOT/$DEB"
            "$ROOT/$SERVER_ARCHIVE"
            "$ROOT/$LIBRARY_ARCHIVE"
            "$ROOT/cargo-metadata.json"
            "$ROOT/provenance.json"
            "$ROOT/sbom.spdx.json"
            "$ROOT/release-manifest.json"
          )

          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Re-runs repair/update the same release instead of leaving stale notes.
            gh release edit "$VERSION" --title "GitRun $VERSION" --notes-file "$NOTES_FILE"
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "GitRun $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
