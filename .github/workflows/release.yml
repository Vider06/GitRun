name: GitRun Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.4.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: gitrun-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitRun
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 60
    env:
      DOCKER_CONFIG: /tmp/gitrun-docker-config
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          [[ "$version" =~ ^v[0-9]+.[0-9]+.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: true

      - name: Build GitRun
        run: cargo build --release -p gitrun-cli --bin gitrun

      - name: Verify single executable
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/gitrun
          file target/release/gitrun || true
          ls -lh target/release/gitrun

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" target/release/gitrun --clobber
          else
            gh release create "$VERSION" target/release/gitrun               --title "GitRun $VERSION"               --generate-notes
          fi
