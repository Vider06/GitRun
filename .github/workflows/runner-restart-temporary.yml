name: GitRun Temporary Runner Restart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    name: Restart and refresh GitRun runner containers
    runs-on: [main]
    timeout-minutes: 20
    steps:
      - name: Install temporary Docker CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v docker >/dev/null 2>&1; then
            docker --version
          else
            version="29.1.3"
            arch="$(uname -m)"
            case "$arch" in
              x86_64) docker_arch="x86_64" ;;
              aarch64) docker_arch="aarch64" ;;
              *) echo "Unsupported architecture: $arch"; exit 1 ;;
            esac

            mkdir -p "$RUNNER_TEMP/docker-cli"
            curl -fsSL "https://download.docker.com/linux/static/stable/${docker_arch}/docker-${version}.tgz" \
              -o "$RUNNER_TEMP/docker.tgz"
            tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP/docker-cli" --strip-components=1
            echo "$RUNNER_TEMP/docker-cli" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/docker-cli/docker" --version
          fi

      - name: Check Docker socket
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -S /var/run/docker.sock ]]; then
            echo "ERROR: /var/run/docker.sock is not mounted in this runner."
            echo "This workflow must run on a GitRun runner with access to the host Docker socket."
            exit 1
          fi

          export DOCKER_HOST=unix:///var/run/docker.sock
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info --format 'Docker server: {{.ServerVersion}}'

      - name: Build current GitRun runner image
        shell: bash
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          docker build --network=host -f docker/runner/Dockerfile -t gitrun-runner:latest .

      - name: Refresh temporary runner containers
        shell: bash
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail

          latest_image_id="$(docker image inspect --format '{{.Id}}' gitrun-runner:latest)"
          socket_gid="$(stat -c '%g' /var/run/docker.sock)"
          refreshed=0
          restarted=0
          containers="$(docker ps -a --filter 'name=^/gitrun-' --format '{{.Names}}' | grep -E '^gitrun-manual-[0-9]+$' || true)"

          if [ -z "$containers" ]; then
            echo "No gitrun-manual-* containers found."
            exit 0
          fi

          get_env() {
            name="$1"
            key="$2"
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$name" |
              sed -n "s/^$key=//p" |
              tail -n 1
          }

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            current_image_id="$(docker inspect -f '{{.Image}}' "$name")"

            if [ "$current_image_id" = "$latest_image_id" ]; then
              echo "Runner $name already uses gitrun-runner:latest; restarting..."
              docker restart "$name"
              restarted=$((restarted + 1))
              continue
            fi

            echo "Runner $name uses a stale image; recreating from gitrun-runner:latest."

            runner_url="$(get_env "$name" RUNNER_URL)"
            runner_name="$(get_env "$name" RUNNER_NAME)"
            runner_labels="$(get_env "$name" RUNNER_LABELS)"
            runner_ephemeral="$(get_env "$name" RUNNER_EPHEMERAL)"
            runner_disable_update="$(get_env "$name" RUNNER_DISABLE_UPDATE)"

            [ -n "$runner_url" ] || { echo "RUNNER_URL missing in $name"; exit 1; }
            [ -n "$runner_name" ] || runner_name="$name"
            [ -n "$runner_labels" ] || runner_labels="self-hosted,Linux,X64,gitrun-temporary"
            [ -n "$runner_ephemeral" ] || runner_ephemeral="false"
            [ -n "$runner_disable_update" ] || runner_disable_update="false"

            state_dir="$(mktemp -d "$RUNNER_TEMP/gitrun-runner-state.XXXXXX")"

            docker stop "$name" >/dev/null
            docker cp "$name:/home/runner/actions-runner/.runner" "$state_dir/.runner"
            docker cp "$name:/home/runner/actions-runner/.credentials" "$state_dir/.credentials"
            docker cp "$name:/home/runner/actions-runner/.credentials_rsaparams" "$state_dir/.credentials_rsaparams"
            docker rm "$name" >/dev/null

            docker create               --name "$name"               --restart unless-stopped               --volume /var/run/docker.sock:/var/run/docker.sock               --group-add "$socket_gid"               -e "RUNNER_URL=$runner_url"               -e "RUNNER_TOKEN=restored-registration"               -e "RUNNER_NAME=$runner_name"               -e "RUNNER_LABELS=$runner_labels"               -e "RUNNER_EPHEMERAL=$runner_ephemeral"               -e "RUNNER_DISABLE_UPDATE=$runner_disable_update"               gitrun-runner:latest >/dev/null

            docker cp "$state_dir/.runner" "$name:/home/runner/actions-runner/.runner"
            docker cp "$state_dir/.credentials" "$name:/home/runner/actions-runner/.credentials"
            docker cp "$state_dir/.credentials_rsaparams" "$name:/home/runner/actions-runner/.credentials_rsaparams"
            rm -rf "$state_dir"
            docker start "$name" >/dev/null

            ok=0
            for i in $(seq 1 12); do
              if docker exec "$name" pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' >/tmp/gitrun-pwsh-version 2>/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done

            [ "$ok" -eq 1 ] || {
              echo "PowerShell is still unavailable in $name."
              docker logs --tail 50 "$name" || true
              exit 1
            }

            docker exec "$name" pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
            refreshed=$((refreshed + 1))
          done <<< "$containers"

          echo "Runner refresh complete: refreshed=$refreshed restarted=$restarted"

      - name: Verify temporary runner tools
        shell: bash
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          containers="$(docker ps --format '{{.Names}}' | grep -E '^gitrun-manual-[0-9]+$' || true)"
          if [ -z "$containers" ]; then
            echo "No gitrun-manual-* containers found after refresh."
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "== $name =="
            docker exec "$name" pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
            docker exec "$name" python3 --version
            docker exec "$name" rustc --version
            docker exec "$name" docker --version
          done <<< "$containers"
