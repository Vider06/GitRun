name: Rustfmt autofix

on:
  push:
    branches: ["audit/docker-manager-hardening"]

permissions:
  contents: write

jobs:
  rustfmt:
    name: Apply rustfmt
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore Rust toolchain cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gitrun-ci/rustup
            .gitrun-ci/cargo/bin
          key: gitrun-e1-Linux-X64-rustup-1.98.1-rustfmt+clippy

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.gitrun-ci"
          export CARGO_HOME="$root/cargo"
          export RUSTUP_HOME="$root/rustup"
          export TMPDIR="$root/tmp"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$TMPDIR"
          if [ -x "$CARGO_HOME/bin/rustup" ]; then
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail               https://sh.rustup.rs -o "$TMPDIR/rustup-init.sh"
            sh "$TMPDIR/rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1

      - name: Apply rustfmt
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$GITHUB_WORKSPACE/.gitrun-ci/cargo"
          export RUSTUP_HOME="$GITHUB_WORKSPACE/.gitrun-ci/rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustfmt --version
          cargo fmt --all
          if git diff --quiet --exit-code; then
            echo "rustfmt: already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
