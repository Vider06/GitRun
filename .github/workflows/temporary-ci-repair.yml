name: Temporary CI repair

on:
  push:
    branches: [BigRework]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[ci-repair]')"
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Repair formatting and Cargo lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rustup-tmp" "$RUNNER_TEMP/cargo" "$RUNNER_TEMP/rustup"
          export TMPDIR="$RUNNER_TEMP/rustup-tmp"
          export CARGO_HOME="$RUNNER_TEMP/cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          mkdir -p "$CARGO_TARGET_DIR"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --no-modify-path
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          cargo fmt --all
          cargo update -p jsonwebtoken --precise 10.3.0
          cargo fmt --all -- --check
          cargo metadata --all-features --locked --format-version 1 >/dev/null
      - name: Commit repairs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Cargo.lock ':(glob)crates/**/*.rs'; then
            echo "No repair changes required."
            exit 0
          fi
          git add Cargo.lock ':(glob)crates/**/*.rs'
          git commit -m "ci: repair formatting and Cargo lock [ci-repair]"
          git push origin HEAD:BigRework
