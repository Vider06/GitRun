name: Test RDP authentication v3

on:
  push:
    branches:
      - fix/setup-chown-uid

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, gitrun-temporary]
    timeout-minutes: 10
    env:
      SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      RDP_USERNAME: vider06
    steps:
      - name: Install headless RDP test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo -S -p '' apt-get update <<< "$SUDO_PASSWORD"
          sudo -S -p '' apt-get install -y freerdp2-x11 xvfb <<< "$SUDO_PASSWORD"

      - name: Test RDP authentication
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(printf '%s\n' "$RDP_PASSWORD" |             xvfb-run -a xfreerdp               /v:127.0.0.1:3389               /u:"$RDP_USERNAME"               /from-stdin:force               /auth-only               /network:auto               /cert:ignore               /timeout:5000               2>&1)
          rc=$?
          set -e

          printf '%s\n' "$output"

          if printf '%s\n' "$output" | grep -Eiq 'ERRCONNECT_LOGON_FAILURE|STATUS_LOGON_FAILURE|authentication failed|logon failure'; then
            echo "RDP server rejected the supplied credentials."
            exit 1
          fi

          if printf '%s\n' "$output" | grep -Eiq 'authentication only|authentication succeeded|authenticated'; then
            echo "RDP authentication succeeded."
            exit 0
          fi

          echo "FreeRDP exit code: $rc"
          exit "$rc"
