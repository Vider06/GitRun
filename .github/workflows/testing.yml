name: Premade Testing

on:
  push:
    branches: [feat/gitrun-premade]
  pull_request:
    branches: [feat/gitrun-premade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash Testing/Core/manifest-test.sh
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash Testing/Dockers/test-runner-image.sh
  vm-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash Testing/VM-Images/test-layout.sh
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash Testing/Integration/test-premade-integrity.sh
