name: Validate Premade

on:
  push:
    branches: [feat/gitrun-premade]
  pull_request:
    branches: [feat/gitrun-premade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Validate structure and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash Testing/Integration/test-premade-integrity.sh
      - run: bash Testing/Core/manifest-test.sh
  workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
  docker:
    name: Validate Docker definitions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(find Dockers -type f -name Dockerfile -print)
          test "${#dockerfiles[@]}" -gt 0
          for dockerfile in "${dockerfiles[@]}"; do
            docker buildx build --check --platform linux/amd64 "$(dirname "$dockerfile")"
          done
