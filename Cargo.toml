[workspace]
resolver = "2"
members = ["crates/gitrun-core","crates/gitrun-cli","crates/gitrun-setup","crates/gitrun-updater","crates/gitrun-recovery","crates/gitrun-scheduler","crates/gitrun-vault","crates/gitrun-gsr","crates/gitrun-dashboard-tauri/src-tauri"]
default-members = ["crates/gitrun-core","crates/gitrun-cli","crates/gitrun-setup","crates/gitrun-updater","crates/gitrun-recovery","crates/gitrun-scheduler","crates/gitrun-vault","crates/gitrun-gsr"]


[patch.crates-io]
# GLib 0.18.5 contains RUSTSEC-2024-0429. GTK3/Tauri 2 cannot move to glib >=0.20
# without the GTK4/WebKitGTK 6 migration. Pin the byte-identical upstream backport
# until an official glib 0.18.6 release is available.
glib = { git = "https://github.com/jcfs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
glib-sys = { git = "https://github.com/jcfs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
gobject-sys = { git = "https://github.com/jcfs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
gio-sys = { git = "https://github.com/jcfs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
glib-macros = { git = "https://github.com/jcfs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
