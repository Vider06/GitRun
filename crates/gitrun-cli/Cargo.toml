[package]
name = "gitrun-cli"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
description = "Command-line interface for GitRun"

[[bin]]
name = "gitrun"
path = "src/main.rs"

[dependencies]
gitrun-scheduler = { path = "../gitrun-scheduler" }
gitrun-core = { path = "../gitrun-core" }
gitrun-gsr = { path = "../gitrun-gsr" }
gitrun-setup = { path = "../gitrun-setup" }
gitrun-updater = { path = "../gitrun-updater" }
gitrun-recovery = { path = "../gitrun-recovery" }
gitrun-dashboard-tauri = { path = "../gitrun-dashboard-tauri/src-tauri" }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "scrolling-regions", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
