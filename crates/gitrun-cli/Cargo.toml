[package]
name = "gitrun-cli"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "gitrun"
path = "src/main.rs"

[dependencies]
gitrun-scheduler = { path = "../gitrun-scheduler" }
gitrun-core = { path = "../gitrun-core" }
gitrun-setup = { path = "../gitrun-setup" }
gitrun-updater = { path = "../gitrun-updater" }
gitrun-dashboard = { path = "../gitrun-dashboard" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
