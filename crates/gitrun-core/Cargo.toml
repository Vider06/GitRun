[package]
name = "gitrun-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust core primitives for GitRun"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
