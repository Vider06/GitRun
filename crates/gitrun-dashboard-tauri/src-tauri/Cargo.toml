[package]
name = "gitrun-dashboard-tauri"
version = "0.11.9"
edition = "2021"
rust-version = "1.99.0"
description = "GitRun dashboard: Tauri-based operator UI"

[lib]
name = "gitrun_dashboard_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitrun-management = { path = "../../gitrun-management", features = ["desktop"] }
gitrun-platform = { path = "../../gitrun-platform" }
tauri = { version = "2", features = [] }
