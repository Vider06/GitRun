[[permission]]
identifier = "dashboard-commands"
description = "Allows the GitRun dashboard frontend to invoke its application commands."
commands.allow = [
  "is_first_run",
  "run_first_setup",
  "uninstall_gitrun",
  "get_overview",
  "get_dashboard_health",
  "check_gitrun_updates",
  "get_runner_snapshot",
  "get_host_resource_snapshot",
  "get_repository_activity",
  "list_service_logs",
  "list_vm_configs",
  "control_gitrun_service",
  "save_dashboard_settings",
  "update_permanent_runners",
  "get_repo_detail",
  "list_vault_secrets",
  "set_vault_secret",
  "delete_vault_secret",
  "get_gsr_status",
  "list_gsr_events",
  "get_zizmor_info",
  "accept_zizmor_license_and_install",
  "disable_zizmor",
  "save_logic_rules",
  "list_pending_hypervisor_decisions",
  "respond_hypervisor_decision",
  "get_config",
  "get_security_runtime_summary",
  "save_config",
  "get_gitrun_settings",
  "save_gitrun_settings",
  "get_repo_api_policies",
  "get_dock_requirements",
  "list_vm_configs",
  "save_vm_config",
  "secure_private_key",
]
