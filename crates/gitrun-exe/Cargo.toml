[package]
name = "gitrun-exe"
version = "0.3.6"
edition = "2021"
license = "Apache-2.0"
description = "Internal GitRun execution engine for authorized Git*Run operations"

[dependencies]
vstd = "=0.0.0-2026-11-01-0251"
gitrun-core = { path = "../gitrun-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }

[package.metadata.verus]
verify = true
