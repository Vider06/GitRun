[package]
name = "gitrun-gsr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GSR (GitSecureRun): external watchdog + hardening layer for GitRun's runner processes"

[dependencies]
gitrun-core = { path = "../gitrun-core" }
gitrun-exe = { path = "../gitrun-exe" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"

[[bin]]
name = "gitrun-gsr"
path = "src/main.rs"

[[bin]]
name = "gitrun-gsr-agent"
path = "src/bin/gitrun-gsr-agent.rs"


[[bin]]
name = "gitrun-api"
path = "src/bin/gitrun-api.rs"
