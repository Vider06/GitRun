[package]
name = "gitrun-gsr"
version = "0.6.8"
edition = "2021"
license = "Apache-2.0"
description = "GSR (GitSecureRun): external watchdog + hardening layer for GitRun's runner processes"

[dependencies]
vstd = "=0.0.0-2026-11-01-0251"
gitrun-core = { path = "../gitrun-core" }
gitrun-platform = { path = "../gitrun-platform" }
gitrun-exe = { path = "../gitrun-exe" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"

[[bin]]
name = "gitrun-gsr"
path = "src/main.rs"

[[bin]]
name = "gitrun-gsr-agent"
path = "src/bin/gitrun-gsr-agent.rs"


[[bin]]
name = "gitrun-api"
path = "src/bin/gitrun-api.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }

[package.metadata.verus]
verify = true
