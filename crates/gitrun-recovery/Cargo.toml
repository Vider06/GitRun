[package]
name = "gitrun-recovery"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "GitRun startup integrity checks, recovery orchestration and minimal repair UI"

[dependencies]
gitrun-core = { path = "../gitrun-core" }
gitrun-scheduler = { path = "../gitrun-scheduler" }
gitrun-updater = { path = "../gitrun-updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
