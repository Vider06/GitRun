[package]
name = "gitrun-recovery"
version = "0.6.17"
edition = "2021"
license = "Apache-2.0"
description = "GitRun startup integrity checks, recovery orchestration and minimal repair UI"

[features]
default = []
desktop = ["dep:tauri"]

[dependencies]
gitrun-core = { path = "../gitrun-core" }
gitrun-platform = { path = "../gitrun-platform" }
gitrun-scheduler = { path = "../gitrun-scheduler" }
gitrun-updater = { path = "../gitrun-updater" }
gitrun-setup = { path = "../gitrun-setup" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "gitrun-recovery"
path = "src/main.rs"
required-features = ["desktop"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }
