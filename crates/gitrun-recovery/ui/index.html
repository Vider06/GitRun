<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitRun Recovery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <div>
        <div class="eyebrow">GITRUN</div>
        <h1>Recovery</h1>
      </div>
      <div id="health" class="pill">Checking…</div>
    </header>
    <p id="summary" class="summary">Inspecting the installation.</p>
    <section id="issues" class="issues"></section>
    <section class="actions">
      <button id="gtuu" class="primary">Run GTUU</button>
      <button id="service">Repair service</button>
      <button id="dashboard">Open dashboard</button>
      <button id="refresh">Re-check</button>
    </section>
    <footer id="meta"></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
