[package]
name = "gitrun-setup"
version = "0.9.17"
edition = "2021"
license = "Apache-2.0"
description = "Host dependency and setup checks for GitRun"

[dependencies]
gitrun-core = { path = "../gitrun-core" }
gitrun-updater = { path = "../gitrun-updater" }
thiserror = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.11"
