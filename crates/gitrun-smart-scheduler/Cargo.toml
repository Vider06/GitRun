[package]
name = "gitrun-smart-scheduler"
version = "0.4.5"
edition = "2021"
license = "Apache-2.0"
description = "Optional, bounded predictive workload model for GitRun"

[dependencies]
vstd = "=0.0.0-2026-11-01-0251"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }

[package.metadata.verus]
verify = true
