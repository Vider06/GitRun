[package]
name = "gitrun-updater"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "GitRun release update, dependency and rollback manager"

[dependencies]
gitrun-core = { path = "../gitrun-core" }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
zip = "4"
