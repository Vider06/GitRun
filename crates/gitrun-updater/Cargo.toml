[package]
name = "gitrun-updater"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "GitRun release update, dependency and rollback manager"

[dependencies]
gitrun-core = { path = "../gitrun-core" }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
zip = "8"
