[package]
name = "gitrun-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GitVault: encrypted secret storage shared across GitRun runner containers"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
