[package]
name = "gitrun-vault"
version = "0.4.6"
edition = "2021"
license = "Apache-2.0"
description = "GitVault: encrypted secret storage shared across GitRun runner containers"

[dependencies]
vstd = "=0.0.0-2026-11-01-0251"
aes-gcm = "0.11.1"
base64 = "0.23"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
sha2 = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }

[package.metadata.verus]
verify = true
