[package]
name = "gitrun-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GitVault: encrypted secret storage shared across GitRun runner containers"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
