services:
  gitrun-manager:
    build:
      context: .
      dockerfile: docker/manager/Dockerfile
    container_name: gitrun-manager
    restart: unless-stopped
    env_file:
      - /etc/gitrun/gitrun.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/gitrun:/var/lib/gitrun
      - /var/log/gitrun:/var/log/gitrun
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; raise SystemExit(0 if os.path.exists('/var/run/docker.sock') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
